agement.ucsf.edu/about-us.\u003c/li\u003e\n    \u003cli\u003eTravers R, Pyne J, Bauer G, Munro L, Giambrone B, Hammond R, et al. \u0026lsquo;Community control\u0026rsquo; in CBPR: Challenges experienced and questions raised from the Trans PULSE project. Action Research. 2013;11(4):403-22.\u003c/li\u003e\n\u003c/ol\u003e"},{"header":"Tables","content":"\u003ctable border=\"1\" cellspacing=\"0\" cellpadding=\"0\"\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"3\"\u003e\n                \u003cp\u003e\u003cstrong\u003eTable 1: Overview of Design Process and Results\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"10.24%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eExercise\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"36.96%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eDescription\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"52.8%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eOverall Design Impact\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"3\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eDesign Session 1\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"10.24%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;1.1\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"36.96%\" valign=\"top\"\u003e\n                \u003cp\u003ehow the tool could benefit and empower users\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"52.8%\" rowspan=\"5\"\u003e\n                \u003cp\u003eGoal of tool: Increase the transparency of D4DS and accessibility to multiple audiences, and foster collaboration.\u003c/p\u003e\n                \u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n                \u003cp\u003ePrimary users of the tool: researchers (with various level of D\u0026amp;I knowledge/background)\u003c/p\u003e\n                \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n                \u003cp\u003e35 potential features\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e1.2\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003ewho might benefit from using this tool\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e1.3\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003epersona creation and value proposition generation exercise\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;1.4\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003eFree listing possible features\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;1.5\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003ePrioritizing features\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"3\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eDesign Session 2\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"10.24%\" valign=\"top\"\u003e\n                \u003cp\u003e2.1\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"36.96%\" valign=\"top\"\u003e\n                \u003cp\u003eKano Methodology\u003csup\u003e2\u003c/sup\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"52.8%\" rowspan=\"4\" valign=\"top\"\u003e\n                \u003cp\u003e13 features selected\u003c/p\u003e\n                \u003cp\u003eKey content areas: dissemination; education/literature; grant language; partner engagement; sustainability planning; methods\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;2.2\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003efree list any other feature ideas and identify their favorite feature from the Kano survey\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;2.3\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003egrouped features into content areas for learning\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"21.694915254237287%\" valign=\"top\"\u003e\n                \u003cp\u003e\u0026nbsp;2.4\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"78.30508474576271%\" valign=\"top\"\u003e\n                \u003cp\u003eprioritized the most important content areas\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"3\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eDesign Sessions 3-5\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"10.24%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003e\u003cem\u003e\u0026nbsp;\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"36.96%\" valign=\"top\"\u003e\n                \u003cp\u003eiteratively envisioning and creating wireframes of the features that were prioritized\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"52.8%\" valign=\"top\"\u003e\n                \u003cp\u003eWireframes for 1) account creation, 2) a questionnaire that would allow users to set-up a project and guide them on how best to use the tool, 3) a roadmap or visual process that walks the users through the D4DS process, 4) and the landing page.\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"3\" valign=\"top\"\u003e\n                \u003cp\u003e\u003csup\u003e1\u003c/sup\u003e Persona creation is defining different user types that might use our tool and how they may interact and benefit from the tool.\u003c/p\u003e\n                \u003cp\u003e\u003csup\u003e2\u003c/sup\u003e Kano Methodology is a survey used to prioritize potential features. (28, 29) The model classifies features as Must-have (i.e., I expect it and would be dissatisfied without it), One-dimensional (i.e., I expect it), Attractive (i.e., I like it), and Indifferent (i.e., I\u0026rsquo;m neutral).\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\n\u003ctable border=\"1\" cellspacing=\"0\" cellpadding=\"0\" align=\"left\"\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"2\"\u003e\n                \u003cp\u003e\u003cstrong\u003eTable 2: Kano Survey Results\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"35.3448275862069%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eClassification\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"64.65517241379311%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eFeature/Functionality\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"35.3448275862069%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eMust-have\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n                \u003cp\u003eA user expects this feature to be implemented and they would be dissatisfied if the feature was not available\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"64.65517241379311%\" valign=\"top\"\u003e\n                \u003col\u003e\n                    \u003cli\u003e\u003cstrong\u003eprominent links to other resources\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                \u003c/ol\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"35.3448275862069%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eAttractive\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n                \u003cp\u003eA user may or not expect this feature but it would make them satisfied if it is implemented\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"64.65517241379311%\" valign=\"top\"\u003e\n                \u003col\u003e\n                    \u003cli\u003e\u003cstrong\u003ea step-by-step guide to applying D4DS (aka roadmap)\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ea questionnaire that guides users to the content\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003etemplate of language for funding proposals\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ea template of how best to engage with partners\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ea fillable form of a research plan\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003emethods at each stage of the research process\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ean account to save a user\u0026rsquo;s work\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003esearch for examples of grant section, case studies\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ecustomizable figure of a common model/theory/framework\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003esearch methods within topics and each stage of the design process\u003c/li\u003e\n                    \u003cli\u003eallows users to contribute content (e.g., case examples)\u003c/li\u003e\n                    \u003cli\u003etestimonials about users\u0026rsquo; experiences\u0026nbsp;\u003c/li\u003e\n                    \u003cli\u003ea blank roadmap that could be used during partner engagement\u0026nbsp;\u003c/li\u003e\n                    \u003cli\u003ea tab specifically for community partners\u0026nbsp;\u003c/li\u003e\n                    \u003cli\u003eprovides images/icons for infographic development\u0026nbsp;\u003c/li\u003e\n                    \u003cli\u003ean interactive social network map of users of this tool\u003c/li\u003e\n                \u003c/ol\u003e\n                \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"35.3448275862069%\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eIndifferent\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n                \u003cp\u003eA user has a neutral opinion about whether a feature is implemented\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"64.65517241379311%\" valign=\"top\"\u003e\n                \u003col\u003e\n                    \u003cli\u003eshort video presentations showing engagement methods or examples\u0026nbsp;\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003eopportunities to provide feedback via a \u0026lsquo;contact us\u0026rsquo; interface\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003ehas a large list of dissemination and sustainability literature\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003e\u003cstrong\u003eallow users to search a database for references/literature by topic\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n                    \u003cli\u003eits twitter account so users can interact with developers of the web tool and with other users\u003c/li\u003e\n                    \u003cli\u003ean embedded twitter account\u003c/li\u003e\n                    \u003cli\u003eopportunities to provide feedback via a pop-up survey\u003c/li\u003e\n                \u003c/ol\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"2\" valign=\"top\"\u003e\n                \u003cp\u003e*no features classified as one-dimensional\u003c/p\u003e\n                \u003cp\u003e*bolded items indicates those that were ultimately included in the tool.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003ctable border=\"1\" cellspacing=\"0\" cellpadding=\"0\" width=\"624\"\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"4\" valign=\"top\"\u003e\n                \u003cp\u003e\u003cstrong\u003eTable 3\u003c/strong\u003e: Summary of think-aloud usability testing results\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"12.5%\"\u003e\n                \u003cp\u003e\u003cstrong\u003ePrompt\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"25.96153846153846%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eAcademics\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"32.69230769230769%\"\u003e\n                \u003cp\u003e\u003cstrong\u003ePractitioners\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"28.846153846153847%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eExperts\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"12.5%\" valign=\"top\"\u003e\n                \u003cp\u003eWhat works well in the D4DS web tool?\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"25.96153846153846%\" valign=\"top\"\u003e\n                \u003cp\u003eAcademics liked that the D4DS Planner was action oriented and flexible to meet their project needs. Academics felt supported in this process by key features in the tool (e.g., key definitions, guidance questionnaires).\u0026nbsp;\u003c/p\u003e\n                \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"32.69230769230769%\"\u003e\n                \u003cp\u003ePractitioners liked how clear it was to use the different components of the tool including the account creation/login, navigating the landing page and action planner, and project creation. The clarity was enhanced by the clear instructions on how to use the action planner and ease of finding information. Practitioners also liked how the web tool is visually appealing.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"28.846153846153847%\"\u003e\n                \u003cp\u003eUsers liked the visual aesthetic of the tool, felt it was organized in a logical manner, and believed there were good resources that supported the user in how to use the web tool.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"12.5%\" valign=\"top\"\u003e\n                \u003cp\u003eWhat are the significant pain points in the D4DS web tool?\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"25.96153846153846%\" valign=\"top\"\u003e\n                \u003cp\u003eLocating features and clarity on where to go within the D4DS tool was challenging. Setting up the project required additional clarity and parsimony.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"32.69230769230769%\" valign=\"top\"\u003e\n                \u003cp\u003eThe three major pain points for practitioners were the delay in receiving the verification email, difficulty in answering some questions in the project set up (i.e. budget, main objectives) and that some parts of the tool were wordy (i.e. guidance).\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"28.846153846153847%\" valign=\"top\"\u003e\n                \u003cp\u003eThe layout of the pages can be challenging because the user does not know to scroll down. There is tension between layperson language and jargon. There is too much language in general throughout the web tool, although users asked for directions to guide their interactions.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"12.5%\" valign=\"top\"\u003e\n                \u003cp\u003eWhat changes do users want to see in the D4DS web tool?\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"25.96153846153846%\" valign=\"top\"\u003e\n                \u003cp\u003eMore guidance, tutorials, and examples to support users with get started and how to use the tool were requested. The use of simple language and project set-up requirements were a priority.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"32.69230769230769%\" valign=\"top\"\u003e\n                \u003cp\u003eMore information about setting up an account and project is needed. Reducing the amount of wording in the guidance section of the tool could enhance the readability.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"28.846153846153847%\" valign=\"top\"\u003e\n                \u003cp\u003eMany of the changes have to do with the content or the jargon of the field. This presents a challenge. Because it is a specialized field and the point of the tool is to teach the language of the field, in addition to planning for projects.\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"12.5%\" valign=\"top\"\u003e\n                \u003cp\u003eGeneral usability comments\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"25.96153846153846%\" valign=\"top\"\u003e\n                \u003cp\u003eThe D4DS Planner pushes teams to think critically about aspects that are not commonly considered from the early stages of a project (dissemination and sustainability).\u0026nbsp;\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"32.69230769230769%\" valign=\"top\"\u003e\n                \u003cp\u003eThe tool seems more tailored to academics than practitioners with regards to its perceived use and functionality (e.g. account set up). Practitioners tend to be working with already designed products to implement and sustain, however the tool seems to provide support more towards designing a new product. The tool could also skip the email verification process like other web tools.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"28.846153846153847%\" valign=\"top\"\u003e\n                \u003cp\u003eUsers seemed to engage with the tool easily and noted that the web tool was visually appealing and professional looking.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003ctable border=\"1\" cellspacing=\"0\" cellpadding=\"0\" width=\"492\"\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"2\"\u003e\n                \u003cp\u003e\u003cstrong\u003eTable 4. Perceived usefulness and appropriateness of the D4DS Planner\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eQuestion\u003csup\u003e1\u003c/sup\u003e\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\"\u003e\n                \u003cp\u003e\u003cstrong\u003eMean(SD) (n=7)\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\"\u003e\n                \u003cp\u003eThe information the tool provides is useful.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\"\u003e\n                \u003cp\u003e4.3 (0.8)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\" valign=\"top\"\u003e\n                \u003cp\u003eThe tool seems possible to use in my work.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\"\u003e\n                \u003cp\u003e4.4 (0.8)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\" valign=\"top\"\u003e\n                \u003cp\u003eThe tool would help my work be more impactful.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\" valign=\"top\"\u003e\n                \u003cp\u003e4.1 (0.7)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\" valign=\"top\"\u003e\n                \u003cp\u003eThe tool would help my work to reach a more diverse group of people.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\" valign=\"top\"\u003e\n                \u003cp\u003e4.0 (0.8)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\" valign=\"top\"\u003e\n                \u003cp\u003eThe tool would make the information I want easier to access.\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\" valign=\"top\"\u003e\n                \u003cp\u003e3.7 (1.1)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"79.26829268292683%\" valign=\"top\"\u003e\n                \u003cp\u003eOverall score\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd width=\"20.73170731707317%\" valign=\"top\"\u003e\n                \u003cp\u003e4.1 (1.1)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd width=\"100%\" colspan=\"2\" valign=\"top\"\u003e\n                \u003cp\u003e\u003csup\u003e1\u003c/sup\u003e Questions were asked on a 5-point Likert scale (strongly disagree to strongly agree)\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":false,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":true,"isPdf":false,"isPdfUpToDate":true,"journal":{"display":true,"email":"info@researchsquare.com","identity":"implementation-science","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"imps","sideBox":"Learn more about [Implementation Science](http://implementationscience.biomedcentral.com)","snPcode":"","submissionUrl":"https://www.editorialmanager.com/IMPS/default.aspx","title":"Implementation Science","twitterHandle":"@ImplementSci","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"em","reportingPortfolio":"BMC/SO AJ","inReviewEnabled":true,"inReviewRevisionsEnabled":true},"keywords":"Designing for Dissemination, Sustainability, Co-Design, User-Centered Design, Capacity Building, Equity","lastPublishedDoi":"10.21203/rs.3.rs-4276919/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-4276919/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003e\u003cstrong\u003eBackground:\u003c/strong\u003e The use of Designing for Dissemination and Sustainability (D4DS) principles and methods can support the development of research products (interventions, tools, findings) to match well with the needs and context of the intended audience and setting. D4DS principles and methods are not well-known or used during clinical and public health research; research teams would benefit from applying D4DS. This paper presents the development of a new digital platform for teams to learn and apply a D4DS process to their work.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMethods:\u003c/strong\u003e A user-centered design (UCD) approach engaged users (n=14) and an expert panel (n=6) in an iterative design process from discovery to prototyping and testing. We led five design sessions using Zoom and Figma software over a 5-month period. Users (71% academics; 29% practitioners) participated in at least 2 sessions. Following design sessions, feedback from users were summarized and discussed to generate design decisions. A prototype was then built and heuristically tested with 11 users who were asked to complete multiple tasks within the platform while verbalizing their decision-making using the ‘think aloud’ procedure. The System Usability Scale (SUS) was administered at the end of each testing session. After refinements to the platform were made, usability was reassessed with 7 of 11 same users to examine changes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eResults: \u003c/strong\u003eThe interactive digital platform (the D4DS Planner) has two main components: 1) the Education Hub (e.g., searchable platform with literature, videos, websites) and 2) the Action Planner. The Action Planner includes 7 interactive steps that walk users through a set of activities to generate a downloadable D4DS action plan for their project. Participants reported that the prototype tool was moderately usable (SUS=66) but improved following refinements (SUS=71).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConclusions:\u003c/strong\u003e This is a first of its kind tool that supports research teams in learning about and explicitly applying D4DS to their work. The use of this publicly available tool may increase the adoption, impact, and sustainment of a wide range of research products. The use of UCD yielded a tool that is easy to use. The future use and impact of this tool will be evaluated, and the tool will continue to be refined and improved.\u003c/p\u003e","manuscriptTitle":"Supporting Teams with Designing for Dissemination and Sustainability: the Design, Development, and Usability of a Digital Interactive Platform","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2024-05-28 20:25:41","doi":"10.21203/rs.3.rs-4276919/v1","editorialEvents":[{"type":"communityComments","content":0},{"type":"reviewerAgreed","content":"","date":"2024-05-23T13:54:26+00:00","index":0,"fulltext":""},{"type":"reviewersInvited","content":"","date":"2024-05-12T10:19:50+00:00","index":"","fulltext":""},{"type":"editorAssigned","content":"","date":"2024-05-07T02:23:18+00:00","index":"","fulltext":""},{"type":"submitted","content":"Implementation Science","date":"2024-05-06T09:50:20+00:00","index":"","fulltext":""},{"type":"decision","content":"Major revision","date":"2024-05-01T15:30:38+00:00","index":"","fulltext":""}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"implementation-science","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"imps","sideBox":"Learn more about [Implementation Science](http://implementationscience.biomedcentral.com)","snPcode":"","submissionUrl":"https://www.editorialmanager.com/IMPS/default.aspx","title":"Implementation Science","twitterHandle":"@ImplementSci","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"em","reportingPortfolio":"BMC/SO AJ","inReviewEnabled":true,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"5783eb61-1223-4129-acb3-701fd89249b2","owner":[],"postedDate":"May 28th, 2024","published":true,"recentEditorialEvents":[],"rejectedJournal":[],"revision":"","amendment":"","status":"published-in-journal","subjectAreas":[],"tags":[],"updatedAt":"2025-01-06T16:05:27+00:00","versionOfRecord":{"articleIdentity":"rs-4276919","link":"https://doi.org/10.1186/s13012-024-01410-7","journal":{"identity":"implementation-science","isVorOnly":false,"title":"Implementation Science"},"publishedOn":"2024-12-31 15:57:24","publishedOnDateReadable":"December 31st, 2024"},"versionCreatedAt":"2024-05-28 20:25:41","video":"","vorDoi":"10.1186/s13012-024-01410-7","vorDoiUrl":"https://doi.org/10.1186/s13012-024-01410-7","workflowStages":[]},"version":"v1","identity":"rs-4276919","journalConfig":"researchsquare"},"__N_SSP":true},"page":"/article/[identity]/[[...version]]","query":{"identity":"rs-4276919","version":["v1"]},"buildId":"v6DM7c9wRVvnLtjAbK_2-","isFallback":false,"dynamicIds":[87228],"gssp":true,"scriptLoader":[]}</script><div hidden="" id="snipcart" data-api-key="ODA3NTlmNDUtYjRjNy00MzE2LTgzNmYtYjUwY2Y4MWFkOWRlNjM3MTQwMjI1MDM0NDU2MjEx"></div></body></html>
