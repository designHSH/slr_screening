ne","correspondingAuthor":false,"prefix":"","firstName":"Brad","middleName":"","lastName":"Morse","suffix":""}],"badges":[],"createdAt":"2024-04-16 15:00:46","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-4276919/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-4276919/v1","draftVersion":[],"editorialEvents":[{"content":"https://doi.org/10.1186/s13012-024-01410-7","type":"published","date":"2024-12-31T15:57:24+00:00"}],"editorialNote":"","failedWorkflow":false,"files":[{"id":57298055,"identity":"f3dacfb4-18d3-4ac7-8ba7-3417982529a1","added_by":"auto","created_at":"2024-05-28 20:25:46","extension":"png","order_by":1,"title":"Figure 1","display":"","copyAsset":false,"role":"figure","size":30812,"visible":true,"origin":"","legend":"\u003cp\u003eSee image above for figure legend.\u003c/p\u003e","description":"","filename":"Figure1.png","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/ca66925c35eb76e3d38f65e9.png"},{"id":57298256,"identity":"739e8883-1c83-41c8-bcd1-68151883d9f4","added_by":"auto","created_at":"2024-05-28 20:33:46","extension":"png","order_by":2,"title":"Figure 2","display":"","copyAsset":false,"role":"figure","size":587352,"visible":true,"origin":"","legend":"\u003cp\u003eSee image above for figure legend.\u003c/p\u003e","description":"","filename":"Figure2.png","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/ce3c140a109f37669ddcc005.png"},{"id":57298059,"identity":"30c07ad1-5259-476c-8733-e1e06f7b5419","added_by":"auto","created_at":"2024-05-28 20:25:46","extension":"png","order_by":3,"title":"Figure 3","display":"","copyAsset":false,"role":"figure","size":279619,"visible":true,"origin":"","legend":"\u003cp\u003eSee image above for figure legend.\u003c/p\u003e","description":"","filename":"Figure3.png","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/f543877f69caea1685c1210d.png"},{"id":57298061,"identity":"f15b56ae-a082-4491-9c73-e82d943a906d","added_by":"auto","created_at":"2024-05-28 20:25:46","extension":"png","order_by":4,"title":"Figure 4","display":"","copyAsset":false,"role":"figure","size":162024,"visible":true,"origin":"","legend":"\u003cp\u003eSee image above for figure legend.\u003c/p\u003e","description":"","filename":"Figure4.png","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/4faee9b9327e835f5c945c43.png"},{"id":57298257,"identity":"0b772aed-6e46-4c65-b57f-d21bbda58cb3","added_by":"auto","created_at":"2024-05-28 20:33:46","extension":"png","order_by":5,"title":"Figure 5","display":"","copyAsset":false,"role":"figure","size":195475,"visible":true,"origin":"","legend":"\u003cp\u003eSee image above for figure legend.\u003c/p\u003e","description":"","filename":"Figure5.png","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/834320d221f74e1eb83392f4.png"},{"id":73093512,"identity":"c42d2a6e-785a-42d8-a545-8ea66f64a2b5","added_by":"auto","created_at":"2025-01-06 16:21:04","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":1922676,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/004ed31c-411f-4018-9008-fa89c49dc8ea.pdf"},{"id":57298056,"identity":"c0f8980a-426d-438f-b14c-26d242cb73a3","added_by":"auto","created_at":"2024-05-28 20:25:46","extension":"pdf","order_by":1,"title":"","display":"","copyAsset":false,"role":"supplement","size":47953,"visible":true,"origin":"","legend":"","description":"","filename":"Supplementarymaterial1actionplanexample.pdf","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/cbeb22c5e7bfd617a620c0bc.pdf"},{"id":57298058,"identity":"c095d379-ad58-4916-8608-a4a115c5a74c","added_by":"auto","created_at":"2024-05-28 20:25:46","extension":"docx","order_by":2,"title":"","display":"","copyAsset":false,"role":"supplement","size":17224,"visible":true,"origin":"","legend":"","description":"","filename":"SupplementaryMaterial2.docx","url":"https://assets-eu.researchsquare.com/files/rs-4276919/v1/e4a51ff39b8f714e8a13f5f7.docx"}],"financialInterests":"","formattedTitle":"Supporting Teams with Designing for Dissemination and Sustainability: the Design, Development, and Usability of a Digital Interactive Platform","fulltext":[{"header":" Contributions to the literature","content":"\u003cul\u003e\n    \u003cli\u003eThe use of Designing for Dissemination and Sustainability (D4DS) principles and methods aim to help match\u0026nbsp;the development of research products (interventions, tools, findings) with the needs and context of the intended audience and setting.\u003c/li\u003e\n    \u003cli\u003eThis paper presents a new digital, interactive platform, referred to as the D4DS Planner, that was developed using user centered design processes and was considered easy to use and useful by participants.\u0026nbsp;\u003c/li\u003e\n    \u003cli\u003eThe D4DS Planner providers users with a new process that can increase the use and potential impact of D4DS methods and principles.\u003c/li\u003e\n\u003c/ul\u003e"},{"header":"Background","content":"\u003cp\u003eDissemination and sustainability are two primary pillars of dissemination and implementation (D\u0026amp;I) science. These concepts focus on sharing and maintaining use of effective interventions over time to enhance equitable impact on health at the population level. Active and intentional dissemination efforts help spread interventions to the right people (i.e., the intended audience) in a way that best meets their needs and preferences.(1)\u0026nbsp;The impact of a research initiative is enhanced through active dissemination – spreading the products of research (e.g., interventions) to potential adopters and influencers using planned strategies and appropriate channels. A common goal of researchers is for effective interventions to be used widely (i.e., scaled-up) in routine practice. To maximize impact, researchers also seek to sustain their intervention, defined as the ability to maintain the intervention and its benefits over time.(2-4)\u0026nbsp;While dissemination and sustainment are critical to maximize the impact of research on health and well-being\u0026nbsp;(5), these initiatives can require significant resources and specialized expertise. Funding organizations are beginning to highlight the value of research initiatives focusing on dissemination and sustainability by requiring dissemination plans in grant applications and publishing calls for research focused on sustainability.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eDesigning for dissemination and sustainability (D4DS) is a new area to D\u0026amp;I science\u0026nbsp;(5-8). D4DS incorporates principles (guiding beliefs based on an approach) from multiple disciplines (e.g., implementation science, communication, business \u0026amp; marketing, systems science, user-centered design). Using transdisciplinary methods (ways of enacting principles from multiple and diverse disciplines) to engage key partners from the start in product development, as well as early and active dissemination and sustainability planning, is not commonly done. According to Kwan et al.,(5)\u0026nbsp;D4DS includes three key components: the research product, dissemination plan to support adoption, and sustainability plan to facilitate use over time. A research ‘product’ is the innovation a research team is trying to disseminate and sustain, which may include an (evidence based) intervention, evidence, treatment, technology, model of care, policy, guideline, or implementation strategy.(5)\u0026nbsp;Three central principles of D4DS, include: 1) beginning with the end in mind when planning research initiatives (i.e., who will adopt, implement, sustain, and potentially benefit from the products of research); 2) ensuring innovation-context fit (i.e., that the products of research can be implemented and equitably effective in real-world settings); and 3) planning for active dissemination and sustainability.(5, 9)\u0026nbsp;When a D4DS approach is not used, a research initiative may suffer from poor innovation-context fit, making it less likely that a research product will be adopted or sustained over time, lessening the impact of the research. A mismatch occurs when a research product – or dissemination and sustainability plans – are not aligned with the priorities, resources, or capacity of the organization, setting, or target audience. (10, 11)\u0026nbsp;The Fit to Context Framework for Dissemination and Sustainability was recently introduced as a process framework to guide research teams through using \u0026nbsp;a D4DS process defined as iteratively using a series of methods to operationalize D4DS principles.\u0026nbsp;(5)\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe Fit to Context Framework (F2C) for D4DS aims to support research product adoption, sustainment, and equitable health impacts. The framework \u0026nbsp;includes four phases: conceptualization, design, dissemination, and impact.(5)\u0026nbsp;In the first phase, conceptualization, the objectives are to establish partnerships, identify relevant evidence, and assess the context, in order to establish need and demand for an innovation as well as capacity for change. The second phase, design, includes co-design with users of an innovation (including packaging for use in real-world settings) and dissemination and sustainability plans. In D4DS the responsibility for active dissemination, the third phase, is positioned within the research team and their partners, institutions, and funders. Active dissemination involves deploying the dissemination plan, which specifies the intended audience (who you are trying to reach), the message (what information or product is being disseminated), and the communication channel (how and by whom the message will be shared).(8)\u0026nbsp;The fourth and final phase, impact, examines research product adoption, implementation, sustainment, and broader impact on health and health equity.(5)\u0026nbsp;Health equity is defined as having a fair and just opportunity to be as healthy as possible.(12)\u0026nbsp;D4DS principles could help promote health equity by engaging historically marginalized populations in developing effective interventions and products that meet the needs of these potential users and using strategies that make effective interventions equally accessible in their contexts to generate equal opportunities for health. This may only be realized if the D4DS process is conducted using equity principles (e.g., including the marginalized population, gatekeepers, and diverse groups in developing your product, dissemination, and sustainability plans, using principles of reflexivity and community engagement). We acknowledge that D4DS may not address the scope of obstacles historically marginalized populations face, such as poverty, discrimination, powerlessness, quality education and housing, yet, based on evidence from participatory methods, conducting a D4DS process using equity principles may promote health equity.(13-17)\u0026nbsp;At every stage of the D4DS process there is iterative evaluation and adaptation to ensure “fit to context” – that increases the change that the innovation will be feasible, sustainable, effective, and equitable in real-world settings for diverse populations.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eOur purpose was to develop a digital platform, the D4DS Planner, to help clinical and public health researchers and research teams learn about D4DS principles and methods and to operationalize the objectives of the F2C Framework’s conceptualization and design phases. To design the D4DS Planner, we engaged potential users in a participatory design process using user-centered design methodology. User-centered design provides a set of methods for eliciting user perspectives, preferences and ideas to co-design technologies.(18) \u0026nbsp; This methodology is based on the premise that users are significant and useful partners in the knowledge-production and development process.(19, 20) Participatory design has been increasingly used as a method for the design of health technologies to empower users by involving them in the development and to ensure tools are more likely to be engaging and effective.(19, 21, 22) This paper describes the development of the D4DS planner via participatory design methods, its features and functions, the usability testing of the platform, and future directions for the D4DS planner.\u0026nbsp;\u003c/p\u003e"},{"header":"Methods","content":"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eOverview and Guiding Design Framework\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA participatory design approach engaged users and an expert panel in a mixed methods (qualitative and quantitative) iterative user-centered design process starting from discovery to design and testing (\u003cstrong\u003eFigure 1\u003c/strong\u003e). We utilized common design principles throughout this process that focused on: 1) being person centered; 2) communicating visually and inclusively; 3) collaborating and co-creating; and 4) iterating.(23, 24)\u0026nbsp; We conducted five 90-minute design sessions conducted over Zoom from September 2022 to February 2023 (\u003cstrong\u003eTable 1\u003c/strong\u003e). All design sessions were conducted using Mural(25)\u0026nbsp;or Figma(26), collaborative platforms that allowed users to contribute written artifacts (i.e., responses) during the session. FigJam, a tool in Figma, was used to draw collaboratively during design sessions using an online whiteboard. Following design sessions, qualitative data were summarized and merged with written artifacts (e.g., a sticky note contributed on the mural board) from design sessions or survey results. Weekly team meetings were used to reach consensus on design impacts (i.e., how we would incorporate user feedback into design features of the D4DS planner).\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eOnce a working-version prototype tool was created, usability testing was conducted with a separate group of users who were not familiar with the tool and expert panel members using a combined think-aloud and survey-based approach. The prototype was revised and usability was re-assessed by the same users. \u0026nbsp;Details on the methods for data collection, analysis and results for each design session and usability testing are presented below in the Design Process and Results section. The project was approved as an exempt study by the Washington University in St. Louis Institutional Review Board (#202207165).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eParticipants and Recruitment\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eUsers included\u0026nbsp;researchers with experience\u0026nbsp;conducting a health-related\u0026nbsp;project, including\u0026nbsp;academics (e.g., researchers, students, project managers) and clinical and public health practitioners (e.g., clinicians, health department employees). Using purposive and snowball sampling, we recruited 14 users (71% academics and 29% practitioners) to participate as co-designers. Email invitations sent out to users included a brief description of the project goals and D4DS principles. Each co-designer was asked to participate in at least two design sessions. Co-designers reported varying levels of D\u0026amp;I knowledge prior to starting the design sessions, with 21% (n=3) reporting below average, 43% (n=6) reporting average, 36% reported above average knowledge.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe expert panel consisted of academic faculty members (n=6) who are leaders in D\u0026amp;I science, including the developers of the F2C Framework, across three academic institutions. Collectively, the expert panel focuses on public health research in both clinical and community settings and has expertise in the development, implementation, and evaluation of digital health tools. The expert panel members were engaged separately from users in a subset of the design exercises and usability testing.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eDesign Process and Results:\u0026nbsp;\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDesign Session 1: Discover\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThis first design session engaged 6 co-designers to\u0026nbsp;identify the need and demand for key issues this tool should address and explore potential features that will address these needs. We started this design session with a brief overview of D4DS principles and then conducted five design exercises (DE). Co-designers started the session by adding sticky notes to free list: 1) how the tool could benefit and empower users (DE 1.1) and 2) who might benefit from using this tool (DE 1.2). Next, we conducted a persona creation and value proposition generation exercise (DE 1.3). Personas are archetypes of different users who could use the tool and has been used in design to ensure diverse perspectives are accounted for in product design. Therefore, in our sessions, we asked co-designers to consider the perspectives of other potential users (listed in DE 1.2) using a template value proposition stated (i.e., I\u0026rsquo;m a (user type), who uses the D4DS web tool to (use case) to define (impact)). \u0026nbsp;We then asked co-designer to free list potential features (i.e., ways a user may interact with the content and experience learning in the tool (DE 1.4). Free listing features is a fast way to generate a lot of ideas in a short period of time.(27)\u0026nbsp;Lastly, co-designers placed the listed features into a prioritization bullseye and discussed their ideas by giving 2 minute presentations on their favorite ideas (DE 1.5).\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eResults: Design Session 1\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThe overall design impact of the first design session was that the tool should increase the transparency of D4DS and accessibility to multiple audiences, and foster collaboration. The tool is intended to help users plan their research and have D4DS as a key principle in their research from the start. To provide education, users suggested the tool contain a repository of key references and resources for individuals engaging in D4DS work. Users felt the tool should provide methods and strategies for engaging community partners in D4DS work. When asked who would benefit from the tool (DE 1.2), there was an emphasis on providing resources not only for people with D\u0026amp;I background, but also the people they partner with, whether that\u0026rsquo;s a site champion, an individual implementing an intervention, or a software developer designing materials for dissemination. While co-designers felt the primary users were researchers (with various level of D\u0026amp;I knowledge/background), they felt strongly that the tool would facilitate conversation with other partners. Other users may include community members and organizations, practitioners (e.g., clinicians, public health), policy makers, commercial partners, and funders. The main impact of the tool (DE 1.3) was described as: 1) enhancing co-design processes, as well as dissemination and implementation research; 2) increasing understanding of D4DS for multiple audiences; and 3) improving the design, effectiveness and sustainability of research products. The users free-listed (DE 1.4) 35 features that were grouped into 5 categories: grant proposal resources, methods/tools, dissemination resources, educational materials, and general format ideas. The research team combined similar features to generate a final list of 25 features (\u003cstrong\u003eTable 2\u003c/strong\u003e), which was used as input for the next design session to prioritize features.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDesign Session 2: Ideate\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThe second design session focused on further exploring and prioritizing features. Using information from design session 1, we utilized the Kano Model of Customer Satisfaction exercise for prioritization for the 25 features (\u003cstrong\u003eTable 2\u003c/strong\u003e).(28, 29)\u0026nbsp;The Kano Model classifies features as Must-have (i.e., I expect it and would be dissatisfied without it), One-dimensional (i.e., I expect it), Attractive (i.e., I like it), and Indifferent (i.e., I\u0026rsquo;m neutral). Co-designers and expert panel members completed the Kano as an electronic (REDCap) quantitative survey during or outside the session (DE 2.1).(28)\u0026nbsp;After completing the Kano survey, the 3 zoom participants performed an exercise to free list any other feature ideas and identify their favorite feature from the Kano survey (DE 2.2). Co-designers then grouped features into content areas for learning (DE 2.3) and prioritized the most important content areas to identify which ideas are most important to users (DE 2.4).\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eResults: Design Session 2\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eA total of 17 participants completed the Kano survey. \u003cstrong\u003eTable 2\u003c/strong\u003e lists the features in order of prioritization according to the Kano survey responses. We identified 1 Must-have feature, 17 Attractive features, and 7 Indifferent features. The Must-have feature was URL links to other content that falls within the discipline/field of D4DS, especially dissemination and sustainability. The number of Attractive features was a promising finding give the many potential opportunities to delight users (a key goal of design), with a relative low risk of dissatisfaction if the feature was not integrated at all. As for the Indifferent features, these features would not yield either satisfaction or dissatisfaction for our users. As a result, the Indifferent features occupied the bottom of our development prioritization, and ultimately were not incorporated into version 1.0 of the web tool. \u0026nbsp; \u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDesign Sessions 3-5: Wireframing\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u0026nbsp;The next 3 design sessions focused on iteratively envisioning and creating wireframes of the features that were prioritized in the previous design session. Wireframes are illustrations of a product that are not yet built and typically lack functionality but represent the interface and its intended features and functionalities. The iterative design process allowed users to draw and give feedback on design options (e.g., wireframes) in successive versions. During design session 3, 4 co-designers ideated and drew 1) account creation, 2) a questionnaire that would allow users to set-up a project and guide them on how best to use the tool, 3) a roadmap or visual process that walks the users through the D4DS process, 4) and the landing page. In design session 4, 4 co-designers provided feedback on two versions of the roadmap and sketched a final version of the roadmap. We also discussed which features co-designers wanted to be present on each page that derives from the roadmap and sketched the layout of a single page. In design session 5, co-designers provided comments on a refined version of the single page sketch, sketched the layout of the education hub and spent time discussing the name of the tool and each feature.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eResults: Design Sessions 3-5\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eCo-designers felt that users should have the option to use the tool as a guest or with an account, making it clear to users the benefits of having a login (e.g., saving data, returning later to update work). Discussion identified that the login should be simple but make users feel that the information they add into the tool is secure. A major focus of our prototyping sessions was brainstorming and drawing the feature of a roadmap that would help users walk through a D4DS process. The wireframe of this iterated in each session (\u003cstrong\u003eFigure 2\u003c/strong\u003e), with co-designers realizing they did not want this to feel like a linear process. Co-designers were critical in the process of developing easy to understand, action-oriented language to communicate different features of the tool (e.g., D4DS Planner, action planner, action item, cue to equity).\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUsability Testing: D4DS Planner Prototype\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFollowing all design sessions, our team delivered low-fidelity wireframes and features to a software development company (HICAPPS, https://hicapps.com) that has expertise in developing health-related tools. Our team collaborated with HICAPPS on an iterative build of a prototype of the D4DS Planner to ensure that all feedback from design sessions was incorporated.\u003c/p\u003e\n\u003cp\u003eIn the usability phase, test users were asked to use the D4DS web tool on a laptop computer in a private space in-person or via zoom. The test users were given a general description of the web tool but were not given explicit instructions on how the web tool operated or how it was designed to be used for developing a dissemination and sustainability plan. Test users were asked to carry out two out of a possible three heuristic tasks, including: 1) familiarize yourself with the web tool and figure out the purpose and function of the web tool, 2) create an account, and 3) set up a project to create a D4DS action plan.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eTo assess the heuristic usability data, an affinity grouping (30, 31) exercise was conducted in Mural, an online collaboration software app, by four team members (MMK, BM, TS, AL) who were integrated into the design and development of the web tool. The research team analyzed internal notes taken during the usability sessions and re-watched recordings of users navigating the tool. Summary phrases were extracted and typed on Mural\u0026rsquo;s \u0026ldquo;sticky notes\u0026rdquo; and mapped together based on similarities in relation to four categories and the collaborator type, e.g., researchers, practitioners, and leadership. The four categories were as follows: (1) What works well in the D4DS web tool? (2) What is not working well, or what are the significant pain points, in the D4DS web tool? (3) What changes do users want to see in the D4DS web tool? (4) Other comments that pertain to the usability of the D4DS web tool. At the end of the usability sessions, test users completed the ten item System Usability Scale (SUS) to quantitatively measure perceived usability of the tool.(32) Usability results were used to refine the prototype tool. Usability was retested on the refined version one of the D4DS planner among the same users who participated in the first round of usability testing. During this round of testing, five questions (reported on a 5-point Likert scale) about the usefulness and appropriateness of the tool were added to the survey.\u0026nbsp;\u003c/p\u003e"},{"header":"Results","content":"\u003cp\u003e\u003cem\u003eUsability Results\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eUsability testing on the prototype tool was conducted with a separate group of 11 users (55% academics and 45% clinical and public health practitioners) who were not familiar with the tool using a combined think-aloud and survey-based approach. Five members from the expert panel assembled at the start of the design process also participated in the think-aloud testing only. The affinity grouping synthesis of qualitative usability data is presented in \u003cstrong\u003eTable 3\u003c/strong\u003e. Overall, users across the three groups (academics, practitioners, and experts) expressed that the prototype web tool had a professional \u0026ldquo;look and feel\u0026rdquo; and contained action-oriented content not often considered when planning for dissemination and sustainability. Users scored the prototype tool a 66 using the SUS, which is slightly below the standard cut-point of 68 to indicate above average usability.(33) While the web tool contained a lot of high-level content, some users felt that there were too many words on the screen. Our main challenge was to provide the user with enough information, while not over-burdening the user who might become reluctant to use the web tool because of its relative complexity. In general, these results were helpful in allowing our team to identify areas of the prototype web tool that needed to be revised to achieve a balance of providing guidance and not overly saturating the interface with directions and jargon. We curated a list of changes that were communicated to the developers of the web tool (\u003cstrong\u003eSupplementary Material 2\u003c/strong\u003e) and made several wording changes to content to reduce complexity and breadth. Some of the major changes included: 1) the addition of instructional videos and a guided tour that show users the key features of the tool upon first logging in; 2) reduction of text and simplifying language; 3) simplification of the login and project set-up; and 4). Following these updates, usability was reassessed on the first version of the D4DS Planner (presented below) by 7 of the 11 users (57% academics and 43% practitioners) who participated in the first round of usability testing. After refinements, usability scored 71, which was a 5-point increase in the score moving the tool to be perceived as above average for usability. Overall, users felt the tool was useful and appropriate with a mean score of 4.1 (SD 1.1; \u003cstrong\u003eTable 4\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eThe D4DS Planner \u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThe D4DS Planner is a digital platform designed to help users collaboratively apply D4DS principles and methods to a research project to maximize the potential of their work. The D4DS Planner has two main components: 1) the Education Hub (i.e., a searchable platform with literature, videos, websites, etc.) and 2) the Action Planner that can be accessed from the homepage (\u003cstrong\u003eFigure 3\u003c/strong\u003e; d4dsplanner.com). \u003c/p\u003e\n\u003cp\u003eThe Education Hub is available to users without logging in and includes resources (e.g., websites, journal articles, presentations and videos) to educate users on D4DS principles and methods. The Education Hub has search and filter functionality that allow users to find materials related to each D4DS step (called action items) and materials that provide methods, case examples and cues to increase focus on equity. The Action Planner allows users to interact and collaborate with a team in real-time or asynchronously. Users are required to create an account before setting up a project so that all information is saved and can be downloaded as a D4DS Action Plan. The D4DS Action Plan is a detailed document outlining users input from each activity that can be used to support D4DS and application of the F2C Framework. \u003cstrong\u003eSupplementary Material 1\u003c/strong\u003e provides an example of a D4DS Action plan. It includes information specific to the team\u0026rsquo;s project that can be used to develop a grant proposal, communicate the value of your work, and justify funding.\u003c/p\u003e\n\u003cp\u003eThe Action Planner (\u003cstrong\u003eFigure 4\u003c/strong\u003e) is composed of 7 \u0026ldquo;Action Items\u0026rdquo; based on the Fit to Context Framework\u0026rsquo;s conceptualization and design phases (5) that guide users through the D4DS process. Each action item includes an instructional video, interactive activities, educational content, and cues to equity. The cue to equity section prompts users to be intentional about how they are conducting their D4DS activities with the goal of developing equitable products (e.g., those that meet the needs of marginalized populations) that can be equitably accessed by the intended population over time. Examples of cues to equity, include: 1) \u0026ldquo;Consider who is present and, perhaps most importantly, who is absent in your studies and research team;\u0026rdquo; 2) \u0026ldquo;be attentive as to how you ask the questions and attend to issues of power, and of the implicit and explicit assumptions of your questions;\u0026rdquo; and 3) \u0026ldquo;think about ways to share information that reflect the values and cultures of your partners.\u0026rdquo; Each cue is relevant to the activity the team may conduct within the action item and provides further educational materials to help them operationalize the cue.\u003c/p\u003e\n\u003cp\u003eAlthough the tool was built for researchers and research teams, critical to D4DS and strongly valued by co-designers were features that facilitated the engagement of community-based partners, including community members, practitioners, public health organizations, policy makers, etc. The tool invites users to brainstorm and invite relevant partners in the \u0026ldquo;Identify Partners\u0026rdquo; Action Item (\u003cstrong\u003eFigure 5\u003c/strong\u003e) to log-in and collaborate with them through the process. The tool includes features such as the ability to assign team members specific tasks with a due a date and chat features that foster collaboration. As suggested by co-designers, this process does not need to be completed in it\u0026rsquo;s entirety or linearly, although some steps do build from others. The tool includes a guidance questionnaire that was co-designed to help users identify which action items are most relevant to their project. The 7 Action Items are:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eIdentify Partners:\u003c/strong\u003e This Action Item challenges users to think broadly about partners that are critical to the dissemination and sustainability of their product using the 7 P\u0026rsquo;s Framework for stakeholder identification in outcomes and effectiveness research.(34) Partners can be individuals, groups or organizations who have an interest in the research product, or affect or are affected by its outcomes. As started above, the Action Item allows you to select partners you will engage in your work and invite partners to collaborate with you in the D4DS action planner.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEmpathize and Outline the Problem:\u003c/strong\u003e Users will engage partners to understand the problem from their perspective and generate a Value Proposition that clearly communicates how their product meets the needs of their target audience. In research, a value proposition can be used to communicate the value of our research to our partners, funding agencies, and the general public.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUnderstand The Context:\u003c/strong\u003e This Action Item includes key questions to help users think broadly about characteristics of the people, relationships, product, organization, and environment that may influence the ability to reach the target audience and sustain impact. The goal is to help users consider the multilevel nature of how context can impact how they share, adopt, use and benefit from the product over time. \u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConfirm and Co-design Your Product:\u003c/strong\u003eThis Action Item allows users to select methods for co-designing their product and packaging it for use in real-world settings. Using co-design methods to engage key partners in the design of a product increases the likelihood that your product will be perceived as feasible, acceptable, useful and equitable. \u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDevelop a Dissemination Plan:\u003c/strong\u003eThis Action Item helps users generate a plan for how to share their product with key audiences, especially those outside of academia. In this action item, the team and their partners will brainstorm all the possible ways they may share about their product, prioritize which methods are the most feasible and will have the most impact, and generate a plan. \u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePlan For Sustainability:\u003c/strong\u003e This Action Item helps the team discuss and prioritize what is needed to sustain their product over time and create a practical action plan. The goal is for the team to think early and actively plan for sustainability to enhance the long-term impact of their work.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEvaluate Iteratively\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e This Action Item helps users evaluate their use of D4DS and develop plans for evaluating dissemination and sustainability. In this Action Item, the tool helps users develop evaluation plans to maximize the intended impact of their dissemination and sustainability plans. Evaluation should be conducted iteratively, and users should return to this Action Item as needed to revise their plan.\u003c/li\u003e\n\u003c/ul\u003e"},{"header":"Discussion","content":"\u003cp\u003eThe public-access D4DS Planner (d4dsplanner.com) is the first digital tool that supports transdisciplinary research teams in learning about and applying D4DS principles and the Fit to Context Framework in their work. Developed through a participatory design process, the two main components of the tool are the Education Hub, which contains resources to help users learn about D4DS, and the Action Planner, to support the application of D4DS principles and the conceptualization and design phase objectives of the F2C Framework.\u003c/p\u003e \u003cp\u003eThe use of a participatory design approach engaged users in co-designing a D4DS Planner that incorporated users\u0026rsquo; experiences and met researchers and practitioners\u0026rsquo; needs and preferences.(\u003cspan citationid=\"CR23\" class=\"CitationRef\"\u003e23\u003c/span\u003e) Users indicated that the tool would be helpful in improving understanding of D4DS, enhancing co-design processes with partners, and ultimately would improve the effectiveness and sustainability of their products. Not surprisingly, features prioritized by the users were those that support learning about D4DS as this is a new and expanding area, including links to resources, and the process of engaging and collaborating with partners, including a roadmap tailored to a specified project to guide users in conducting D4DS. Overall, users liked the visual presentation of the tool and the actionable content that allows for developing a plan for dissemination and sustainability. The relative complexity in navigating the tool and having too many words in some sections were areas that users recommended modifying to enhance usability. While the participatory design approach was time intensive, the D4DS principles were new to users and time was necessary to solidify how our planner would be useful to end-users. Through this process, we learned that inclusion of users throughout the prototype build phase would have been beneficial, rather than waiting until the end to gain feedback on usability. This more iterative approach may have saved us time and financial resources by reducing the number of changes necessary after usability testing.\u003c/p\u003e \u003cp\u003eThe D4DS Planner is designed for researchers to engage key partners throughout the process of planning a research initiative which is critical to ensure that products are designed to match contextual characteristics (i.e. priorities, needs, resources) of partners.(\u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e, \u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e). Community engagement is critical to improving dissemination and sustainability by better aligning research activities with the priorities, needs, and assets of the intended users and local context.(\u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e, \u003cspan citationid=\"CR35\" class=\"CitationRef\"\u003e35\u003c/span\u003e) Several tools have been developed to guide conducting community-engaged research;(\u003cspan citationid=\"CR36\" class=\"CitationRef\"\u003e36\u003c/span\u003e) however, to our knowledge none have focused on engaging related to product development, dissemination, and sustainability.(\u003cspan additionalcitationids=\"CR38 CR39\" citationid=\"CR37\" class=\"CitationRef\"\u003e37\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR40\" class=\"CitationRef\"\u003e40\u003c/span\u003e) Engaging the intended audience, particularly marginalized populations, in product design may promote health equity by developing interventions and products that meet the needs of historically marginalized populations and account for the their context. Intentionally selecting partners that do not create, reinforce, or maintain existing inequities is important if the process is intended to promote health equity. (\u003cspan citationid=\"CR41\" class=\"CitationRef\"\u003e41\u003c/span\u003e) When done well, co-creating ways of sharing and sustaining the intervention may increase reach, adoption, and sustained impact among diverse populations and marginalized groups. Our goal was to support teams in using the interactive features of the tool and D4DS methods with intention and equity in mind, with the goal of improving dissemination and sustainability outcomes and impact.\u003c/p\u003e \u003cp\u003eThe D4DS Planner web tool has several potential uses for projects in different phases from conceptualization to sustainability. This tool supports users and their collaborators to deepen their understanding of the issue and work together as a team to identify and refine the solution (i.e., product) that effectively addresses a health problem that is important to the intended audience. Additionally, this tool can serve a crucial role in formulating comprehensive dissemination and sustainability plans. Early and ongoing planning for dissemination and sustainability enables the consideration of the intended audience and capacity and resources of the implementers and their contexts to enhance translation and utilization of research products in practice.(\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e) Further, the Action Plan generated from the D4DS tool can support the development of grant proposals and grant dissemination plans.\u003c/p\u003e \u003cp\u003eThere are several limitations to this work. The target users for the D4DS Planner are research teams conducting clinical and public health-related research including researchers, practitioners, and community-based partners. However, we did not include community-based partners in our design sessions or usability testing. Subsequent usability testing will elicit perspectives from community-based partners to refine and tailor the tool to further support engagement with community partners. We also did not test the tool with collaborative teams (i.e., a researcher and community partner reviewing the tool together) which limited our ability to assess the tool\u0026rsquo;s features and functions that were designed to facilitate collaboration and engagement.\u003c/p\u003e \u003cp\u003eUsability testing was conducted on key features of the tool, but users did not comprehensively test the entirety of the tool to develop a D4DS action plan. Additionally, while our cues to equity were developed within the participatory design process, the ability of teams to easily use the cues in their research projects, whether cues have the intended impact on how the D4DS process is conducted, and the impact on health equity outcomes has not been tested. Future work will focus on usability testing among research teams, including community partners, and examine whether the tool and cues to equity were used as intended, as well as the impacts of using this process. The tool is limited to the English language, which will limit the use of the tool globally. Future iterations of the tool will consider building in a translation feature to broaden access to diverse populations.\u003c/p\u003e \u003cp\u003eParticipatory design is an iterative and ongoing process.(\u003cspan citationid=\"CR23\" class=\"CitationRef\"\u003e23\u003c/span\u003e) The D4DS Planner is in its early iteration, and we are committed to refining the tool based on feedback from users representing diverse backgrounds, including researchers in non-academic and low resource settings and community-based partners. These varied perspectives are crucial, aligning with the tool's primary goal of engaging a broad spectrum of partners in dissemination and sustainability planning to enhance product-context fit and ultimately promote health equity. To evaluate the tool's impact, we will assess its reach and engagement using google analytics (e.g., number of users who access the tool, duration of use, completion of tasks) and its effectiveness and context-dependent implementation through user case examples. We will also design studies to test whether facilitation strategies are needed to support use of the tool; with a particular focus on understanding whether research teams without a D\u0026amp;I scientist are able to effectively use and complete the tool without facilitation.\u003c/p\u003e"},{"header":"Conclusions","content":"\u003cp\u003eDissemination and sustainment are critical to maximize the impact of research on health and well-being. The D4DS Planner can help research teams apply the Fit to Context Framework for dissemination and sustainability, facilitate partner engagement in research initiatives, and enhance the overall impact of their work. To our knowledge this is the first tool of its kind that facilitates engaging partners in product development, dissemination, and sustainability.\u003c/p\u003e"},{"header":"Abbreviations","content":"\u003cp\u003eAL: Allison L\u0026apos;Hotta PhD, OTR, OTR/L\u003c/p\u003e\n\u003cp\u003eBM: Brad Morse, PhD\u003c/p\u003e\n\u003cp\u003eD\u0026amp;I: Dissemination and Implementation\u003c/p\u003e\n\u003cp\u003eD4DS: Designing for Dissemination and Sustainability\u003c/p\u003e\n\u003cp\u003eDE: Design Exercises\u003c/p\u003e\n\u003cp\u003eF2C: Fit to Context Framework\u003c/p\u003e\n\u003cp\u003eMMK: Maura M. Kepper, PhD\u003c/p\u003e\n\u003cp\u003eSUS: System Usability Scale\u003c/p\u003e\n\u003cp\u003eTS: Thembekile Shato, PhD, MPH\u003c/p\u003e\n\u003cp\u003eUCD: User Centered Design\u003c/p\u003e"},{"header":"Declarations","content":"\u003cp\u003e\u003cstrong\u003eEthics approval and consent to participate:\u0026nbsp;\u003c/strong\u003eThis study was approved by the Washington University in St. Louis IRB (IRB# 202207165) with exempt status. Participants did not complete a consent to participate as co-designers or usability testing.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsent for publication:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNot applicable\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAvailability of data and materials:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe datasets used and/or analyzed during the current study are available from the corresponding author on reasonable request.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCompeting interests\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe Authors declare that they have no competing interests.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFunding\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eThis project was funded by the Centers for Disease Control and Prevention U48DP006395, the National Cancer Institute- Washington University in St. Louis P50CA244431 and the University of Colorado P50CA\u003c/em\u003e\u003cem\u003e244688 and the Center for Diabetes Translation Research (\u003cem\u003eP30DK092950) funded by the National Institute of Diabetes and Digestive and Kidney Disorders (NIDDK).\u0026nbsp;\u003c/em\u003eAdditional support was provided by the Colorado Clinical and Translational Sciences Institute is funded by NIH Funding Acknowledgement CTSA Grant UM1 TR004399.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAuthors\u0026apos; contributions\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe conceptualization of this project was conducted by all authors (MMK, AL, TS, BMK, REG, DL, AKG, AAB, RCB, BM). MMK, AL, TS, and BM developed the methodology, conducted design sessions and user testing, and analyzed the data. MMK, AL, TS, and BM developed the original draft of the paper and all authors reviewed and edited the paper. All authors have read and agreed to the published version of the manuscript.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAcknowledgements\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe would like to acknowledge our co-designers and the software development company (HICAPPS, https://hicapps.com) who contributed immensely to the design of this tool.\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\n    \u003cli\u003eLomas J. Diffusion, dissemination, and implementation: who should do what? Ann N Y Acad Sci. 1993;703:226-35; discussion 35-7.\u003c/li\u003e\n    \u003cli\u003eLuke DA, Calhoun A, Robichaux CB, Elliott MB, Moreland-Russell S. The Program Sustainability Assessment Tool: a new instrument for public health programs. Prev Chronic Dis. 2014;11:130184.\u003c/li\u003e\n    \u003cli\u003eMoore JE, Mascarenhas A, Bain J, Straus SE. Developing a comprehensive definition of sustainability. Implementation Science. 2017;12(1):110.\u003c/li\u003e\n    \u003cli\u003eShelton RC, Cooper BR, Stirman SW. The Sustainability of Evidence-Based Interventions and Practices in Public Health and Health Care. Annual review of public health. 2018;39(1):55-76.\u003c/l
