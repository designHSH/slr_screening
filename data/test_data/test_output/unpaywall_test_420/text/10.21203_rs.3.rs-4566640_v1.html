wyn Myers, Kristen S. Regenauer, Kim Johnson, Imani Brown, and 9 more</p></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div></div><div class="tw-py-3 md:tw-px-1.5 tw-border-gray-100 tw-bg-gray-50 lg:tw-bg-white lg:tw-border-0 lg:tw-px-0 lg:tw-py-0"><div class="tw-mx-2.5 lg:tw-mx-0 tw-border-2 tw-border-gray-100 tw-bg-white tw-rounded-lg lg:tw-mb-1 tw-max-w-xl lg:tw-max-w-none"><div class="tw-px-4"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-red-800 tw-font-bold">This is a preprint; it has not been peer reviewed by a journal.</p></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4"><div class="tw-border-t-2 tw-border- n></div><div class="tw-px-4 tw-py-2 tw-border-t-2 tw-border-gray-100"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Journal Publication</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black">published <!-- -->13 Feb, 2025</p></div><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-mt-3 tw-mb-1"><a href="https://doi.org/10.1186/s13722-025-00544-3" target="_blank" rel="noopener noreferrer" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline" data-track="click_reading_the_published_version" data-track-context="Addiction Science &amp; Clinical Practice" data-track-category="Published" data-track-link-text="Read the published version in Addiction Science &amp; Clinical Practice" data-track-content-type="Research Article" data-track-label="BMC"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition tw-block tw-w-full tw-text-center">Read the published version in<!-- --> <span class="tw-italic">Addiction Science &amp; Clinical Practice</span>  →</span></a></p></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex">7</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300 tw-ml-2"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><h2>Introduction:</h2> <p>In South Africa (SA), community-oriented primary care (COPC) teams work to re-engage out-of-care people with HIV (PWH) in treatment, many of whom have substance use (SU) concerns. SU stigma is high among these teams, limiting care engagement efforts. Integrating peer recovery coaches (PRCs) into COPC teams could shift SU stigma and improve patients’ engagement in care. The PRC role does not exist in SA and represents a workforce innovation. To enhance acceptability, feasibility, and appropriateness for the local context, we engaged multiple stakeholder groups to co-design a PRC role for COPC team integration.</p><h2>Methods</h2> <p>We used a five-step human-centered design process: (i) semi-structured interviews with healthcare worker (HCW, <em>n</em> = 25) and patient (<em>n</em> = 15) stakeholders to identify priorities for the role; (ii) development of an initial role overview; (iii) six ideation workshops with HCW (<em>n</em> = 12) and patient (<em>n</em> = 12) stakeholders to adapt this overview; (iv) refinement of the role prototype via four co-design workshops with HCW (<em>n</em> = 7) and patient (<em>n</em> = 9) stakeholders; and (v) consultation with HIV and SU service leaders to assess the acceptability and feasibility of integrating this prototype into COPC teams.</p><h2>Results</h2> <p>Although all stakeholders viewed the PRC role as acceptable, patients and HCWs identified different priorities. Patients prioritized the care experience through sharing of lived experience and confidential SU support. HCWs prioritized clarification of the PRC role, working conditions, and processes to limit any impact on the COPC team. A personal history of SU, minimum 1 year in SU recovery, and strong community knowledge were considered role prerequisites by all stakeholders. Through the iterative process, stakeholders clarified their preferences for PRC session structure, location, and content and expanded proposed components of PRC training to include therapeutic and professional work practice competencies. Service leaders endorsed the prototype after the addition of PRC integration training for COPCs and PRC mentoring to address community and COPC dynamics.</p><h2>Conclusion</h2> <p>Stakeholder engagement in an iterative HCD process has been integral to co-designing a PRC role that multiple stakeholder groups consider acceptable and that COPC teams are willing to implement. This offers a methodological framework for other teams designing SU workforce innovations.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">stigma</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">substance use</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">implementation science</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">task-sharing</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">low-and-middle income country</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">global mental health</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Figures</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-flex tw-flex-wrap tw-items-end tw-pt-2"><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="0"><img alt="Figure 1" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4566640%2Fv1%2F145e7888a06196034ba33ff4.png%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4566640%2Fv1%2F145e7888a06196034ba33ff4.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-4566640%2Fv1%2F145e7888a06196034ba33ff4.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 1</p></button></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Background</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Although South Africa (SA) has significantly expanded access to antiretroviral therapy (ART) for people with HIV (PWH), less than two-thirds of PWH in South Africa attain viral suppression (<span citationid="CR1" class="CitationRef">1</span>). Intermittent or discontinued HIV treatment contributes to sub-optimal viral suppression rates (<span citationid="CR2" class="CitationRef">2</span>), with only 38% of PWH continually engaging in ART during the first 12 months after initiation (<span citationid="CR3" class="CitationRef">3</span>).</p> <p>In response, the South African Department of Health has introduced ward- or community-oriented primary care (COPC) teams to bridge gaps between out-of-care patients and clinic-based HIV services (<span citationid="CR4" class="CitationRef">4</span>, <span citationid="CR5" class="CitationRef">5</span>). COPC teams are linked to a primary care clinic and comprises an enrolled nurse outreach team leader and community health workers (CHWs) (<span citationid="CR6" class="CitationRef">6</span>). These COPCs provide up to 400 households in their clinic’s geographical catchment area with HIV treatment supports, including support for out-of-care PWH to re-engage with clinic-based services and referral to health and social services for co-occurring conditions that affect HIV treatment engagement (<span citationid="CR6" class="CitationRef">6</span>, <span citationid="CR7" class="CitationRef">7</span>).</p> <p>One co-occurring condition that CHWs are likely to encounter when working with out-of-care PWH is substance use (SU). SU is highly prevalent in SA (<span citationid="CR8" class="CitationRef">8</span>), particularly in the Western Cape province where population-level rates of SU disorders are significantly higher than the rest of the country (<span citationid="CR9" class="CitationRef">9</span>). Although the prevalence of SU among PWH is unknown, approximately a third of PWH attending clinics in the Western Cape are estimated to have SU difficulties (<span citationid="CR10" class="CitationRef">10</span>). As SU is associated with sub-optimal ART adherence and treatment disengagement (<span citationid="CR11" class="CitationRef">11</span>, <span citationid="CR12" class="CitationRef">12</span>), the prevalence of SU difficulties may be even higher among out-of-care PWH receiving COPC.</p> <p>Yet CHWs are not routinely trained to screen for SU, limiting their ability to assist out-of-care PWH struggling with this care engagement barrier (<span additionalcitationids="CR14" citationid="CR13" class="CitationRef">13</span>–<span citationid="CR15" class="CitationRef">15</span>). While there have been recent initiatives to train CHWs and other healthcare workers (HCW) to conduct screening and brief interventions for SU (<span citationid="CR16" class="CitationRef">16</span>), high levels of SU stigma among CHWs (<span citationid="CR17" class="CitationRef">17</span>, <span citationid="CR18" class="CitationRef">18</span>) may limit the potential benefits of this training for HIV care engagement.</p> <p>SU stigma among CHWs and other HCWs affects access to effective HIV care (<span citationid="CR17" class="CitationRef">17</span>, <span citationid="CR19" class="CitationRef">19</span>, <span citationid="CR20" class="CitationRef">20</span>). Evidence suggests that HCWs with high levels of SU stigma are less likely to provide evidence-based interventions or person-centered care (<span additionalcitationids="CR22 CR23" citationid="CR21" class="CitationRef">21</span>–<span citationid="CR24" class="CitationRef">24</span>). In addition, anticipated and enacted SU stigma affects PWH’s readiness for HIV care engagement (<span additionalcitationids="CR26" citationid="CR25" class="CitationRef">25</span>–<span citationid="CR27" class="CitationRef">27</span>). Therefore, SU stigma needs to be addressed for CHWs to effectively support people with SU to re-engage in HIV treatment.</p> <p>Converging evidence suggests that SU stigma reduction interventions involving sustained social contact with people in SU recovery have the largest and most durable effects on HCW stigma (<span citationid="CR22" class="CitationRef">22</span>, <span citationid="CR28" class="CitationRef">28</span>). Consequently, peer recovery coaches (PRCs) —trained individuals with lived experience of SU—are increasingly being integrated into primary healthcare teams in the US as a strategy for expanding their capacity to link patients with SU to care (<span citationid="CR29" class="CitationRef">29</span>, <span citationid="CR30" class="CitationRef">30</span>). In these teams, PRCs work directly with patients to provide personalized support for SU recovery and SU treatment and health care navigation. US-based PRC intervention studies have demonstrated the PRC role’s feasibility and acceptability, reporting significantly higher rates of SU treatment initiation and engagement among patients who received peer-delivered supports compared to those in standard care (<span additionalcitationids="CR31 CR32 CR33" citationid="CR30" class="CitationRef">30</span>–<span citationid="CR34" class="CitationRef">34</span>).</p> <p>Integrating PRCs into COPC teams may help shift SU stigma among CHWs and help CHWs patients reduce SU-related barriers to HIV care engagement. In fact, the idea of training peers to provide SU-related supports for PWH emerged organically from our team’s prior work with PWH and lived experience of SU in this setting (<span citationid="CR18" class="CitationRef">18</span>). Despite this, the PRC role represents a workforce innovation for SA, and there are likely to be patient-, provider-, and system-level barriers to the uptake, implementation, and sustainment of this new role. To optimize acceptability, feasibility and contextual appropriateness, we partnered with key stakeholders and used a human-centered design (HCD) process (<span citationid="CR35" class="CitationRef">35</span>, <span citationid="CR36" class="CitationRef">36</span>) to develop a PRC role that builds off successful US models. This was informed by Designing for Dissemination and Sustainability, an implementation science concept that recommends stakeholder engagement in the design process as a strategy for ensuring that innovations are developed that are aligned with stakeholder preferences and priorities and responsive to potential implementation barriers (<span citationid="CR37" class="CitationRef">37</span>, <span citationid="CR38" class="CitationRef">38</span>). The aim of this paper is to describe a multi-level stakeholder-driven approach to co-designing a PRC role for integration into COPC teams in Cape Town, SA.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Methods</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec3" class="Section2"> <h2>Setting</h2> <p>This study was conducted in low-income communities within the Eastern, Khayelitsha, and Klipfontein subdistricts within Cape Town. These subdistricts are characterized by high rates of poverty, HIV, crime, and SU. Free HIV testing and treatment is available at community health clinics, which oversee COPC teams and other HIV services provided by CHWs. The Western Cape Department of Health (WCDoH) contracts non-governmental organizations (NGOs) to employ CHWs and operate COPC teams (<span citationid="CR5" class="CitationRef">5</span>). Although SU treatment options are limited, there are free or low-cost outpatient programs available in these districts (<span citationid="CR39" class="CitationRef">39</span>).</p> </div> <div id="Sec4" class="Section2"> <h2>Design</h2> <p>We chose HCD as our design method as it facilitates the rapid implementation of health system and workforce innovations (<span citationid="CR36" class="CitationRef">36</span>, <span citationid="CR40" class="CitationRef">40</span>). HCD seeks to understand the implementation context and stakeholders’ design priorities and concerns (<span citationid="CR41" class="CitationRef">41</span>), actively involving stakeholders in the design process (<span citationid="CR42" class="CitationRef">42</span>). Our approach involved five steps (<span citationid="CR43" class="CitationRef">43</span>) shown in Fig. <span refid="Fig1" class="InternalRef">1</span>: (i) <em>empathizing</em> with stakeholders by understanding their priorities and concerns about the proposed role; (ii) <em>defining</em> the PRC role and identifying information gaps; (iii) <em>ideation</em> of the PRC role and function; (iv) co-designing a PRC <em>prototype</em>; and (v) <em>testing</em> this prototype via stakeholder consultation, in preparation for pilot implementation of the PRC prototype. As this was an iterative process, the participants and procedures involved in each step are described in the order in which they occurred.</p> <p>  </p> </div> <div id="Sec5" class="Section2"> <h2>Participants and procedures</h2> <div id="Sec6" class="Section3"> <h2>Step 1: Exploring stakeholders’ priorities for PRCs</h2> <p>Procedures for <em>Step 1</em> are described in Magidson, Rose et al. (<span citationid="CR17" class="CitationRef">17</span>). From February to June 2021, 40 semi-structured interviews were conducted (<em>n</em> = 15 PWH; <em>n</em> = 25 HCWs; Table <span refid="Tab1" class="InternalRef">1</span>).  The WCDoH assisted in identifying HCWs who were at least 18 years old and either provided or managed community-based HIV services, provided clinic-based services but interacted with community-based teams, or provided SU treatment. HCWs identified PWH who were <span type="Underline" class="Underline" name="Emphasis">≥</span> 18 years old and self-reported difficulties with HIV care engagement and SU.</p> <p> </p><div class="gridtable"><table float="Yes" id="Tab1" border="1"> <caption language="En"> <div class="CaptionNumber">Table 1</div> <div class="CaptionContent"> <p>Characteristics of stakeholders participating in the co-design process</p> </div> </caption> <colgroup cols="5"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <div align="left" class="colspec" colname="c5" colnum="5"></div> <thead> <tr> <th align="left" colname="c1" morerows="1" rowspan="2"> </th> <th align="left" colSpan="2" nameend="c3" namest="c2"> <p>Interviews (Step 1)</p> </th> <th align="left" colSpan="2" nameend="c5" namest="c4"> <p>Workshops (Steps 3 &amp; 4)</p> </th> </tr> <tr> <th align="left" colname="c2"> <p><em>HCWs</em></p> <p><em>n</em> = 25</p> <p>n (%)</p> </th> <th align="left" colname="c3"> <p><em>Patients</em></p> <p><em>n</em> = 15</p> <p>n (%)</p> </th> <th align="left" colname="c4"> <p><em>HCWs</em></p> <p><em>n</em> = 12</p> <p>n (%)</p> </th> <th align="left" colname="c5"> <p><em>Patients</em></p> <p><em>n</em> = 12</p> <p>n (%)</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Age – M (SD)</p> </td> <td align="left" colname="c2"> <p>41.2 (8.8)</p> </td> <td align="left" colname="c3"> <p>40.1 (8.2)</p> </td> <td align="left" colname="c4"> <p>42.8 (15.4)</p> </td> <td align="left" colname="c5"> <p>37.5 (8.7)</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Female</p> </td> <td align="left" colname="c2"> <p>17 (68%)</p> </td> <td align="left" colname="c3"> <p>11 (73%)</p> </td> <td align="left" colname="c4"> <p>9 (75%)</p> </td> <td align="left" colname="c5"> <p>7 (58%)</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Race</p> </td> <td align="left" colname="c2"> </td> <td align="left" colname="c3"> </td> <td align="left" colname="c4"> </td> <td align="left" colname="c5"> </td> </tr> <tr> <td align="left" colname="c1"> <p>Black African</p> </td> <td align="left" colname="c2"> <p>10 (40%)</p> </td> <td align="left" colname="c3"> <p>15 (100%)</p> </td> <td align="left" colname="c4"> <p>6 (50%)</p> </td> <td align="left" colname="c5"> <p>8 (67%)</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Coloured <sup>a</sup></p> </td> <td align="left" colname="c2"> <p>12 (48%)</p> </td> <td align="left" colname="c3"> <p>0</p> </td> <td align="left" colname="c4"> <p> p> </td> <td align="left" colname="c4"> <p>4 (33%)</p> </td> <td align="left" colname="c5"> <p>-</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>1 to 3 years</p> </td> <td align="left" colname="c2"> <p>9 (36%)</p> </td> <td align="left" colname="c3"> <p>-</p> </td> <td align="left" colname="c4"> <p>4 (33%)</p> </td> <td align="left" colname="c5"> <p>-</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>&gt; 3 years</p> </td> <td align="left" colname="c2"> <p>15 (60%)</p> </td> <td align="left" colname="c3"> <p>-</p> </td> <td align="left" colname="c4"> <p>4 (33%)</p> </td> <td align="left" colname="c5"> <p>-</p> </td> </tr> <tr> <td align="left" colSpan="3" nameend="c3" namest="c1"> <p>Employment Status <em>(Patients)</em> – n (%)</p> </td> <td align="left" colname="c4"> </td> <td align="left" colname="c5"> </td> </tr> <tr> <td align="left" colname="c1"> <p>Unemployed</p> </td> <td align="left" colname="c2"> <p>-</p> </td> <td align="left" colname="c3"> <p>10 (67%)</p> </td> <td align="left" colname="c4"> <p>-</p> </td> <td align="left" colname="c5"> <p>9 (75%)</p> </td> </tr> </tbody> </colgroup> <tfoot> <tr><td colSpan="5"><sup>a</sup> Coloured is an official South African racial category referring to people of mixed-race ancestry who have a unique cultural identity</td></tr> <tr><td colSpan="5"><sup>b</sup> Other includes participants who identified as White, Indian, or Asian</td></tr> </tfoot> </table></div> <p></p> <p> Trained research assistants (RAs) obtained written informed consent before using a semi-structured interview guide to enquire about SU support needs, acceptability of using peers to address these needs, and potential roles for peers in HIV care teams. Interviews were conducted in isiXhosa or English, lasted approximately 45 minutes, and were audio-recorded, translated into English (if required), and transcribed verbatim.</p> <p>Guided by thematic analysis (<span citationid="CR44" class="CitationRef">44</span>), we used a hybrid deductive-inductive approach to code the transcripts and develop themes (<span citationid="CR45" class="CitationRef">45</span>). The interview guide was used to develop an initial codebook deductively, with inductive codes added through the open coding of several transcripts. The remaining transcripts were coded by two independent coders, who met weekly to review codes and resolve discrepancies.</p> </div> </div> <div id="Sec7" class="Section2"> <h2>Step 2: Outlining the PRC role</h2> <p>In February 2022, a US-based design team was formed, comprising (i) a certified PRC Supervisor with experience working as a PRC, and (ii) two US-based RAs with experience working on US-based studies employing PRCs and studies based in SA. First, this team met with the study’s US-based project manager to learn more about the study context and brainstorm how typical functions of the PRC role in the US could inform a SA-based PRC role.</p> <p>Next, drawing from their experience, best available evidence, and US-based PRC training materials, this team developed an overview of US-based PRC requirements and functions. In the State of Maryland, where the US team is based, PRC are defined as trained and often state-certified individuals with lived experience with substance use and recovery. In this State, individuals in recovery from substance use for two or more years are eligible to apply for PRC certification which requires completion of specialized training in Advocacy, Ethical Responsibility, Mentoring/Education, and Recovery/Wellness, and supervised practice hours. Typical functions of this role in the US include provision of psychosocial support, motivation for recovery, sharing of relevant lived experiences, and service navigation.</p> <p>In March 2022, this overview was presented to the study’s operations team, comprising three SA-based RAs (with experience working as a peer or non-clinician interventionist on SA-based studies), the SA- and US-based project managers, and a US-based clinical psychology doctoral trainee. Their feedback was used to adapt the overview. Between March and April 2022, the design and operations teams met regularly to tailor the overview to the local context and address stakeholder concerns and priorities identified during <em>Step 1</em>. The design team also recorded a brief video where the US PRC Supervisor explained the peer role. This video was shown during <em>Step 3</em> workshops.</p> <p>Meanwhile, the combined US-SA operations team co-developed objectives and HCD questions for these workshops through iterative rounds of feedback. These HCD questions took the form of “how might we” questions and broadly focused on addressing gaps in the team’s understanding of how to define the PRC role within the context of COPC teams, how to structure PRC activities, and criteria to consider when recruiting PRCs.</p> </div> <div id="Sec8" class="Section2"> <h2>Step 3: Ideation workshops with stakeholders</h2> <p>Between April and June 2022, we conducted six ideation workshops with <em>n</em> = 12 patients (across three workshops) and <em>n</em> = 12 HCWs (across three workshops); see Table <span refid="Tab1" class="InternalRef">1</span> for demographics. Recruitment and eligibility procedures followed those of <em>Step 1</em>.</p> <p>SA-based RAs obtained informed consent and collected participants’ demographic information before the workshops. The workshops began with an overview of the PRC role and the PRC video developed in <em>Step 2</em>.  Next, RAs used a semi-structured workshop guide that included the HCD questions to elicit feedback on the proposed role. Workshops were conducted in community centers or via online platforms in English, Afrikaans, or isiXhosa (the local languages) and lasted up to an hour. All workshops were audio-recorded, with recordings supplemented by RA notes.</p> <p>We used a rapid form of qualitative data analysis recommended when engaging in iterative co-design (<span citationid="CR46" class="CitationRef">46</span>). After the workshops, staff reviewed their notes and augmented these with workshop observations. Notes were checked against recordings and supplemented with quotes from participants. The operations team met to rapidly code these augmented notes for key themes and recommendations. To aid interpretation, feedback from all the workshops was distilled into a matrix organized by theme and type of stakeholder.</p> <p>In May 2022, the project operations team met with a US-licensed clinical psychologist with experience supervising US-based PRCs. During a whole-day in-person meeting, this team collaborated to use this matrix to adapt the PRC overview and develop a prototype for the PRC role in preparation for <em>Step 4</em>.</p> <div id="Sec9" class="Section3"> <h2>Step 4: Prototype co-design workshops</h2> <p>In June 2022, we invited participants from Step 3 to participate in prototype co-design workshops (<em>Step 4</em>). We conducted two workshops with HCWs (<em>n</em> = 7) and a further two workshops with patients (<em>n</em> = 9). The workshops followed <em>Step 3</em> procedures. After presenting the PRC prototype, RAs used a semi-structured guide to elicit general feedback on the prototype, adaptations required to enhance acceptability and feasibility, and strategies for addressing contextual barriers. Workshops were conducted in community centers or via online platforms in English, Afrikaans, or isiXhosa, lasting between 45–60 minutes. All workshops were audio-recorded, with recordings supplemented by RA notes. The operations team met to review this feedback, using the approach outlined in <em>Step 3</em> to rapidly adapt the PRC prototype (producing version 2) in preparation for <em>Step 5</em>.</p> </div> <div id="Sec10" class="Section3"> <h2>Step 5: Stakeholder consultation to test the prototype</h2> <p>Next, the operations team met with stakeholders responsible for commissioning and implementing COPC teams and clinic-based HIV and SU services. In these consultation meetings, we presented prototype version 2 and requested these leaders to provide feedback on the prototype including suggestions for strategies to support embedding the role within COPC teams. RAs took notes to summarize feedback. The team met to review these notes, using the approach outlined in <em>Step 3</em> to further adapt the PRC prototype, producing version 3.</p> </div> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Results</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec12" class="Section2"> <h2>Acceptability of PRC and potential roles for the PRC within COPCs (Step 1)</h2> <p>Findings have been published (<span citationid="CR17" class="CitationRef">17</span>) and are only summarized here.  Stakeholders described high levels of SU stigma among HCWs, and stigma’s impact on HIV care engagement for people with SU. All stakeholders thought PRCs could offer a unique contribution to COPC by supporting patients with SU recovery and health care navigation. HCWs commented that PRCs could be “<em>role models</em>” for patients, showing them that “<em>SU recovery is possible</em>.” Patients said they would be more comfortable talking to PRCs about SU compared to HCWs from whom they anticipated stigma. As one patient commented:</p><div class="BlockQuote"><p>I prefer someone who has had the same, has gone through what I’ve also gone through…someone that I can talk to about anything and everything.</p></div><p></p> <p>Stakeholders also thought that PRCs could help overcome stigma and other HIV care engagement barriers for patients with SU. They reflected that through social contact with HCWs and sharing their lived experience, PRCs could shift HCWs’ attitudes toward patients with SU while demonstrating effective ways of engaging with them. Further, they suggested that having PRCs on the COPC team may make HIV services more “<em>welcoming</em>” for people with SU.</p> <p>Patients and HCWs had different priorities for the role. Patients wanted the defining feature of the role to be the sharing of lived experiences of and support for SU recovery. They also prioritized tailoring the format and content of PRC services to meet individual needs, prioritizing confidentiality of PRC-patient interactions. HCW priorities focused on PRC role clarification to avoid potential role overlap with the CHW role. They also prioritized streamlining PRC activities to fit the current workflow of the COPC team. PRC wellness was an additional consideration for PRC role design, with HCWs raising the importance of PRC training and supervision including strategies to manage contextual and work-related risks to their recovery. This feedback informed planning for the PRC role in <em>Step 2</em>.</p> </div> <div id="Sec13" class="Section2"> <h2>Insights from Ideation workshops (Step 3)</h2> <p>Five themes were generated from the Ideation workshops: (i) PRC role expectations and functions; (ii) experience and knowledge prerequisites for PRC role acceptance; (iii) structure and content, (iv) location and implementation of PRC sessions; and (v) essential PRC training components.</p> </div> <div id="Sec14" class="Section2"> <h2>PRC role expectations</h2> <p>All stakeholders were supportive of integrating PRCs into COPCs. They thought PRCs would ease the workload of CHWs who were “<em>already doing too much</em>” and address an important SU service gap. These stakeholders recommended that the PRC role involve patient education about SU, its effects on HIV, and SU service options; equipping patients with SU behavior change skills, and supporting PWH to navigate barriers to SU and HIV services.</p> </div> <div id="Sec15" class="Section2"> <h2>Prerequisites for the PRC role</h2> <p>Stakeholders described relevant lived experience, personal recovery, and community knowledge as prerequisites for any PRC. There was broad consensus that lived experience of SU and SU recovery was a role prerequisite. While lived experience of HIV was less salient, stakeholders emphasized the importance of ensuring that PRC training included components focused on HIV. One HCW shared:</p><div class="BlockQuote"><p>I don&#x27;t think you only need to focus on a person that is HIV positive… I think it is a person who experienced or dealt with substance use, that is a good person to be part of the team. Because then you can speak from your own experience… that person [the peer] who dealt with it, who has the experience, can be taught [about HIV].</p></div><p></p> <p> While stakeholders agreed that PRCs did not need to have experience with a particular type of substance, they commented on the importance of PRCs being trained to understand the effects of the different substances being used in their communities. As one patient noted “<em>Alcohol or drugs [is fine]. They must at least have training [on both]</em>.” HCWs and patients recommended that the PRC have a minimum of one year in SU recovery.  They thought this general guideline would ensure that PRCs had sufficient personal experience of recovery to support others. Several HCWs thought PRCs earlier in their recovery journey would be more vulnerable for relapse when encountering open substance use scenes as they would have less established strategies for managing these environmental risks. As one HCW commented,</p><div class="BlockQuote"><p>I think for a year… there’s no timeline that keeps you safe… So you could be in recovery for ten years, then something, and then you’re back. I just wanted to say a year to give them some time to work on themselves.</p></div><p></p> <p>While there were some dissenting voices, most stakeholders believed that PRCs should not work in their own neighborhood. HCWs were concerned about the welfare of the PRC, describing the potential for the PRC to be stigmatized by their own community if their SU history became known, and for patients to visit their homes for after-hours assistance. Patients’ concerns focused around confidentiality and dual relationships, with many being more comfortable working with a PRC outside of their community. However, all stakeholders agreed that the PRC would need to be very familiar with the community and share its culture. They described this as a prerequisite for PRC safety (and therefore role feasibility) and for acceptance by the community.</p> </div> <div id="Sec16" class="Section2"> <h2>PRC session structure</h2> <p>HCWs and patients recommended structuring the PRC sessions to include an initial “<em>intensive support</em>” phase, characterized by weekly contact sessions lasting up to 30 minutes followed by a less intensive “<em>step-down</em>” phase with tapering to bimonthly and then monthly sessions. As a HCW commented:</p><div class="BlockQuote"><p>I would say, in the acute phase, you should obviously have more frequent visits, until you see [the patient] is working with you, cooperating, then you will have less visits…stagger it, so that at least you have a system of, “now you’re in the acute phase, but now you’re going to a less acute phase where you now see less of me and can perform and function on your own.</p></div><p></p> <p>Stakeholders’ recommendations for the duration of PRC contact ranged from one to six months, recommending that “<em>the timeframe should be tailored [to the person]</em>.” After discussion, they agreed it would be feasible to provide PRC sessions tapering in frequency for up to three months.</p> <p>Stakeholders also discussed session delivery, prioritizing face-to-face contact. While some patients recommended supplementing this with digital or telehealth contact, HCWs were concerned that this would over-burden the PRC as they would be <em>“on call like 24/7.”</em> Stakeholders also raised concerns about confidentiality when using digital messaging services, commenting that others might view these messages as mobile phones were often shared within households.</p> </div> <div id="Sec17" class="Section2"> <h2>Session location</h2> <p>Stakeholders provided suggestions for the location of PRC sessions including patients’ homes, community spaces such as libraries, and clinics. Some patients worried that the PRC may be uncomfortable conducting sessions in their homes, suggesting that “<em>the first few sessions should be at the clinic so that I can tell them about my home situation and they can decide if they want to still come to my house</em>.” Others raised stigma concerns, stating that PRC home visits (when separate from routine CHW visits), would inform neighbors about their SU. As a result, stakeholders agreed that the PRC should offer patients a choice of session location and that the physical and psychological safety of both the PRC and patient should be considered when selecting the session location.</p> </div> <div id="Sec18" class="Section2"> <h2>PRC training</h2> <p>Stakeholders highlighted knowledge and skills-based competencies to target in PRC training. Stakeholders agreed that training should include topics on HIV and SU, including the effects of various substances, the impact of SU on HIV, SU treatment options and how to support patients to navigate barriers to SU behavior change and services. In addition, stakeholders training on therapeutic competencies related to confidentiality and professional ethics, non-judgmental communication, and therapeutic relationships. Patients emphasized the therapeutic relationship, saying that PRCs “<em>must bring you on a level that you feel comfortable</em>” and “<em>must be trained to build relations</em>.” HCWs emphasized training on professional work practice, especially for peers new to the healthcare workforce. As one HCW commented:</p><div class="BlockQuote"><p> <em>…the ethics and the professionalism that needs to be brought into training so that people know yes, you’re using substances, but it is not for me to go and tell the whole world that you are in the program</em>.</p></div><p></p> <p>This feedback shaped the initial PRC role prototype, described in Table <span refid="Tab2" class="InternalRef">2</span>.</p> <p> </p><div class="gridtable"><table float="Yes" id="Tab2" border="1"> <caption language="En"> <div class="CaptionNumber">Table 2</div> <div class="CaptionContent"> <p>A description of the changes made to the PRC prototype at each stage of the co-design process.</p> </div> </caption> <colgroup cols="4"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <thead> <tr> <th align="left" colname="c1"> <p>Role Description</p> </th> <th align="left" colname="c2"> <p>PRC prototype (Version 1); produced after ideation workshops</p> <p><em>(Step 3)</em></p> </th> <th align="left" colname="c3"> <p>Revised prototype (Version 2); produced after co-design workshops</p> <p><em>(Step 4)</em></p> </th> <th align="left" colname="c4"> <p>Revised prototype (Version 3); produced after consultation with health leaders</p> <p><em>(Step 5)</em></p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p><b>Role Prerequisites</b></p> </td> <td align="left" colname="c2"> <p>• Lived experience of SU</p> <p>• At least one year of SU recovery.</p> <p>• Lived experience of HIV is not essential</p> <p>• Understanding of community dynamics</p> <p>• Share language and culture of community</p> </td> <td align="left" colname="c3"> <p><em>No changes</em></p> </td> <td align="left" colname="c4"> <p><em>No changes</em></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Role expectations and core activities</b></p> </td> <td align="left" colname="c2"> <p>• Provide education on HIV and SU</p> <p>• Support patients to connect to and navigate SU and health services</p> <p>• Support to enhance motivation and overcome barriers to SU and health service use</p> </td> <td align="left" colname="c3"> <p><em>Added</em>:</p> <p>• Sharing of personal experience to reduce stigma and instill hope for recovery</p> </td> <td align="left" colname="c4"> <p><em>Added</em>:</p> <p>• Participation in supervision and peer mentorship</p> <p>• Participation in self-care activities</p> <p>• Participation in COPC team activities and meetings</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Working conditions</b></p> </td> <td align="left" colname="c2"> <p><em>Not addressed</em></p> </td> <td align="left" colname="c3"> <p><em>Added</em>:</p> <p>• Safety: PRC to work in pairs or be accompanied by a CHW</p> <p>• Working hours and conditions identical to those of COPC members.</p> <p>• No after-hours contact; respond to messages on next working day.</p> <p>• No uniform due to stigma concerns.</p> </td> <td align="left" colname="c4"> <p><em>No changes</em></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Core elements of PRC training</b></p> </td> <td align="left" colname="c2"> <p>• Confidentiality and professional ethics</p> <p>• Content knowledge:</p> <p>- SU, HIV, and how they relate</p> <p>- Local SU services and how these can be accessed.</p> <p>• Basic counselling skills to support behavior change:</p> <p>- Motivational Interviewing</p> <p>- Nonjudgmental communication</p> <p>- Problem Solving</p> <p>- Behavioral Activation</p> </td> <td align="left" colname="c3"> <p><em>Added</em>:</p> <p>• Training on safe sharing of personal experiences of SU and SU recovery</p> </td> <td align="left" colname="c4"> <p><em>Added</em>:</p> <p>• Information and training on COPCs</p> <p>• Self-care skills to support PRC well-being and recovery</p> <p>• Benefits of supervision and peer mentorship/debriefing</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Structure and content of PRC sessions</b></p> </td> <td align="left" colname="c2"> <p>• <em>Structure</em>:</p> <p>- One-on-one sessions for 12 weeks</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Session 1</span>: Describe PRC role, establish confidentiality and preferences for session format and location.</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 1–4</span>: 1 session per week</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 5–8</span>: 1 session every 2 weeks</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 9–12</span>: Patient and PRC to decide on frequency</p> <p>• <em>Duration</em>: ~30 minutes, with up to an hour scheduled</p> <p>• <em>Location</em>: Initial contact (session one) at patient’s home, COPC will introduce PRC, location of other visits to be decided.</p> <p>• <em>Mode</em>: Face-to-face delivery with telephonic delivery if required.</p> </td> <td align="left" colname="c3"> <p><em>Added</em>:</p> <p>• <em>Structure</em>:</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Session 1</span>: Establish preferences for session times. Clarify boundaries of PRC role and after-hours availability. Share personal experience to engage patient.</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 1–4</span>: Help identify and navigate challenges to engaging in SU/HIV care via education, sharing lived experience and teaching skills for behavior change.</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 5–8</span>: Provide support for recovery and enhance motivation for care engagement, using skills described above.</p> <p>- <span type="Underline" class="Underline" name="Emphasis">Weeks 9–12</span>: Provide support for care engagement (if required). Help patient transition from the PRC to other recovery supports in the community (e.g. support groups).</p> <p>• <em>Location</em>: Not all patients endorsed an initial home visit due to stigma and safety concerns. To enhance acceptability, the initial PRC session will not occur in a separate home visit. It will be delivered during CHWs’ routine visits to the patient’s household.</p> </td> <td align="left" colname="c4"> <p><em>No changes</em></p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Strategies to facilitate PRC integration into COPC teams</b></p> </td> <td align="left" colname="c2"> <p><em>Not addressed</em></p> </td> <td align="left" colname="c3"> <p><em>Not addressed</em></p> </td> <td align="left" colname="c4"> <p><em>Added</em>:</p> <p>• COPC training prior to integration:</p> <p>- Information on SU, HIV and stigma</p> <p>- Information on PRC role and how it can support the COPC</p> <p>- PRC video</p> <p>- Strategies for supporting COPC wellness</p> <p>- Opportunities to discuss and resolve any concerns</p> <p>• Formal introduction of PRC to COPC at a team meeting</p> <p>• PRC to accompany CHWs on home visits for 8–10 weeks to ensure familiarity with COPC activities and processes, patients, and the community and to build team relationships.</p> <p>• PRC supervision and mentoring</p> </td> </tr> </tbody> </colgroup> </table></div> <p></p> </div> <div id="Sec19" class="Section2"> <h2>Feedback from prototype co-design workshops (Step 4)</h2> <p>Stakeholders largely endorsed the proposed prerequisites for the PRC role, role expectations, training components, and session structure. Stakeholders recommended augmenting this prototype to include strategies for managing contextual challenges like safety, a description of the PRC’s working conditions, and more detail about PRC session content. Table <span refid="Tab2" class="InternalRef">2</span> presents changes to the prototype based on this feedback.</p> </div> <div id="Sec20" class="Section2"> <h2>Feedback from consultation meetings (Step 5)</h2> <p>Stakeholders responsible for commissioning and implementing HIV and SU services endorsed the revised prototype but noted that it did not address the context of the COPC team. HIV experts recommended expanding PRC role expectations to include participation in the broader COPC team and augmenting the proposed training components to include information on COPCs. They also recommended developing PRC integration training for the COPC team to orient them to the PRC role. Further, SU experts recommended augmenting both the PRC role expectations and training schedule to include supervision, peer mentoring and self-care components. They described these components as necessary for helping PRCs navigate potential barriers to their integration within COPC teams, complex community dynamics, and role boundaries while supporting their professional development and safety. Table <span refid="Tab2" class="InternalRef">2</span> outlines modifications based on this feedback.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>This paper contributes to a small but expanding literature on the value of HCD approaches when designing interventions for dissemination and sustainment (<span citationid="CR36" class="CitationRef">36</span>, <span citationid="CR40" class="CitationRef">40</span>, <span citationid="CR47" class="CitationRef">47</span>) by demonstrating the benefits of a stakeholder-engaged, HCD approach to the design of workforce innovations that address the SU service gap in resource-constrained settings. Overall, the multiple stakeholder groups we engaged in the design process thought it was acceptable and feasible to embed PRCs into COPC teams, with the caveat that the PRC role should remain distinct from existing roles within the COPC team. These stakeholders thought the PRC should focus on providing SU recovery and care navigation supports for PWH⸺ services that CHWs do not have the time, training, or capabilities to provide as reported by previous studies (<span citationid="CR14" class="CitationRef">14</span>). Despite this consensus, patients and HCW stakeholders differed in their reasons for wanting the PRC role to remain distinct from that of CHWs within COPC teams.</p> <p>More specifically, patient stakeholders prioritized the relational components of the PRC role, desiring a better care experience than the one they currently received from CHWs. Like earlier studies (<span citationid="CR25" class="CitationRef">25</span>, <span citationid="CR27" class="CitationRef">27</span>), patients described their HIV care experience as characterized by SU stigma, poor care quality, and unsupportive provider relationships. These stakeholders hoped that PRCs could offer an alternative care experience by sharing their lived experience of SU recovery to build a strong patient-PRC relationship, and by providing person-centered and confidential support for SU recovery and health care navigation tailored to their personal treatment goals. They also wanted flexibility and choice in how sessions were structured and delivered, similar to patient and peer feedback on the essential elements of PRC services from US-based research (<span citationid="CR34" class="CitationRef">34</span>, <span citationid="CR48" class="CitationRef">48</span>). During the iterative design process, we used this feedback to modify the PRC prototype to better align with patients’ priorities and preferences. Modifications included (i) expanding PRC role expectations and session content to foreground the sharing of lived SU experiences; (ii) integrating the initial PRC visit with routine CHW visits to the patient’s home to help with initial relationship building and to address SU stigma concerns; and (iii) introducing opportunities for shared decision making about the structure and delivery of PRC sessions.</p> <p>In contrast, HCW stakeholders prioritized greater definition and clarification of the PRC role, including role boundaries, and suggested modifications to better align the PRC’s work practice with that of the COPC team. They were concerned about potential role duplication and that differences in working conditions, expectations, and practice may increase the amount and complexity of their work. These concerns are not surprising given the unpredictability and insecurity of CHW employment contracts (<span citationid="CR49" class="CitationRef">49</span>) and the well-documented high workload of COPC teams (<span citationid="CR7" class="CitationRef">7</span>). CHWs are unlikely to welcome a PRC into their teams if they think this will make their role redundant or increase the complexity of their work. Role ambiguity has been identified as a barrier to embedding PRCs within US-based primary care (<span citationid="CR50" class="CitationRef">50</span>) and non-specialist providers within primary healthcare more generally (<span citationid="CR51" class="CitationRef">51</span>, <span citationid="CR52" class="CitationRef">52</span>). In response to these concerns, we modified the PRC prototype to minimize any role duplication by clarifying that CHWs would be responsible for HIV treatment support and PRCs would be responsible for SU-related support, currently not provided by CHWs. Further modifications were made to align the PRC’s proposed working conditions and expectations for professional work practice with those of the COPC team, with PRC training and supervision augmented to address these components.</p> <p>Role clarification was not a salient concern for HIV and SU service leaders, possibly because they were consulted later in the design process. These stakeholders offered unique insights, based on their health systems experience, into the readiness of COPC teams for PRC integration. They emphasized the need for COPC team members to be educated about the potential contributions of the PRC role and the need to invest in preparing COPC teams for PRC integration. These stakeholders raised concerns about the potential impact on PRC wellness if the COPC team climate was not welcoming, suggesting that the PRC may require additional mentoring and support to navigate these implementation barriers and ensure their psychological safety within the COPC team. These recommendations are aligned with the experiences of introducing peer services for SU and mental health in other contexts (<span citationid="CR53" class="CitationRef">53</span>, <span citationid="CR54" class="CitationRef">54</span>). Based on this feedback, we added the following components to the PRC prototype: (i) COPC team integration training focused on raising awareness of and fostering openness to the PRC role, (ii) COPC preparation activities to create opportunities for the PRC to build relationships with team members through meetings and work shadowing, (iii) additional training components to orient the PRC to the COPC environment and how to work effectively with the COPC team, (iv) clinical supervision and peer mentoring to support PRCs to deliver high-quality support, navigate dynamics within the COPC team and community, and their psychological safety and wellbeing in complex environments. Earlier studies also identified training and relational work with existing staff as key strategies for supporting the implementation of primary healthcare workforce innovations for mental health (<span citationid="CR55" class="CitationRef">55</span>) and supervision and peer mentoring as important strategies for preventing burnout and protecting the wellbeing of non-specialist health providers in SA(<span citationid="CR23" class="CitationRef">23</span>, <span citationid="CR56" class="CitationRef">56</span>).</p> <p>While findings highlight the value of including patient, provider, and systems perspectives, engaging multiple stakeholder groups in co-design is complex and fraught with power imbalances. This study included patients who were marginalised by their socio-economic status, HIV and SU, and CHWs with little power or agency in the healthcare system (<span citationid="CR5" class="CitationRef">5</span>). Further, there were power imbalances within our study team, inherent when adapting an intervention from the global North for application in the global South, and where teams include people with lived experience of SU and other stigmatized identities. To limit the impact of these imbalances on stakeholder inputs, we intentionally used mutual capacity-building (which promotes equitable bidirectional learning) as a guiding framework for stakeholder engagement (<span citationid="CR57" class="CitationRef">57</span>, <span citationid="CR58" class="CitationRef">58</span>). In all team and stakeholder activities, we worked to ensure that all contributions were equally valued, a diversity of perspectives was encouraged, and everyone felt respected.  We distributed leadership and decision-making power across teams and groups, encouraging open discussion, and preferencing stakeholder contributions and the local voice, rather than those of the study team, in design decisions. With an iterative design process, we were able to demonstrate how stakeholder feedback led to prototype modifications, building trust in the design process and enhancing the quality of their contributions. As this approach enriched our design process, we recommend mutual capacity building as a framework for supporting stakeholder engagement in the co-design of SU interventions.</p> <p>Despite this strength, there are limitations to consider. A relatively small number of patients and HCWs participated in the workshops. Additional engagement with a wider range of patients and HCWs may identify further modifications to the PRC role that could broaden its appeal and utility. Second, the PRC role was designed to be embedded in COPC teams working within disadvantaged communities in the Cape Town metropole where there are high levels of unmet SU-related needs and structural barriers to accessing SU treatment (<span citationid="CR59" class="CitationRef">59</span>). Inter-provincial differences in the organization, function, and funding of COPC teams and unmet need for SU treatment (<span citationid="CR5" class="CitationRef">5</span>, <span citationid="CR9" class="CitationRef">9</span>) may affect the relevance and utility of the PRC role beyond the current context. Third, we did not quantitatively assess acceptability, feasibility, or appropriateness at each step of the co-design process. Future studies should consider embedding quantitative implementation outcome measures into the co-design process so that the potential utility of the HCD process for enhancing acceptability, feasibility, and appropriateness can be systematically evaluated.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>This paper describes a methodological process that may be useful to other teams developing PRC roles for primary healthcare teams. Through engaging stakeholders with diverse perspectives in the design process, we were better able to understand and respond to their priorities and preferences for the PRC role, enhancing role acceptability and contextual fit. Stakeholder engagement helped identify patient-, provider-, and systems-level barriers to role implementation; the iterative design process allowed us to modify the PRC prototype to enhance role feasibility and contextual fit. Stakeholder engagement also served as an implementation strategy, building collective ownership in the role and helping us identify champions to support the pilot implementation of this workforce innovation.  A pilot study (NCT05907174) is underway to evaluate the acceptability and feasibility of embedding the PRC role within COPC teams and preliminary effects on HIV care engagement. While findings from this pilot are likely to inform further modifications to the PRC role prototype, we believe investment in this stakeholder-driven approach to PRC role design will enhance the likelihood of future scaling and sustainment of this role.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p><strong>Acknowl
