suffix":""},{"id":327154589,"identity":"278ca92d-6d6f-42ee-b844-39d5c878a2fe","order_by":4,"name":"Alexandra Rose","email":"","orcid":"","institution":"Department of Psychology, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Alexandra","middleName":"","lastName":"Rose","suffix":""},{"id":327154590,"identity":"06e658be-2644-40b9-aa59-951b1e58804e","order_by":5,"name":"Nonceba Ciya","email":"","orcid":"","institution":"Mental Health, Alcohol, Substance Use and Tobacco Research Unit, South African Medical Research Council","correspondingAuthor":false,"prefix":"","firstName":"Nonceba","middleName":"","lastName":"Ciya","suffix":""},{"id":327154591,"identity":"edd690d8-d3db-4cd9-bd09-bdb05babac03","order_by":6,"name":"Sibabalwe Ndamase","email":"","orcid":"","institution":"Mental Health, Alcohol, Substance Use and Tobacco Research Unit, South African Medical Research Council","correspondingAuthor":false,"prefix":"","firstName":"Sibabalwe","middleName":"","lastName":"Ndamase","suffix":""},{"id":327154592,"identity":"ea895c58-2d04-461d-9c25-bed68f5ea29f","order_by":7,"name":"Yuche Jacobs","email":"","orcid":"","institution":"Mental Health, Alcohol, Substance Use and Tobacco Research Unit, South African Medical Research Council","correspondingAuthor":false,"prefix":"","firstName":"Yuche","middleName":"","lastName":"Jacobs","suffix":""},{"id":327154593,"identity":"ec55a940-9d99-4b68-ad52-e7e540b72bbc","order_by":8,"name":"Morgan Anvari","email":"","orcid":"","institution":"Department of Psychology, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Morgan","middleName":"","lastName":"Anvari","suffix":""},{"id":327154594,"identity":"dd4fbc07-bb9e-4ab8-bbc6-0e0c687eb39a","order_by":9,"name":"Abigail Hines","email":"","orcid":"","institution":"Department of Psychology, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Abigail","middleName":"","lastName":"Hines","suffix":""},{"id":327154596,"identity":"4ab3d700-9be1-4337-bb94-f250d14fd279","order_by":10,"name":"Dwayne Dean","email":"","orcid":"","institution":"Department of Psychology, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Dwayne","middleName":"","lastName":"Dean","suffix":""},{"id":327154597,"identity":"2bc0da8b-ea69-46e3-aadb-30d4f6ec9227","order_by":11,"name":"Rithika Baskar","email":"","orcid":"","institution":"Department of Psychology, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Rithika","middleName":"","lastName":"Baskar","suffix":""},{"id":327154600,"identity":"73aa56f4-5fcd-42dd-8fca-b820aa9f10aa","order_by":12,"name":"Jessica Magidson","email":"","orcid":"","institution":"Center for Substance Use, Addiction \u0026 Health Research, University of Maryland","correspondingAuthor":false,"prefix":"","firstName":"Jessica","middleName":"","lastName":"Magidson","suffix":""}],"badges":[],"createdAt":"2024-06-12 00:55:47","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-4566640/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-4566640/v1","draftVersion":[],"editorialEvents":[{"content":"https://doi.org/10.1186/s13722-025-00544-3","type":"published","date":"2025-02-13T15:57:36+00:00"}],"editorialNote":"","failedWorkflow":false,"files":[{"id":60625413,"identity":"53064d3c-9ec3-42aa-9395-67d1b71d99f9","added_by":"auto","created_at":"2024-07-18 22:23:33","extension":"png","order_by":1,"title":"Figure 1","display":"","copyAsset":false,"role":"figure","size":104557,"visible":true,"origin":"","legend":"\u003cp\u003eThe process of designing a peer recovery coach role for community-oriented primary care teams in South Africa\u003c/p\u003e","description":"","filename":"1.png","url":"https://assets-eu.researchsquare.com/files/rs-4566640/v1/145e7888a06196034ba33ff4.png"},{"id":76487552,"identity":"6337fbef-c6da-4ce0-8f29-90edc9a1563f","added_by":"auto","created_at":"2025-02-17 16:09:00","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":1640925,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-4566640/v1/c1c048a2-e867-4879-8930-b276ae1ab01c.pdf"}],"financialInterests":"No competing interests reported.","formattedTitle":"A stakeholder-driven approach to designing a peer recovery coach role for implementation in community-oriented primary care teams in South Africa","fulltext":[{"header":"Background","content":"\u003cp\u003eAlthough South Africa (SA) has significantly expanded access to antiretroviral therapy (ART) for people with HIV (PWH), less than two-thirds of PWH in South Africa attain viral suppression (\u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e1\u003c/span\u003e). Intermittent or discontinued HIV treatment contributes to sub-optimal viral suppression rates (\u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2\u003c/span\u003e), with only 38% of PWH continually engaging in ART during the first 12 months after initiation (\u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e3\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eIn response, the South African Department of Health has introduced ward- or community-oriented primary care (COPC) teams to bridge gaps between out-of-care patients and clinic-based HIV services (\u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e4\u003c/span\u003e, \u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e). COPC teams are linked to a primary care clinic and comprises an enrolled nurse outreach team leader and community health workers (CHWs) (\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e). These COPCs provide up to 400 households in their clinic\u0026rsquo;s geographical catchment area with HIV treatment supports, including support for out-of-care PWH to re-engage with clinic-based services and referral to health and social services for co-occurring conditions that affect HIV treatment engagement (\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e, \u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eOne co-occurring condition that CHWs are likely to encounter when working with out-of-care PWH is substance use (SU). SU is highly prevalent in SA (\u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e8\u003c/span\u003e), particularly in the Western Cape province where population-level rates of SU disorders are significantly higher than the rest of the country (\u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e). Although the prevalence of SU among PWH is unknown, approximately a third of PWH attending clinics in the Western Cape are estimated to have SU difficulties (\u003cspan citationid=\"CR10\" class=\"CitationRef\"\u003e10\u003c/span\u003e). As SU is associated with sub-optimal ART adherence and treatment disengagement (\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e, \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e12\u003c/span\u003e), the prevalence of SU difficulties may be even higher among out-of-care PWH receiving COPC.\u003c/p\u003e \u003cp\u003eYet CHWs are not routinely trained to screen for SU, limiting their ability to assist out-of-care PWH struggling with this care engagement barrier (\u003cspan additionalcitationids=\"CR14\" citationid=\"CR13\" class=\"CitationRef\"\u003e13\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e15\u003c/span\u003e). While there have been recent initiatives to train CHWs and other healthcare workers (HCW) to conduct screening and brief interventions for SU (\u003cspan citationid=\"CR16\" class=\"CitationRef\"\u003e16\u003c/span\u003e), high levels of SU stigma among CHWs (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e, \u003cspan citationid=\"CR18\" class=\"CitationRef\"\u003e18\u003c/span\u003e) may limit the potential benefits of this training for HIV care engagement.\u003c/p\u003e \u003cp\u003eSU stigma among CHWs and other HCWs affects access to effective HIV care (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e, \u003cspan citationid=\"CR19\" class=\"CitationRef\"\u003e19\u003c/span\u003e, \u003cspan citationid=\"CR20\" class=\"CitationRef\"\u003e20\u003c/span\u003e). Evidence suggests that HCWs with high levels of SU stigma are less likely to provide evidence-based interventions or person-centered care (\u003cspan additionalcitationids=\"CR22 CR23\" citationid=\"CR21\" class=\"CitationRef\"\u003e21\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR24\" class=\"CitationRef\"\u003e24\u003c/span\u003e). In addition, anticipated and enacted SU stigma affects PWH\u0026rsquo;s readiness for HIV care engagement (\u003cspan additionalcitationids=\"CR26\" citationid=\"CR25\" class=\"CitationRef\"\u003e25\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR27\" class=\"CitationRef\"\u003e27\u003c/span\u003e). Therefore, SU stigma needs to be addressed for CHWs to effectively support people with SU to re-engage in HIV treatment.\u003c/p\u003e \u003cp\u003eConverging evidence suggests that SU stigma reduction interventions involving sustained social contact with people in SU recovery have the largest and most durable effects on HCW stigma (\u003cspan citationid=\"CR22\" class=\"CitationRef\"\u003e22\u003c/span\u003e, \u003cspan citationid=\"CR28\" class=\"CitationRef\"\u003e28\u003c/span\u003e). Consequently, peer recovery coaches (PRCs) \u0026mdash;trained individuals with lived experience of SU\u0026mdash;are increasingly being integrated into primary healthcare teams in the US as a strategy for expanding their capacity to link patients with SU to care (\u003cspan citationid=\"CR29\" class=\"CitationRef\"\u003e29\u003c/span\u003e, \u003cspan citationid=\"CR30\" class=\"CitationRef\"\u003e30\u003c/span\u003e). In these teams, PRCs work directly with patients to provide personalized support for SU recovery and SU treatment and health care navigation. US-based PRC intervention studies have demonstrated the PRC role\u0026rsquo;s feasibility and acceptability, reporting significantly higher rates of SU treatment initiation and engagement among patients who received peer-delivered supports compared to those in standard care (\u003cspan additionalcitationids=\"CR31 CR32 CR33\" citationid=\"CR30\" class=\"CitationRef\"\u003e30\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR34\" class=\"CitationRef\"\u003e34\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eIntegrating PRCs into COPC teams may help shift SU stigma among CHWs and help CHWs patients reduce SU-related barriers to HIV care engagement. In fact, the idea of training peers to provide SU-related supports for PWH emerged organically from our team\u0026rsquo;s prior work with PWH and lived experience of SU in this setting (\u003cspan citationid=\"CR18\" class=\"CitationRef\"\u003e18\u003c/span\u003e). Despite this, the PRC role represents a workforce innovation for SA, and there are likely to be patient-, provider-, and system-level barriers to the uptake, implementation, and sustainment of this new role. To optimize acceptability, feasibility and contextual appropriateness, we partnered with key stakeholders and used a human-centered design (HCD) process (\u003cspan citationid=\"CR35\" class=\"CitationRef\"\u003e35\u003c/span\u003e, \u003cspan citationid=\"CR36\" class=\"CitationRef\"\u003e36\u003c/span\u003e) to develop a PRC role that builds off successful US models. This was informed by Designing for Dissemination and Sustainability, an implementation science concept that recommends stakeholder engagement in the design process as a strategy for ensuring that innovations are developed that are aligned with stakeholder preferences and priorities and responsive to potential implementation barriers (\u003cspan citationid=\"CR37\" class=\"CitationRef\"\u003e37\u003c/span\u003e, \u003cspan citationid=\"CR38\" class=\"CitationRef\"\u003e38\u003c/span\u003e). The aim of this paper is to describe a multi-level stakeholder-driven approach to co-designing a PRC role for integration into COPC teams in Cape Town, SA.\u003c/p\u003e"},{"header":"Methods","content":"\u003cdiv id=\"Sec3\" class=\"Section2\"\u003e \u003ch2\u003eSetting\u003c/h2\u003e \u003cp\u003eThis study was conducted in low-income communities within the Eastern, Khayelitsha, and Klipfontein subdistricts within Cape Town. These subdistricts are characterized by high rates of poverty, HIV, crime, and SU. Free HIV testing and treatment is available at community health clinics, which oversee COPC teams and other HIV services provided by CHWs. The Western Cape Department of Health (WCDoH) contracts non-governmental organizations (NGOs) to employ CHWs and operate COPC teams (\u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e). Although SU treatment options are limited, there are free or low-cost outpatient programs available in these districts (\u003cspan citationid=\"CR39\" class=\"CitationRef\"\u003e39\u003c/span\u003e).\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec4\" class=\"Section2\"\u003e \u003ch2\u003eDesign\u003c/h2\u003e \u003cp\u003eWe chose HCD as our design method as it facilitates the rapid implementation of health system and workforce innovations (\u003cspan citationid=\"CR36\" class=\"CitationRef\"\u003e36\u003c/span\u003e, \u003cspan citationid=\"CR40\" class=\"CitationRef\"\u003e40\u003c/span\u003e). HCD seeks to understand the implementation context and stakeholders\u0026rsquo; design priorities and concerns (\u003cspan citationid=\"CR41\" class=\"CitationRef\"\u003e41\u003c/span\u003e), actively involving stakeholders in the design process (\u003cspan citationid=\"CR42\" class=\"CitationRef\"\u003e42\u003c/span\u003e). Our approach involved five steps (\u003cspan citationid=\"CR43\" class=\"CitationRef\"\u003e43\u003c/span\u003e) shown in Fig.\u0026nbsp;\u003cspan refid=\"Fig1\" class=\"InternalRef\"\u003e1\u003c/span\u003e: (i) \u003cem\u003eempathizing\u003c/em\u003e with stakeholders by understanding their priorities and concerns about the proposed role; (ii) \u003cem\u003edefining\u003c/em\u003e the PRC role and identifying information gaps; (iii) \u003cem\u003eideation\u003c/em\u003e of the PRC role and function; (iv) co-designing a PRC \u003cem\u003eprototype\u003c/em\u003e; and (v) \u003cem\u003etesting\u003c/em\u003e this prototype via stakeholder consultation, in preparation for pilot implementation of the PRC prototype. As this was an iterative process, the participants and procedures involved in each step are described in the order in which they occurred.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec5\" class=\"Section2\"\u003e \u003ch2\u003eParticipants and procedures\u003c/h2\u003e \u003cdiv id=\"Sec6\" class=\"Section3\"\u003e \u003ch2\u003eStep 1: Exploring stakeholders\u0026rsquo; priorities for PRCs\u003c/h2\u003e \u003cp\u003eProcedures for \u003cem\u003eStep 1\u003c/em\u003e are described in Magidson, Rose et al. (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e). From February to June 2021, 40 semi-structured interviews were conducted (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;15 PWH; \u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;25 HCWs; Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e).  The WCDoH assisted in identifying HCWs who were at least 18 years old and either provided or managed community-based HIV services, provided clinic-based services but interacted with community-based teams, or provided SU treatment. HCWs identified PWH who were \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003e\u0026ge;\u003c/span\u003e\u0026thinsp;18 years old and self-reported difficulties with HIV care engagement and SU.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab1\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 1\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eCharacteristics of stakeholders participating in the co-design process\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"5\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c5\" colnum=\"5\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\" morerows=\"1\" rowspan=\"2\"\u003e\u0026nbsp;\u003c/th\u003e \u003cth align=\"left\" colspan=\"2\" nameend=\"c3\" namest=\"c2\"\u003e \u003cp\u003eInterviews (Step 1)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colspan=\"2\" nameend=\"c5\" namest=\"c4\"\u003e \u003cp\u003eWorkshops (Steps 3 \u0026amp; 4)\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u003cem\u003eHCWs\u003c/em\u003e\u003c/p\u003e \u003cp\u003e\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;25\u003c/p\u003e \u003cp\u003en (%)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003ePatients\u003c/em\u003e\u003c/p\u003e \u003cp\u003e\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;15\u003c/p\u003e \u003cp\u003en (%)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eHCWs\u003c/em\u003e\u003c/p\u003e \u003cp\u003e\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12\u003c/p\u003e \u003cp\u003en (%)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c5\"\u003e \u003cp\u003e\u003cem\u003ePatients\u003c/em\u003e\u003c/p\u003e \u003cp\u003e\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12\u003c/p\u003e \u003cp\u003en (%)\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eAge \u0026ndash; M (SD)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e41.2 (8.8)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e40.1 (8.2)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e42.8 (15.4)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e37.5 (8.7)\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFemale\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e17 (68%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e11 (73%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e9 (75%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e7 (58%)\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eRace\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e\u0026nbsp;\u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e\u0026nbsp;\u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e\u0026nbsp;\u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eBlack African\u003c/p\u003e \u003c/td\u mest=\"c1\"\u003e \u003cp\u003eYears in Current Role \u003cem\u003e(HCWs)\u003c/em\u003e \u0026ndash; n (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e\u0026nbsp;\u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u0026lt;\u0026thinsp;1 year\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e1 (4%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e4 (33%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e1 to 3 years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e9 (36%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e4 (33%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u0026gt;\u0026thinsp;3 years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e15 (60%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e4 (33%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colspan=\"3\" nameend=\"c3\" namest=\"c1\"\u003e \u003cp\u003eEmployment Status \u003cem\u003e(Patients)\u003c/em\u003e \u0026ndash; n (%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e\u0026nbsp;\u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eUnemployed\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e10 (67%)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e-\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c5\"\u003e \u003cp\u003e9 (75%)\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003ctfoot\u003e \u003ctr\u003e\u003ctd colspan=\"5\"\u003e\u003csup\u003ea\u003c/sup\u003e Coloured is an official South African racial category referring to people of mixed-race ancestry who have a unique cultural identity\u003c/td\u003e\u003c/tr\u003e \u003ctr\u003e\u003ctd colspan=\"5\"\u003e\u003csup\u003eb\u003c/sup\u003e Other includes participants who identified as White, Indian, or Asian\u003c/td\u003e\u003c/tr\u003e \u003c/tfoot\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003e Trained research assistants (RAs) obtained written informed consent before using a semi-structured interview guide to enquire about SU support needs, acceptability of using peers to address these needs, and potential roles for peers in HIV care teams. Interviews were conducted in isiXhosa or English, lasted approximately 45 minutes, and were audio-recorded, translated into English (if required), and transcribed verbatim.\u003c/p\u003e \u003cp\u003eGuided by thematic analysis (\u003cspan citationid=\"CR44\" class=\"CitationRef\"\u003e44\u003c/span\u003e), we used a hybrid deductive-inductive approach to code the transcripts and develop themes (\u003cspan citationid=\"CR45\" class=\"CitationRef\"\u003e45\u003c/span\u003e). The interview guide was used to develop an initial codebook deductively, with inductive codes added through the open coding of several transcripts. The remaining transcripts were coded by two independent coders, who met weekly to review codes and resolve discrepancies.\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv id=\"Sec7\" class=\"Section2\"\u003e \u003ch2\u003eStep 2: Outlining the PRC role\u003c/h2\u003e \u003cp\u003eIn February 2022, a US-based design team was formed, comprising (i) a certified PRC Supervisor with experience working as a PRC, and (ii) two US-based RAs with experience working on US-based studies employing PRCs and studies based in SA. First, this team met with the study\u0026rsquo;s US-based project manager to learn more about the study context and brainstorm how typical functions of the PRC role in the US could inform a SA-based PRC role.\u003c/p\u003e \u003cp\u003eNext, drawing from their experience, best available evidence, and US-based PRC training materials, this team developed an overview of US-based PRC requirements and functions. In the State of Maryland, where the US team is based, PRC are defined as trained and often state-certified individuals with lived experience with substance use and recovery. In this State, individuals in recovery from substance use for two or more years are eligible to apply for PRC certification which requires completion of specialized training in Advocacy, Ethical Responsibility, Mentoring/Education, and Recovery/Wellness, and supervised practice hours. Typical functions of this role in the US include provision of psychosocial support, motivation for recovery, sharing of relevant lived experiences, and service navigation.\u003c/p\u003e \u003cp\u003eIn March 2022, this overview was presented to the study\u0026rsquo;s operations team, comprising three SA-based RAs (with experience working as a peer or non-clinician interventionist on SA-based studies), the SA- and US-based project managers, and a US-based clinical psychology doctoral trainee. Their feedback was used to adapt the overview. Between March and April 2022, the design and operations teams met regularly to tailor the overview to the local context and address stakeholder concerns and priorities identified during \u003cem\u003eStep 1\u003c/em\u003e. The design team also recorded a brief video where the US PRC Supervisor explained the peer role. This video was shown during \u003cem\u003eStep 3\u003c/em\u003e workshops.\u003c/p\u003e \u003cp\u003eMeanwhile, the combined US-SA operations team co-developed objectives and HCD questions for these workshops through iterative rounds of feedback. These HCD questions took the form of \u0026ldquo;how might we\u0026rdquo; questions and broadly focused on addressing gaps in the team\u0026rsquo;s understanding of how to define the PRC role within the context of COPC teams, how to structure PRC activities, and criteria to consider when recruiting PRCs.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec8\" class=\"Section2\"\u003e \u003ch2\u003eStep 3: Ideation workshops with stakeholders\u003c/h2\u003e \u003cp\u003eBetween April and June 2022, we conducted six ideation workshops with \u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12 patients (across three workshops) and \u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12 HCWs (across three workshops); see Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e for demographics. Recruitment and eligibility procedures followed those of \u003cem\u003eStep 1\u003c/em\u003e.\u003c/p\u003e \u003cp\u003eSA-based RAs obtained informed consent and collected participants\u0026rsquo; demographic information before the workshops. The workshops began with an overview of the PRC role and the PRC video developed in \u003cem\u003eStep 2\u003c/em\u003e.  Next, RAs used a semi-structured workshop guide that included the HCD questions to elicit feedback on the proposed role. Workshops were conducted in community centers or via online platforms in English, Afrikaans, or isiXhosa (the local languages) and lasted up to an hour. All workshops were audio-recorded, with recordings supplemented by RA notes.\u003c/p\u003e \u003cp\u003eWe used a rapid form of qualitative data analysis recommended when engaging in iterative co-design (\u003cspan citationid=\"CR46\" class=\"CitationRef\"\u003e46\u003c/span\u003e). After the workshops, staff reviewed their notes and augmented these with workshop observations. Notes were checked against recordings and supplemented with quotes from participants. The operations team met to rapidly code these augmented notes for key themes and recommendations. To aid interpretation, feedback from all the workshops was distilled into a matrix organized by theme and type of stakeholder.\u003c/p\u003e \u003cp\u003eIn May 2022, the project operations team met with a US-licensed clinical psychologist with experience supervising US-based PRCs. During a whole-day in-person meeting, this team collaborated to use this matrix to adapt the PRC overview and develop a prototype for the PRC role in preparation for \u003cem\u003eStep 4\u003c/em\u003e.\u003c/p\u003e \u003cdiv id=\"Sec9\" class=\"Section3\"\u003e \u003ch2\u003eStep 4: Prototype co-design workshops\u003c/h2\u003e \u003cp\u003eIn June 2022, we invited participants from Step 3 to participate in prototype co-design workshops (\u003cem\u003eStep 4\u003c/em\u003e). We conducted two workshops with HCWs (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;7) and a further two workshops with patients (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;9). The workshops followed \u003cem\u003eStep 3\u003c/em\u003e procedures. After presenting the PRC prototype, RAs used a semi-structured guide to elicit general feedback on the prototype, adaptations required to enhance acceptability and feasibility, and strategies for addressing contextual barriers. Workshops were conducted in community centers or via online platforms in English, Afrikaans, or isiXhosa, lasting between 45\u0026ndash;60 minutes. All workshops were audio-recorded, with recordings supplemented by RA notes. The operations team met to review this feedback, using the approach outlined in \u003cem\u003eStep 3\u003c/em\u003e to rapidly adapt the PRC prototype (producing version 2) in preparation for \u003cem\u003eStep 5\u003c/em\u003e.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec10\" class=\"Section3\"\u003e \u003ch2\u003eStep 5: Stakeholder consultation to test the prototype\u003c/h2\u003e \u003cp\u003eNext, the operations team met with stakeholders responsible for commissioning and implementing COPC teams and clinic-based HIV and SU services. In these consultation meetings, we presented prototype version 2 and requested these leaders to provide feedback on the prototype including suggestions for strategies to support embedding the role within COPC teams. RAs took notes to summarize feedback. The team met to review these notes, using the approach outlined in \u003cem\u003eStep 3\u003c/em\u003e to further adapt the PRC prototype, producing version 3.\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e"},{"header":"Results","content":"\u003cdiv id=\"Sec12\" class=\"Section2\"\u003e \u003ch2\u003eAcceptability of PRC and potential roles for the PRC within COPCs (Step 1)\u003c/h2\u003e \u003cp\u003eFindings have been published (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e) and are only summarized here.  Stakeholders described high levels of SU stigma among HCWs, and stigma\u0026rsquo;s impact on HIV care engagement for people with SU. All stakeholders thought PRCs could offer a unique contribution to COPC by supporting patients with SU recovery and health care navigation. HCWs commented that PRCs could be \u0026ldquo;\u003cem\u003erole models\u003c/em\u003e\u0026rdquo; for patients, showing them that \u0026ldquo;\u003cem\u003eSU recovery is possible\u003c/em\u003e.\u0026rdquo; Patients said they would be more comfortable talking to PRCs about SU compared to HCWs from whom they anticipated stigma. As one patient commented:\u003cdiv class=\"BlockQuote\"\u003e\u003cp\u003eI prefer someone who has had the same, has gone through what I\u0026rsquo;ve also gone through\u0026hellip;someone that I can talk to about anything and everything.\u003c/p\u003e\u003c/div\u003e\u003c/p\u003e \u003cp\u003eStakeholders also thought that PRCs could help overcome stigma and other HIV care engagement barriers for patients with SU. They reflected that through social contact with HCWs and sharing their lived experience, PRCs could shift HCWs\u0026rsquo; attitudes toward patients with SU while demonstrating effective ways of engaging with them. Further, they suggested that having PRCs on the COPC team may make HIV services more \u0026ldquo;\u003cem\u003ewelcoming\u003c/em\u003e\u0026rdquo; for people with SU.\u003c/p\u003e \u003cp\u003ePatients and HCWs had different priorities for the role. Patients wanted the defining feature of the role to be the sharing of lived experiences of and support for SU recovery. They also prioritized tailoring the format and content of PRC services to meet individual needs, prioritizing confidentiality of PRC-patient interactions. HCW priorities focused on PRC role clarification to avoid potential role overlap with the CHW role. They also prioritized streamlining PRC activities to fit the current workflow of the COPC team. PRC wellness was an additional consideration for PRC role design, with HCWs raising the importance of PRC training and supervision including strategies to manage contextual and work-related risks to their recovery. This feedback informed planning for the PRC role in \u003cem\u003eStep 2\u003c/em\u003e.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec13\" class=\"Section2\"\u003e \u003ch2\u003eInsights from Ideation workshops (Step 3)\u003c/h2\u003e \u003cp\u003eFive themes were generated from the Ideation workshops: (i) PRC role expectations and functions; (ii) experience and knowledge prerequisites for PRC role acceptance; (iii) structure and content, (iv) location and implementation of PRC sessions; and (v) essential PRC training components.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec14\" class=\"Section2\"\u003e \u003ch2\u003ePRC role expectations\u003c/h2\u003e \u003cp\u003eAll stakeholders were supportive of integrating PRCs into COPCs. They thought PRCs would ease the workload of CHWs who were \u0026ldquo;\u003cem\u003ealready doing too much\u003c/em\u003e\u0026rdquo; and address an important SU service gap. These stakeholders recommended that the PRC role involve patient education about SU, its effects on HIV, and SU service options; equipping patients with SU behavior change skills, and supporting PWH to navigate barriers to SU and HIV services.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec15\" class=\"Section2\"\u003e \u003ch2\u003ePrerequisites for the PRC role\u003c/h2\u003e \u003cp\u003eStakeholders described relevant lived experience, personal recovery, and community knowledge as prerequisites for any PRC. There was broad consensus that lived experience of SU and SU recovery was a role prerequisite. While lived experience of HIV was less salient, stakeholders emphasized the importance of ensuring that PRC training included components focused on HIV. One HCW shared:\u003cdiv class=\"BlockQuote\"\u003e\u003cp\u003eI don't think you only need to focus on a person that is HIV positive\u0026hellip; I think it is a person who experienced or dealt with substance use, that is a good person to be part of the team. Because then you can speak from your own experience\u0026hellip; that person [the peer] who dealt with it, who has the experience, can be taught [about HIV].\u003c/p\u003e\u003c/div\u003e\u003c/p\u003e \u003cp\u003e While stakeholders agreed that PRCs did not need to have experience with a particular type of substance, they commented on the importance of PRCs being trained to understand the effects of the different substances being used in their communities. As one patient noted \u0026ldquo;\u003cem\u003eAlcohol or drugs [is fine]. They must at least have training [on both]\u003c/em\u003e.\u0026rdquo; HCWs and patients recommended that the PRC have a minimum of one year in SU recovery.  They thought this general guideline would ensure that PRCs had sufficient personal experience of recovery to support others. Several HCWs thought PRCs earlier in their recovery journey would be more vulnerable for relapse when encountering open substance use scenes as they would have less established strategies for managing these environmental risks. As one HCW commented,\u003cdiv class=\"BlockQuote\"\u003e\u003cp\u003eI think for a year\u0026hellip; there\u0026rsquo;s no timeline that keeps you safe\u0026hellip; So you could be in recovery for ten years, then something, and then you\u0026rsquo;re back. I just wanted to say a year to give them some time to work on themselves.\u003c/p\u003e\u003c/div\u003e\u003c/p\u003e \u003cp\u003eWhile there were some dissenting voices, most stakeholders believed that PRCs should not work in their own neighborhood. HCWs were concerned about the welfare of the PRC, describing the potential for the PRC to be stigmatized by their own community if their SU history became known, and for patients to visit their homes for after-hours assistance. Patients\u0026rsquo; concerns focused around confidentiality and dual relationships, with many being more comfortable working with a PRC outside of their community. However, all stakeholders agreed that the PRC would need to be very familiar with the community and share its culture. They described this as a prerequisite for PRC safety (and therefore role feasibility) and for acceptance by the community.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec16\" class=\"Section2\"\u003e \u003ch2\u003ePRC session structure\u003c/h2\u003e \u003cp\u003eHCWs and patients recommended structuring the PRC sessions to include an initial \u0026ldquo;\u003cem\u003eintensive support\u003c/em\u003e\u0026rdquo; phase, characterized by weekly contact sessions lasting up to 30 minutes followed by a less intensive \u0026ldquo;\u003cem\u003estep-down\u003c/em\u003e\u0026rdquo; phase with tapering to bimonthly and then monthly sessions. As a HCW commented:\u003cdiv class=\"BlockQuote\"\u003e\u003cp\u003eI would say, in the acute phase, you should obviously have more frequent visits, until you see [the patient] is working with you, cooperating, then you will have less visits\u0026hellip;stagger it, so that at least you have a system of, \u0026ldquo;now you\u0026rsquo;re in the acute phase, but now you\u0026rsquo;re going to a less acute phase where you now see less of me and can perform and function on your own.\u003c/p\u003e\u003c/div\u003e\u003c/p\u003e \u003cp\u003eStakeholders\u0026rsquo; recommendations for the duration of PRC contact ranged from one to six months, recommending that \u0026ldquo;\u003cem\u003ethe timeframe should be tailored [to the person]\u003c/em\u003e.\u0026rdquo; After discussion, they agreed it would be feasible to provide PRC sessions tapering in frequency for up to three months.\u003c/p\u003e \u003cp\u003eStakeholders also discussed session delivery, prioritizing face-to-face contact. While some patients recommended supplementing this with digital or telehealth contact, HCWs were concerned that this would over-burden the PRC as they would be \u003cem\u003e\u0026ldquo;on call like 24/7.\u0026rdquo;\u003c/em\u003e Stakeholders also raised concerns about confidentiality when using digital messaging services, commenting that others might view these messages as mobile phones were often shared within households.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec17\" class=\"Section2\"\u003e \u003ch2\u003eSession location\u003c/h2\u003e \u003cp\u003eStakeholders provided suggestions for the location of PRC sessions including patients\u0026rsquo; homes, community spaces such as libraries, and clinics. Some patients worried that the PRC may be uncomfortable conducting sessions in their homes, suggesting that \u0026ldquo;\u003cem\u003ethe first few sessions should be at the clinic so that I can tell them about my home situation and they can decide if they want to still come to my house\u003c/em\u003e.\u0026rdquo; Others raised stigma concerns, stating that PRC home visits (when separate from routine CHW visits), would inform neighbors about their SU. As a result, stakeholders agreed that the PRC should offer patients a choice of session location and that the physical and psychological safety of both the PRC and patient should be considered when selecting the session location.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec18\" class=\"Section2\"\u003e \u003ch2\u003ePRC training\u003c/h2\u003e \u003cp\u003eStakeholders highlighted knowledge and skills-based competencies to target in PRC training. Stakeholders agreed that training should include topics on HIV and SU, including the effects of various substances, the impact of SU on HIV, SU treatment options and how to support patients to navigate barriers to SU behavior change and services. In addition, stakeholders training on therapeutic competencies related to confidentiality and professional ethics, non-judgmental communication, and therapeutic relationships. Patients emphasized the therapeutic relationship, saying that PRCs \u0026ldquo;\u003cem\u003emust bring you on a level that you feel comfortable\u003c/em\u003e\u0026rdquo; and \u0026ldquo;\u003cem\u003emust be trained to build relations\u003c/em\u003e.\u0026rdquo; HCWs emphasized training on professional work practice, especially for peers new to the healthcare workforce. As one HCW commented:\u003cdiv class=\"BlockQuote\"\u003e\u003cp\u003e \u003cem\u003e\u0026hellip;the ethics and the professionalism that needs to be brought into training so that people know yes, you\u0026rsquo;re using substances, but it is not for me to go and tell the whole world that you are in the program\u003c/em\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/p\u003e \u003cp\u003eThis feedback shaped the initial PRC role prototype, described in Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab2\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 2\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eA description of the changes made to the PRC prototype at each stage of the co-design process.\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"4\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eRole Description\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePRC prototype (Version 1); produced after ideation workshops\u003c/p\u003e \u003cp\u003e\u003cem\u003e(Step 3)\u003c/em\u003e\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eRevised prototype (Version 2); produced after co-design workshops\u003c/p\u003e \u003cp\u003e\u003cem\u003e(Step 4)\u003c/em\u003e\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eRevised prototype (Version 3); produced after consultation with health leaders\u003c/p\u003e \u003cp\u003e\u003cem\u003e(Step 5)\u003c/em\u003e\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eRole Prerequisites\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u0026bull; Lived experience of SU\u003c/p\u003e \u003cp\u003e\u0026bull; At least one year of SU recovery.\u003c/p\u003e \u003cp\u003e\u0026bull; Lived experience of HIV is not essential\u003c/p\u003e \u003cp\u003e\u0026bull; Understanding of community dynamics\u003c/p\u003e \u003cp\u003e\u0026bull; Share language and culture of community\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eNo changes\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eNo changes\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eRole expectations and core activities\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u0026bull; Provide education on HIV and SU\u003c/p\u003e \u003cp\u003e\u0026bull; Support patients to connect to and navigate SU and health services\u003c/p\u003e \u003cp\u003e\u0026bull; Support to enhance motivation and overcome barriers to SU and health service use\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; Sharing of personal experience to reduce stigma and instill hope for recovery\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; Participation in supervision and peer mentorship\u003c/p\u003e \u003cp\u003e\u0026bull; Participation in self-care activities\u003c/p\u003e \u003cp\u003e\u0026bull; Participation in COPC team activities and meetings\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eWorking conditions\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u003cem\u003eNot addressed\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; Safety: PRC to work in pairs or be accompanied by a CHW\u003c/p\u003e \u003cp\u003e\u0026bull; Working hours and conditions identical to those of COPC members.\u003c/p\u003e \u003cp\u003e\u0026bull; No after-hours contact; respond to messages on next working day.\u003c/p\u003e \u003cp\u003e\u0026bull; No uniform due to stigma concerns.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eNo changes\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eCore elements of PRC training\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u0026bull; Confidentiality and professional ethics\u003c/p\u003e \u003cp\u003e\u0026bull; Content knowledge:\u003c/p\u003e \u003cp\u003e- SU, HIV, and how they relate\u003c/p\u003e \u003cp\u003e- Local SU services and how these can be accessed.\u003c/p\u003e \u003cp\u003e\u0026bull; Basic counselling skills to support behavior change:\u003c/p\u003e \u003cp\u003e- Motivational Interviewing\u003c/p\u003e \u003cp\u003e- Nonjudgmental communication\u003c/p\u003e \u003cp\u003e- Problem Solving\u003c/p\u003e \u003cp\u003e- Behavioral Activation\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; Training on safe sharing of personal experiences of SU and SU recovery\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; Information and training on COPCs\u003c/p\u003e \u003cp\u003e\u0026bull; Self-care skills to support PRC well-being and recovery\u003c/p\u003e \u003cp\u003e\u0026bull; Benefits of supervision and peer mentorship/debriefing\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eStructure and content of PRC sessions\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u0026bull; \u003cem\u003eStructure\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e- One-on-one sessions for 12 weeks\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eSession 1\u003c/span\u003e: Describe PRC role, establish confidentiality and preferences for session format and location.\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 1\u0026ndash;4\u003c/span\u003e: 1 session per week\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 5\u0026ndash;8\u003c/span\u003e: 1 session every 2 weeks\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 9\u0026ndash;12\u003c/span\u003e: Patient and PRC to decide on frequency\u003c/p\u003e \u003cp\u003e\u0026bull; \u003cem\u003eDuration\u003c/em\u003e: ~30 minutes, with up to an hour scheduled\u003c/p\u003e \u003cp\u003e\u0026bull; \u003cem\u003eLocation\u003c/em\u003e: Initial contact (session one) at patient\u0026rsquo;s home, COPC will introduce PRC, location of other visits to be decided.\u003c/p\u003e \u003cp\u003e\u0026bull; \u003cem\u003eMode\u003c/em\u003e: Face-to-face delivery with telephonic delivery if required.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; \u003cem\u003eStructure\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eSession 1\u003c/span\u003e: Establish preferences for session times. Clarify boundaries of PRC role and after-hours availability. Share personal experience to engage patient.\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 1\u0026ndash;4\u003c/span\u003e: Help identify and navigate challenges to engaging in SU/HIV care via education, sharing lived experience and teaching skills for behavior change.\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 5\u0026ndash;8\u003c/span\u003e: Provide support for recovery and enhance motivation for care engagement, using skills described above.\u003c/p\u003e \u003cp\u003e- \u003cspan type=\"Underline\" class=\"Underline\" name=\"Emphasis\"\u003eWeeks 9\u0026ndash;12\u003c/span\u003e: Provide support for care engagement (if required). Help patient transition from the PRC to other recovery supports in the community (e.g. support groups).\u003c/p\u003e \u003cp\u003e\u0026bull; \u003cem\u003eLocation\u003c/em\u003e: Not all patients endorsed an initial home visit due to stigma and safety concerns. To enhance acceptability, the initial PRC session will not occur in a separate home visit. It will be delivered during CHWs\u0026rsquo; routine visits to the patient\u0026rsquo;s household.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eNo changes\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eStrategies to facilitate PRC integration into COPC teams\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e\u003cem\u003eNot addressed\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u003cem\u003eNot addressed\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003e\u003cem\u003eAdded\u003c/em\u003e:\u003c/p\u003e \u003cp\u003e\u0026bull; COPC training prior to integration:\u003c/p\u003e \u003cp\u003e- Information on SU, HIV and stigma\u003c/p\u003e \u003cp\u003e- Information on PRC role and how it can support the COPC\u003c/p\u003e \u003cp\u003e- PRC video\u003c/p\u003e \u003cp\u003e- Strategies for supporting COPC wellness\u003c/p\u003e \u003cp\u003e- Opportunities to discuss and resolve any concerns\u003c/p\u003e \u003cp\u003e\u0026bull; Formal introduction of PRC to COPC at a team meeting\u003c/p\u003e \u003cp\u003e\u0026bull; PRC to accompany CHWs on home visits for 8\u0026ndash;10 weeks to ensure familiarity with COPC activities and processes, patients, and the community and to build team relationships.\u003c/p\u003e \u003cp\u003e\u0026bull; PRC supervision and mentoring\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec19\" class=\"Section2\"\u003e \u003ch2\u003eFeedback from prototype co-design workshops (Step 4)\u003c/h2\u003e \u003cp\u003eStakeholders largely endorsed the proposed prerequisites for the PRC role, role expectations, training components, and session structure. Stakeholders recommended augmenting this prototype to include strategies for managing contextual challenges like safety, a description of the PRC\u0026rsquo;s working conditions, and more detail about PRC session content. Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e presents changes to the prototype based on this feedback.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec20\" class=\"Section2\"\u003e \u003ch2\u003eFeedback from consultation meetings (Step 5)\u003c/h2\u003e \u003cp\u003eStakeholders responsible for commissioning and implementing HIV and SU services endorsed the revised prototype but noted that it did not address the context of the COPC team. HIV experts recommended expanding PRC role expectations to include participation in the broader COPC team and augmenting the proposed training components to include information on COPCs. They also recommended developing PRC integration training for the COPC team to orient them to the PRC role. Further, SU experts recommended augmenting both the PRC role expectations and training schedule to include supervision, peer mentoring and self-care components. They described these components as necessary for helping PRCs navigate potential barriers to their integration within COPC teams, complex community dynamics, and role boundaries while supporting their professional development and safety. Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e outlines modifications based on this feedback.\u003c/p\u003e \u003c/div\u003e"},{"header":"Discussion","content":"\u003cp\u003eThis paper contributes to a small but expanding literature on the value of HCD approaches when designing interventions for dissemination and sustainment (\u003cspan citationid=\"CR36\" class=\"CitationRef\"\u003e36\u003c/span\u003e, \u003cspan citationid=\"CR40\" class=\"CitationRef\"\u003e40\u003c/span\u003e, \u003cspan citationid=\"CR47\" class=\"CitationRef\"\u003e47\u003c/span\u003e) by demonstrating the benefits of a stakeholder-engaged, HCD approach to the design of workforce innovations that address the SU service gap in resource-constrained settings. Overall, the multiple stakeholder groups we engaged in the design process thought it was acceptable and feasible to embed PRCs into COPC teams, with the caveat that the PRC role should remain distinct from existing roles within the COPC team. These stakeholders thought the PRC should focus on providing SU recovery and care navigation supports for PWH⸺ services that CHWs do not have the time, training, or capabilities to provide as reported by previous studies (\u003cspan citationid=\"CR14\" class=\"CitationRef\"\u003e14\u003c/span\u003e). Despite this consensus, patients and HCW stakeholders differed in their reasons for wanting the PRC role to remain distinct from that of CHWs within COPC teams.\u003c/p\u003e \u003cp\u003eMore specifically, patient stakeholders prioritized the relational components of the PRC role, desiring a better care experience than the one they currently received from CHWs. Like earlier studies (\u003cspan citationid=\"CR25\" class=\"CitationRef\"\u003e25\u003c/span\u003e, \u003cspan citationid=\"CR27\" class=\"CitationRef\"\u003e27\u003c/span\u003e), patients described their HIV care experience as characterized by SU stigma, poor care quality, and unsupportive provider relationships. These stakeholders hoped that PRCs could offer an alternative care experience by sharing their lived experience of SU recovery to build a strong patient-PRC relationship, and by providing person-centered and confidential support for SU recovery and health care navigation tailored to their personal treatment goals. They also wanted flexibility and choice in how sessions were structured and delivered, similar to patient and peer feedback on the essential elements of PRC services from US-based research (\u003cspan citationid=\"CR34\" class=\"CitationRef\"\u003e34\u003c/span\u003e, \u003cspan citationid=\"CR48\" class=\"CitationRef\"\u003e48\u003c/span\u003e). During the iterative design process, we used this feedback to modify the PRC prototype to better align with patients\u0026rsquo; priorities and preferences. Modifications included (i) expanding PRC role expectations and session content to foreground the sharing of lived SU experiences; (ii) integrating the initial PRC visit with routine CHW visits to the patient\u0026rsquo;s home to help with initial relationship building and to address SU stigma concerns; and (iii) introducing opportunities for shared decision making about the structure and delivery of PRC sessions.\u003c/p\u003e \u003cp\u003eIn contrast, HCW stakeholders prioritized greater definition and clarification of the PRC role, including role boundaries, and suggested modifications to better align the PRC\u0026rsquo;s work practice with that of the COPC team. They were concerned about potential role duplication and that differences in working conditions, expectations, and practice may increase the amount and complexity of their work. These concerns are not surprising given the unpredictability and insecurity of CHW employment contracts (\u003cspan citationid=\"CR49\" class=\"CitationRef\"\u003e49\u003c/span\u003e) and the well-documented high workload of COPC teams (\u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e). CHWs are unlikely to welcome a PRC into their teams if they think this will make their role redundant or increase the complexity of their work. Role ambiguity has been identified as a barrier to embedding PRCs within US-based primary care (\u003cspan citationid=\"CR50\" class=\"CitationRef\"\u003e50\u003c/span\u003e) and non-specialist providers within primary healthcare more generally (\u003cspan citationid=\"CR51\" class=\"CitationRef\"\u003e51\u003c/span\u003e, \u003cspan citationid=\"CR52\" class=\"CitationRef\"\u003e52\u003c/span\u003e). In response to these concerns, we modified the PRC prototype to minimize any role duplication by clarifying that CHWs would be responsible for HIV treatment support and PRCs would be responsible for SU-related support, currently not provided by CHWs. Further modifications were made to align the PRC\u0026rsquo;s proposed working conditions and expectations for professional work practice with those of the COPC team, with PRC training and supervision augmented to address these components.\u003c/p\u003e \u003cp\u003eRole clarification was not a salient concern for HIV and SU service leaders, possibly because they were consulted later in the design process. These stakeholders offered unique insights, based on their health systems experience, into the readiness of COPC teams for PRC integration. They emphasized the need for COPC team members to be educated about the potential contributions of the PRC role and the need to invest in preparing COPC teams for PRC integration. These stakeholders raised concerns about the potential impact on PRC wellness if the COPC team climate was not welcoming, suggesting that the PRC may require additional mentoring and support to navigate these implementation barriers and ensure their psychological safety within the COPC team. These recommendations are aligned with the experiences of introducing peer services for SU and mental health in other contexts (\u003cspan citationid=\"CR53\" class=\"CitationRef\"\u003e53\u003c/span\u003e, \u003cspan citationid=\"CR54\" class=\"CitationRef\"\u003e54\u003c/span\u003e). Based on this feedback, we added the following components to the PRC prototype: (i) COPC team integration training focused on raising awareness of and fostering openness to the PRC role, (ii) COPC preparation activities to create opportunities for the PRC to build relationships with team members through meetings and work shadowing, (iii) additional training components to orient the PRC to the COPC environment and how to work effectively with the COPC team, (iv) clinical supervision and peer mentoring to support PRCs to deliver high-quality support, navigate dynamics within the COPC team and community, and their psychological safety and wellbeing in complex environments. Earlier studies also identified training and relational work with existing staff as key strategies for supporting the implementation of primary healthcare workforce innovations for mental health (\u003cspan citationid=\"CR55\" class=\"CitationRef\"\u003e55\u003c/span\u003e) and supervision and peer mentoring as important strategies for preventing burnout and protecting the wellbeing of non-specialist health providers in SA(\u003cspan citationid=\"CR23\" class=\"CitationRef\"\u003e23\u003c/span\u003e, \u003cspan citationid=\"CR56\" class=\"CitationRef\"\u003e56\u003c/span\u003e).\u003c/p\u003e \u003cp\u003eWhile findings highlight the value of including patient, provider, and systems perspectives, engaging multiple stakeholder groups in co-design is complex and fraught with power imbalances. This study included patients who were marginalised by their socio-economic status, HIV and SU, and CHWs with little power or agency in the healthcare system (\u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e). Further, there were power imbalances within our study team, inherent when adapting an intervention from the global North for application in the global South, and where teams include people with lived experience of SU and other stigmatized identities. To limit the impact of these imbalances on stakeholder inputs, we intentionally used mutual capacity-building (which promotes equitable bidirectional learning) as a guiding framework for stakeholder engagement (\u003cspan citationid=\"CR57\" class=\"CitationRef\"\u003e57\u003c/span\u003e, \u003cspan citationid=\"CR58\" class=\"CitationRef\"\u003e58\u003c/span\u003e). In all team and stakeholder activities, we worked to ensure that all contributions were equally valued, a diversity of perspectives was encouraged, and everyone felt respected.  We distributed leadership and decision-making power across teams and groups, encouraging open discussion, and preferencing stakeholder contributions and the local voice, rather than those of the study team, in design decisions. With an iterative design process, we were able to demonstrate how stakeholder feedback led to prototype modifications, building trust in the design process and enhancing the quality of their contributions. As this approach enriched our design process, we recommend mutual capacity building as a framework for supporting stakeholder engagement in the co-design of SU interventions.\u003c/p\u003e \u003cp\u003eDespite this strength, there are limitations to consider. A relatively small number of patients and HCWs participated in the workshops. Additional engagement with a wider range of patients and HCWs may identify further modifications to the PRC role that could broaden its appeal and utility. Second, the PRC role was designed to be embedded in COPC teams working within disadvantaged communities in the Cape Town metropole where there are high levels of unmet SU-related needs and structural barriers to accessing SU treatment (\u003cspan citationid=\"CR59\" class=\"CitationRef\"\u003e59\u003c/span\u003e). Inter-provincial differences in the organization, function, and funding of COPC teams and unmet need for SU treatment (\u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e, \u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e) may affect the relevance and utility of the PRC role beyond the current context. Third, we did not quantitatively assess acceptability, feasibility, or appropriateness at each step of the co-design process. Future studies should consider embedding quantitative implementation outcome measures into the co-design process so that the potential utility of the HCD process for enhancing acceptability, feasibility, and appropriateness can be systematically evaluated.\u003c/p\u003e"},{"header":"Conclusion","content":"\u003cp\u003eThis paper describes a methodological process that may be useful to other teams developing PRC roles for primary healthcare teams. Through engaging stakeholders with diverse perspectives in the design process, we were better able to understand and respond to their priorities and preferences for the PRC role, enhancing role acceptability and contextual fit. Stakeholder engagement helped identify patient-, provider-, and systems-level barriers to role implementation; the iterative design process allowed us to modify the PRC prototype to enhance role feasibility and contextual fit. Stakeholder engagement also served as an implementation strategy, building collective ownership in the role and helping us identify champions to support the pilot implementation of this workforce innovation.  A pilot study (NCT05907174) is underway to evaluate the acceptability and feasibility of embedding the PRC role within COPC teams and preliminary effects on HIV care engagement. While findings from this pilot are likely to inform further modifications to the PRC role prototype, we believe investment in this stakeholder-driven approach to PRC role design will enhance the likelihood of future scaling and sustainment of this role.\u003c/p\u003e"},{"header":"Declarations","content":"\u003cp\u003e\u003cstrong\u003eAcknowledgments\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe thank our NGO and health service partners, particularly Masincedane Community Services our COPC implementation partner and the Western Cape Department of Health, for their support for the project and facilitating the engagement of HCWs and patient stakeholders.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFunding\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis research was funded by the \u003cstrong\u003eNational Institute on Drug Abuse (NIDA) grant R21DA053212\u0026nbsp;\u003c/strong\u003eawarded to Drs. Magidson and Myers. KSR\u0026rsquo;s time was supported by the National Institute on Drug Abuse (NIDA) grant R36DA057167, and ALR\u0026rsquo;s time was supported by NIMH grant F31MH123020. Funders had no role in the study design; in the collection, analysis, and interpretation of data; in the writing of the report; or in the decision to submit the article for publication. \u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContributions\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBronwyn Myers: Methodology, Conceptualization, Formal analysis, Funding acquisition, Writing \u0026ndash; original draft, Writing \u0026ndash; review \u0026amp; editing. \u0026nbsp;Kristen S. Regenauer: Data Curation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Kim Johnson: Investigation, Data Curation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Imani Brown: Data Curation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Alexandra L. Rose: Data Curation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Nonceba Ciya: Investigation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing.\u003csup\u003e\u0026nbsp;\u003c/sup\u003eSibabalwe Ndamase: Investigation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Yuche Jacobs: Investigation, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Morgan Anvari: Resources, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Abigail Hines: Resources, Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Dwayne Dean: Resources, Writing \u0026ndash; review \u0026amp; editing, Rithika Baskar: Formal analysis, Writing \u0026ndash; review \u0026amp; editing. Jessica F. Magidson: Methodology, Conceptualization, Formal analysis; Funding acquisition, Writing \u0026ndash; review \u0026amp; editing. \u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEthics declarations\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe SA Medical Research Council approved this study (EC046-10/2020, EC049-11/2021) under an IRB Authorization Agreement with the University of Maryland College Park. All participants provided written informed consent for study participation, this included consent for their de-identified, aggregated data to be used in publications. \u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConflict of Interest\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe authors have no conflicts of interest to declare. \u0026nbsp;\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\n\u003cli\u003eZuma K, Simbayi L, Zungu N, Moyo S, Marinda E, Jooste S, et al. The HIV Epidemic in South Africa: Key Findings from 2017 National Population-Based Survey. Int J Environ Res Public Health. 2022;19(13).\u003c/li\u003e\n\u003cli\u003eLilian RR, Rees K, McIntyre JA, Struthers HE, Peters RPH. Same-day antiretroviral therapy initiation for HIV-infected adults in South Africa: Analysis of routine data. PLoS ONE. 2020;15(1):e0227572.\u003c/li\u003e\n\u003cli\u003eMaskew M, Benade M, Huber A, Pascoe S, Sande L, Malala L, et al. Patterns of engagement in care during clients\u0026apos; first 12 months after HIV treatment initiation in South Africa: A retrospective cohort analysis using routinely collected data. PLOS Glob Public Health. 2024;4(2):e0002956.\u003c/li\u003e\n\u003cli\u003eOnoya D, Hendrickson C, Sineke T, Maskew M, Long L, Bor J, et al. Attrition in HIV care following HIV diagnosis: a comparison of the pre-UTT and UTT eras in South Africa. J Int AIDS Soc. 2021;24(2):e25652.\u003c/li\u003e\n\u003cli\u003eSchneider H, Besada D, Sanders D, Daviaud E, Rohde SS, editors. Ward-based primary health care outreach teams in South Africa: developments, challenges and future directions2018.\u003c/li\u003e\n\u003cli\u003eMantell JE, Masvawure TB, Zech JM, Reidy W, Msukwa M, Glenshaw M, et al. \u0026quot;They are our eyes outside there in the community\u0026quot;: Implementing enhanced training, management and monitoring of South Africa\u0026apos;s ward-based primary healthcare outreach teams. PLoS ONE. 2022;17(8):e0266445.\u003c/li\u003e\n\u003cli\u003eMhlongo EM, Lutge E, Adepeju L. The roles, responsibilities and perceptions of community health workers and ward-based primary health care outreach teams: a scoping review. Glob Health Action. 2020;13(1):180652 ot;: Exploring the role of peer workers in alcohol and other drug rehabilitation services. J Subst Use Addict Treat. 2024;163:209408.\u003c/li\u003e\n\u003cli\u003eEhrlich C, Slattery M, Vilic G, Chester P, Crompton D. What happens when peer support workers are introduced as members of community-based clinical mental health service delivery teams: a qualitative study. J Interprof Care. 2020;34(1):107-15.\u003c/li\u003e\n\u003cli\u003eBrooke-Sumner C, Petersen-Williams P, Sorsdahl K, Kruger J, Mahomed H, Myers B. Strategies for supporting the implementation of a task-shared psychological intervention in South Africa\u0026rsquo;s chronic disease services: qualitative insights from health managers\u0026rsquo; experiences of project MIND. Global Health Action. 2022;15(1):2123005.\u003c/li\u003e\n\u003cli\u003eBrooke-Sumner C, Petersen-Williams P, Kruger J, Mahomed H, Myers B. \u0026apos;Doing more with less\u0026apos;: a qualitative investigation of perceptions of South African health service managers on implementation of health innovations. Health Policy Plan. 2019;34(2):132-40.\u003c/li\u003e\n\u003cli\u003eJack HE, Anvari MS, Abidogun TM, Ochieng YA, Ciya N, Ndamase S, et al. Applying a mutual capacity building model to inform peer provider programs in South Africa and the United States: A combined qualitative analysis. Int J Drug Policy. 2023;120:104144.\u003c/li\u003e\n\u003cli\u003eJack HE, Myers B, Regenauer KS, Magidson JF. Mutual Capacity Building to Reduce the Behavioral Health Treatment Gap Globally. Adm Policy Ment Health. 2020;47(4):497-500.\u003c/li\u003e\n\u003cli\u003eMyers BJ, Louw J, Pasche SC. Inequitable access to substance abuse treatment services in Cape Town, South Africa. Subst Abuse Treat Prev Policy. 2010;5:28.\u003c/li\u003e\n\u003c/ol\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":false,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"journal":{"display":true,"email":"info@researchsquare.com","identity":"addiction-science-and-clinical-practice","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"ascp","sideBox":"Learn more about [Addiction Science \u0026 Clinical Practice](https://ascpjournal.biomedcentral.com/)","snPcode":"13722","submissionUrl":"https://submission.nature.com/new-submission/13722/3","title":"Addiction Science \u0026 Clinical Practice","twitterHandle":"","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"stoa","reportingPortfolio":"BMC/SO AJ","inReviewEnabled":true,"inReviewRevisionsEnabled":true},"keywords":"stigma, substance use, implementation science, task-sharing, low-and-middle income country, global mental health","lastPublishedDoi":"10.21203/rs.3.rs-4566640/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-4566640/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003ch2\u003eIntroduction:\u003c/h2\u003e \u003cp\u003eIn South Africa (SA), community-oriented primary care (COPC) teams work to re-engage out-of-care people with HIV (PWH) in treatment, many of whom have substance use (SU) concerns. SU stigma is high among these teams, limiting care engagement efforts. Integrating peer recovery coaches (PRCs) into COPC teams could shift SU stigma and improve patients\u0026rsquo; engagement in care. The PRC role does not exist in SA and represents a workforce innovation. To enhance acceptability, feasibility, and appropriateness for the local context, we engaged multiple stakeholder groups to co-design a PRC role for COPC team integration.\u003c/p\u003e\u003ch2\u003eMethods\u003c/h2\u003e \u003cp\u003eWe used a five-step human-centered design process: (i) semi-structured interviews with healthcare worker (HCW, \u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;25) and patient (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;15) stakeholders to identify priorities for the role; (ii) development of an initial role overview; (iii) six ideation workshops with HCW (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12) and patient (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;12) stakeholders to adapt this overview; (iv) refinement of the role prototype via four co-design workshops with HCW (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;7) and patient (\u003cem\u003en\u003c/em\u003e\u0026thinsp;=\u0026thinsp;9) stakeholders; and (v) consultation with HIV and SU service leaders to assess the acceptability and feasibility of integrating this prototype into COPC teams.\u003c/p\u003e\u003ch2\u003eResults\u003c/h2\u003e \u003cp\u003eAlthough all stakeholders viewed the PRC role as acceptable, patients and HCWs identified different priorities. Patients prioritized the care experience through sharing of lived experience and confidential SU support. HCWs prioritized clarification of the PRC role, working conditions, and processes to limit any impact on the COPC team. A personal history of SU, minimum 1 year in SU recovery, and strong community knowledge were considered role prerequisites by all stakeholders. Through the iterative process, stakeholders clarified their preferences for PRC session structure, location, and content and expanded proposed components of PRC training to include therapeutic and professional work practice competencies. Service leaders endorsed the prototype after the addition of PRC integration training for COPCs and PRC mentoring to address community and COPC dynamics.\u003c/p\u003e\u003ch2\u003eConclusion\u003c/h2\u003e \u003cp\u003eStakeholder engagement in an iterative HCD process has been integral to co-designing a PRC role that multiple stakeholder groups consider acceptable and that COPC teams are willing to implement. This offers a methodological framework for other teams designing SU workforce innovations.\u003c/p\u003e","manuscriptTitle":"A stakeholder-driven approach to designing a peer recovery coach role for implementation in community-oriented primary care teams in South Africa","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2024-07-18 22:23:28","doi":"10.21203/rs.3.rs-4566640/v1","editorialEvents":[{"type":"communityComments","content":0},{"type":"decision","content":"Revision requested","date":"2024-11-08T18:27:52+00:00","index":"","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2024-08-30T08:07:50+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"281623508928941854137864352987373843628","date":"2024-08-29T11:25:39+00:00","index":"hide","fulltext":""},{"type":"reviewersInvited","content":"","date":"2024-07-03T14:24:45+00:00","index":"","fulltext":""},{"type":"editorAssigned","content":"","date":"2024-06-24T18:26:01+00:00","index":"","fulltext":""},{"type":"checksComplete","content":"","date":"2024-06-13T10:43:06+00:00","index":"","fulltext":""},{"type":"submitted","content":"Addiction Science \u0026 Clinical Practice","date":"2024-06-12T00:54:20+00:00","index":"","fulltext":""}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"addiction-science-and-clinical-practice","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"ascp","sideBox":"Learn more about [Addiction Science \u0026 Clinical Practice](https://ascpjournal.biomedcentral.com/)","snPcode":"13722","submissionUrl":"https://submission.nature.com/new-submission/13722/3","title":"Addiction Science \u0026 Clinical Practice","twitterHandle":"","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"stoa","reportingPortfolio":"BMC/SO AJ","inReviewEnabled":true,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"e7c080cb-a1c0-425a-8ec7-
