w-border-gray-100"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Journal Publication</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black">published <!-- -->10 Jan, 2025</p></div><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-mt-3 tw-mb-1"><a href="https://doi.org/10.1186/s12911-025-02850-x" target="_blank" rel="noopener noreferrer" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline" data-track="click_reading_the_published_version" data-track-context="BMC Medical Informatics and Decision Making" data-track-category="Published" data-track-link-text="Read the published version in BMC Medical Informatics and Decision Making" data-track-content-type="Research Article" data-track-label="BMC"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition tw-block tw-w-full tw-text-center">Read the published version in<!-- --> <span class="tw-italic">BMC Medical Informatics and Decision Making</span>  →</span></a></p></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex">14</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300 tw-ml-2"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><h2>Background</h2> <p>Rich data on diverse patients and their treatments and outcomes within Electronic Health Record (EHR) systems can be used to generate real world evidence. A health recommender system (HRS) framework can be applied to a decision support system application to generate data summaries for similar patients during the clinical encounter to assist physicians and patients in making evidence-based shared treatment decisions.</p><h2>Objective</h2> <p>A human-centered design (HCD) process was used to develop a HRS for treatment decision support in orthopaedic medicine, the <em>Informatics Consult for Individualized Treatment (I-C-IT)</em>. We also evaluate the usability and utility of the system from the physician’s perspective, focusing on elements of utility and shared decision-making in orthopaedic medicine.</p><h2>Methods</h2> <p>The HCD process for I-C-IT included 6 steps across three phases of analysis, design, and evaluation. A team of informaticians and comparative effectiveness researchers directly engaged with orthopaedic surgeon subject matter experts in a collaborative I-C-IT prototype design process. Ten orthopaedic surgeons participated in a mixed methods evaluation of the I-C-IT prototype that was produced.</p><h2>Results</h2> <p>The HCD process resulted in a prototype system, I-C-IT, with 14 data visualization elements and a set of design principles crucial for HRS for decision support. The overall standard system usability scale (SUS) score for the I-C-IT Webapp prototype was 88.75 indicating high usability. In addition, utility questions addressing shared decision-making found that 90% of orthopaedic surgeon respondents either strongly agreed or agreed that I-C-IT would help them make data informed decisions with their patients.</p><h2>Conclusion</h2> <p>The HCD process produced an HRS prototype that is capable of supporting orthopaedic surgeons and patients in their information needs during clinical encounters. Future research should focus on refining I-C-IT by incorporating patient feedback in future iterative cycles of system design and evaluation.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">human-centered design</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">health recommender system</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">human factors</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">orthopaedic treatment</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">personalized medicine</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">clinical decision support</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">proximal humerus fracture</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Figures</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidde  111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Evidence-based medicine has advanced significantly since its popularization in the 1990s, (<span citationid="CR1" class="CitationRef">1</span>, <span citationid="CR2" class="CitationRef">2</span>) though many practice-specific gaps remain for the care of individual patients. It is well recognized that treatment effect heterogeneity erodes the value of average treatment effect estimates across groups of diverse patients (<span additionalcitationids="CR4 CR5" citationid="CR3" class="CitationRef">3</span>–<span citationid="CR6" class="CitationRef">6</span>), and a gap remains to generate evidence that applies to individual patients.(<span additionalcitationids="CR8" citationid="CR7" class="CitationRef">7</span>–<span citationid="CR9" class="CitationRef">9</span>) Rich data on diverse patients and their treatments and outcomes stored in Electronic Health Record (EHR) systems can be used to generate real world evidence suited for individual patients(<span additionalcitationids="CR11 CR12 CR13 CR14" citationid="CR10" class="CitationRef">10</span>–<span citationid="CR15" class="CitationRef">15</span>) Using historical patient data stored in EHR systems to assist with clinical decision-making was first conceptualized by researchers at Stanford and was referred to as an informatics consult service (ICS).(<span additionalcitationids="CR15 CR16" citationid="CR14" class="CitationRef">14</span>–<span citationid="CR17" class="CitationRef">17</span>) ICSs are designed to summarize historical data to help physicians make data-informed choices for current patients. However, the initial ICSs were focused on questions of prognosis not treatment choice, (<span citationid="CR17" class="CitationRef">17</span>) and they were not fully automated, requiring a team of researchers and data scientists to field requests and return responses over a period of days. New computing advancements can be applied to fill the analytical gaps of early ICS systems and deliver real-time evidence to guide individual treatment decisions at the point of care.</p> <p>Comparative effectiveness research (CER) has been used to generate evidence about treatment alternatives to inform treatment decision-making. Traditional CER approaches require researchers to generate average treatment effect estimates for a population subgroup or a “reference classes” based on a combination of measured baseline factors specified prior to estimation. (<span additionalcitationids="CR19" citationid="CR18" class="CitationRef">18</span>–<span citationid="CR20" class="CitationRef">20</span>) The need to define reference classes is a significant barrier to finding appropriate treatment effect estimates for individual patients. (<span citationid="CR20" class="CitationRef">20</span>) Even with a small number of measured baseline factors, an individual patient could potentially be placed in an indefinite number of reference classes (<span additionalcitationids="CR20" citationid="CR19" class="CitationRef">19</span>–<span citationid="CR21" class="CitationRef">21</span>), and it is often unclear which reference class is best aligned to each patient. (<span citationid="CR19" class="CitationRef">19</span>, <span additionalcitationids="CR22 CR23 CR24" citationid="CR21" class="CitationRef">21</span>–<span citationid="CR25" class="CitationRef">25</span>) Here we start from the premise that physicians possess greater accumulated clinical wisdom on the patient factors that impact treatment effectiveness than researchers. (<span citationid="CR17" class="CitationRef">17</span>, <span citationid="CR26" class="CitationRef">26</span>, <span citationid="CR27" class="CitationRef">27</span>) As such, physicians may be best positioned to define the appropriate reference class for a given patient in a specific setting and need a tool to generate CER-based evidence to summarize outcomes for similar patients under treatment alternatives.</p> <p>Conceptually, Recommender Systems (RSs) provide an effective system foundation for delivering tailored evidence to guide individual decision making. RS are intelligent applications(<span citationid="CR28" class="CitationRef">28</span>) that provide personalized information fit for the end user (<span citationid="CR29" class="CitationRef">29</span>).A health recommender system (HRS) focuses on health-related information needs. The core HRS functionality of selectively presenting or “recommending” health data can be adapted to the need of presenting clinically appropriate reference class data summaries which closely match each patient being treated (<span citationid="CR30" class="CitationRef">30</span>). Presenting personalized treatment evidence can enable engagement in shared decision-making, a priority goal in orthopaedic medicine.(<span citationid="CR31" class="CitationRef">31</span>) Shared decision-making includes physicians and patients being informed about treatment options, evidence of the treatment effects on outcomes the patient can expect, and patient preferences across outcomes,(<span citationid="CR32" class="CitationRef">32</span>) so that a patient may play an engaged role in their care. HRSs may offer a unique tool to facilitate shared decision-making in orthopaedic encounters, as HRSs can retrieve and present historical reference class patient data summaries that are matched to the individual patient. We use the HRS conceptual foundation to develop a clinical decision support system for orthopaedic medicine, the <em>Informatics Consult for Individualized Treatment</em> (I-C-IT, pronounced “I see it”).</p> <p>The management of proximal humerus fracture (PHF) provides a useful clinical scenario for developing I-C-IT. There is significant variation in the management of PHF, (<span additionalcitationids="CR34 CR35 CR36" citationid="CR33" class="CitationRef">33</span>–<span citationid="CR37" class="CitationRef">37</span>) which is partially due to a lack of evidence to inform the choice between surgical options or conservative care. (<span citationid="CR38" class="CitationRef">38</span>, <span citationid="CR39" class="CitationRef">39</span>) Meta-analyses across clinical trials seems to validate these concerns, suggesting the comparative effect of surgery versus conservative care is likely heterogenous across patients. (<span citationid="CR36" class="CitationRef">36</span>) Surgical treatment is more costly, increases the risk of surgical complications and mortality, (<span citationid="CR40" class="CitationRef">40</span>) and has not been shown in clinical studies to produce superior pain reduction or functional outcomes for many patients. (<span citationid="CR34" class="CitationRef">34</span>, <span citationid="CR35" class="CitationRef">35</span>) Yet, surgery continues to be used at high rates in many regions of the country. (<span citationid="CR41" class="CitationRef">41</span>, <span citationid="CR42" class="CitationRef">42</span>) It is unclear whether current surgery rates for many subsets of patients with PHF represent over or underutilization, with the key question not being whether surgery or conservative management is “the” best treatment, but rather which treatment is best suited for each patient. (<span additionalcitationids="CR44 CR45 CR46 CR47 CR48" citationid="CR43" class="CitationRef">43</span>–<span citationid="CR49" class="CitationRef">49</span>) Evidence on the comparative effects of alternative treatments that are appropriate for each patient (<span citationid="CR50" class="CitationRef">50</span>) is needed to guide individual treatment choice.</p> <p>In this study, we adopt a human-centered design (HCD) (<span citationid="CR51" class="CitationRef">51</span>, <span citationid="CR52" class="CitationRef">52</span>)approach to identify design requirements and develop the HRS prototype - the I-C-IT for PHF treatment decision support. HCD prioritizes users’ needs and requirements during the system development process and is concerned with ways in which components of interactive systems can enhance human-system interaction. This work builds upon the original ICS concept(<span citationid="CR17" class="CitationRef">17</span>, <span citationid="CR53" class="CitationRef">53</span>) to design and develop a HRS to perform dynamic searches and receive immediate comparative treatment and outcome data summaries to aid in shared treatment decision-making by physicians and patients at the point of care for PHF. In the final stage of the HCD process, we engaged ten orthopaedic surgeons in a mixed methods evaluation of the I-C-IT prototype that was produced.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">2. Methods</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>The HCD process used to develop I-C-IT included 6 steps across three phases of design, analysis, and evaluation (Fig. <span refid="Fig1" class="InternalRef">1</span>). In addition to traditional steps involving process analysis (Step 3), and feedback through usability assessments (Step 6), we used a collaborative design approach where physician end-users were engaged in the design and evaluation process. Table <span refid="Tab1" class="InternalRef">1</span> outlines the HCD phase, steps, and activities performed. A team of informaticians and comparative effectiveness researchers collaborated with input from orthopaedic surgeon subject matter experts. This study was reviewed and approved by the Institutional Review Board at Prisma Health (Protocol #1990879-1), and informed consent to participate was obtained from all study participants.</p> <p>  </p> <p> </p><div class="gridtable"><table float="Yes" id="Tab1" border="1"> <caption language="En"> <div class="CaptionNumber">Table 1</div> <div class="CaptionContent"> <p>Human-centered Design Process for I-C-IT</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Phase</p> </th> <th align="left" colname="c2"> <p>Steps</p> </th> <th align="left" colname="c3"> <p>Activities</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1" morerows="2" rowspan="3"> <p><b>ANALYSIS</b></p> </td> <td align="left" colname="c2"> <p>1. Literature Review of Patient Factors for Reference Class Queries</p> </td> <td align="left" colname="c3"> <p>− 2 Comparative Effectiveness Researchers conducted literature review</p> <p>- Compiled 45 patient characteristics relevant to PHF treatment effectiveness and treatment choice</p> <p>− 4 months to complete</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>2. Clinical Chart Review and Data Modeling</p> </td> <td align="left" colname="c3"> <p>− 5 comparative effectiveness researchers</p> <p>- Manual chart review of 750 patients</p> <p>- Regression modeling, patient characteristics, and treatment choice</p> <p>-7 months to complete</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>3. Ethnographic Study to Understand Orthopaedic Treatment Process</p> </td> <td align="left" colname="c3"> <p>− 2 informatics researchers</p> <p>- Observed 42 patient visits across 2 orthopedic surgeons</p> <p>- Observations recorded about physician workflow, information sources utilized, and decision-making process</p><p>− 4 months to complete</p></td> </tr> <tr> <td align="left" colname="c1" morerows="1" rowspan="2"> <p><b>DESIGN</b></p> </td> <td align="left" colname="c2"> <p>4. Collaborative Design Process to Create Wireframes</p> </td> <td align="left" colname="c3"> <p>− 2 software analysts, 2 informatics researchers, 1 comparative effectiveness researcher</p> <p>- Agile design approach to create wireframes</p> <p>- Biweekly scrum sessions for wireframe design for 6 months</p> <p>- Design feedback collected in 3 iterations with 5 researchers and 4 orthopaedic surgeons</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>5. Informed Development of I-C-IT Webapp Prototype</p> </td> <td align="left" colname="c3"> <p>- Testing performed by 2 Informaticians and 1 Comparative Effectiveness Researcher.</p> <p>- Agile software development approach for 8 months to create prototype HRS.</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>EVALUATE</b></p> </td> <td align="left" colname="c2"> <p>6. Evaluation of I-C-IT design by Orthopaedic Surgeons</p> </td> <td align="left" colname="c3"> <p>− 2 Informaticians and 1 Comparative Effectiveness Researcher</p> <p>− 10 semi-structured qualitative interviews with open-ended questions with orthopaedic surgeons.</p> <p>- NVivo 12 analysis of the interviews’ transcripts and utility survey</p> <p>− 4 months to complete</p> </td> </tr> </tbody> </colgroup> </table></div> <p></p> <p>Step 1. Literature Search of Patient Factors for Reference Class Queries</p> <p> <em>A priori</em> the research team envisioned a system in which physicians apply accumulated wisdom to define the most appropriate reference class for a given patient. To achieve that envisioned design feature, a list of patient factors thought to modify treatment effectiveness was needed. A team of two researchers conducted a search of the literature to identify a list of patient factors associated with treatment effectiveness and treatment choice for PHF. A total of 10 articles were identified and reviewed from PubMed and Web of Sciences databases. Forty-five individual patient factors were identified and grouped into five domains: social independence, bone quality, patient mobility and activity level, surgical risk factors, fracture characteristics. These factors provided a comprehensive list of patient factors that could be used for reference class queries.</p> <p>Step 2. Clinical Chart Review and Data Modeling</p> <p>A team of three comparative effectiveness researchers conducted a manual chart review in the EHR system to extract each of the individual patient factors identified from the literature review. Over 700 patient charts were reviewed. Structured and unstructured data fields were scanned to identify factors of interest. A regression analysis was used to identify the patient factors most relevant to treatment choice and relevant for reference class selection. Step 1 and 2 provided a refined list of patient factors which could be used for reference class identification.</p> <p>Step 3. Ethnographic Study to Understand the Orthopaedic Treatment Process</p> <p>We conducted an ethnographic study (<span citationid="CR54" class="CitationRef">54</span>, <span citationid="CR55" class="CitationRef">55</span>) to understand the process of treatment decision-making for orthopaedic surgeons and identify the decision points during an orthopaedic clinical visit, the design factors for HRS prototype, and elements for reference class for similar patient cohort selection. We shadowed two orthopaedic surgeons with different experience levels (&lt; 15 years and 25 + years) in a large and busy clinical practice for a total of 11 hours encompassing 42 patient visits. The ethnographic study undertaken in this step helped identify the decision points, information elements involved in the treatment decisions, data evidence requirements and other design requirements to guide the design of desired functionality for the proposed I-C-IT system. The team intended to design a tool which would align with the current information seeking and decision-making process undertaken by physicians. This step elucidated key design features for the system, to maximize usability and utility for physicians. Based on observing the data needs, treatment decision-making process, and patient and physician discussions, we theorized the design elements to include data visualizations across three main areas 1) initial treatment utilization patterns and trends, 2) patient-reported outcome comparisons across treatment alternatives, and 3) 1-year healthcare utilization comparisons across treatment alternatives.</p> <p>Step 4. Collaborative Design Process to Create Wireframes</p> <p>Next, we iteratively designed wireframes (i.e., visual mockups) for the I-C-IT prototype using the Adobe XD modeling tool. Two informaticians and three comparative effectiveness researchers conducted agile design sessions consisting of fifteen-day intervals inclusive of wireframe designing, gaining user feedback, prioritizing feedback across researchers, and creating revised designs. The collaborative design process spanned 6 months and produced roughly 15 iterations of I-C-IT.  The resulting wireframes provided a vision for the desired system. This collaborative design process resulted in a system design that allows providers to define appropriate reference classes for a given patient using patient factor filters to query historical data. For that reference class, summarized data visualizations are presented for initial treatment utilization patterns and trends, patient-reported outcome and 1-year healthcare utilization comparisons across treatment groups.</p> <p>At the end of the collaborative design process, 30-minute semi-structured interviews were conducted with four orthopaedic surgeons specializing in shoulder conditions. Physicians feedback on design elements was used to inform design enhancements and help refine overall design features in the I-C-IT prototype wireframes. Examples of enhancements that came from interviews included grouping patient demographic, fracture characteristics, and comorbidities together. Additionally, physicians desired an expanded PHF factor list to include the specific fracture location and amount of displacement, beyond just displacement and the number of fracture parts. On the third tab for healthcare utilization outcomes, one physician suggested adding a data element to report the percentage of initial conservatively managed patients that failed and converted to surgery. Smaller revisions included having treatment comparators in distinct colors to easily contrast treatment groups.</p> <p>Step 5. Informed Development of I-C-IT Webapp Prototype</p> <p>In this step, we developed the first high fidelity webapp prototype of I-C-IT. This prototype was built as a webapp driven by simulated data elements for 2,000 unique patients with PHF. It was designed to support two key future functions. The first function was integration into an EHR by incorporating a Java Script Notation (JSON) framework for patient search criteria and related outcome data. Second, a semantic web framework was applied using data elements in I-C-IT to provide a platform for AI-based algorithms to be implemented to support a background inference engine, while being integrated with EHR systems. Figure <span refid="Fig4" class="InternalRef">2</span> shows images of the I-C-IT Webapp Prototype.</p> <p>  </p> <p>  </p> <p>  </p> <p>Step 6. Evaluation of HRS I-C-IT Prototype Design</p> <p>This phase of the HCD process focused on enhancing the I-C-IT prototype design by gathering feedback from 10 orthopaedic surgeons in a mixed methods study.  We used a purposive, convenience sampling approach to recruit shoulder specialist orthopaedic surgeons from the regional practice network associated with our orthopaedic research group, the Center for Effectiveness Research in Orthopaedics (CERortho). For the purposes of this study we developed and conducted 60-minute qualitative interviews with each orthopaedic surgeon where we asked probing questions surrounding I-C-IT facilitators and barriers of use, and how I-C-IT might enhance their current practice in terms of engaging in shared decision-making (see full interview guide in the Appendix). We conducted a thematic analysis of interview data using the NVivo-12 software and applied a peer debriefing qualitative research method (<span citationid="CR56" class="CitationRef">56</span>). Two interviewers independently reviewed the identified themes and reconciled the analysis to produce final evaluation results. At the end of the interview, we asked participants to complete a standard system usability scale (SUS) questionnaire (<span citationid="CR57" class="CitationRef">57</span>) as well as a customized utility survey to evaluate several associated utility constructs including relevance of reference class filters, ease of navigation and understanding, interpretability of data representations, utility of the system in making evidence informed treatment decisions, and I-C-IT helpfulness in discussion with patients for shared decision-making. Table <span refid="Tab2" class="InternalRef">2</span> provides information on participants that completed the interview and utility survey in Step 6.</p> <p> </p><div class="gridtable"><table float="Yes" id="Tab2" border="1"> <caption language="En"> <div class="CaptionNumber">Table 2</div> <div class="CaptionContent"> <p>Demographics of Physician Participants</p> </div> </caption> <colgroup cols="2"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <thead> <tr> <th align="left" colname="c1"> <p>Physician Characteristic</p> </th> <th align="left" colname="c2"> <p>Number of Physicians</p> </th> </tr> <tr> <th align="left" colname="c1"> <p><em>Physician Age Group</em></p> </th> <th align="left" colname="c2"> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>25–34</p> </td> <td align="char" char="." colname="c2"> <p>4</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>35–44</p> </td> <td align="char" char="." colname="c2"> <p>3</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>45–54</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>55–64</p> </td> <td align="char" char="." colname="c2"> <p>2</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Gender</b></p> </td> <td align="left" colname="c2"> </td> </tr> <tr> <td align="left" colname="c1"> <p>Male</p> </td> <td align="char" char="." colname="c2"> <p>9</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Female</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p><b>Years of Experience</b></p> </td> <td align="left" colname="c2"> </td> </tr> <tr> <td align="left" colname="c1"> <p>Under 5</p> </td> <td align="char" char="." colname="c2"> <p>5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>5–10 Years</p> </td> <td align="char" char="." colname="c2"> <p>2</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>10–15 Years</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>15–20 Years</p> </td> <td align="char" char="." colname="c2"> <p>0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>20–25 Years</p> </td> <td align="char" char="." colname="c2"> <p>0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>25–30 Years</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>30 + Years</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> </tr> </tbody> </colgroup> </table></div> <p></p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">3. Results</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Patient Demographics and Clinical Factors for Reference Class Selection</p> <p>The goal of Step 1 and 2 of the HCD process was to generate a comprehensive list of patient factors that are relevant to treatment effectiveness and choice. The research team identified a total of 45 patient factors that were eventually minimized to 14 based on collaborative design feedback in Step 4. Patient factors selected for inclusion included patient age, gender, injury of the dominant shoulder, fracture displacement, amount of displacement, location(s) of the fracture, number of topographical parts involved, presence of concurrent fractures, patient frailty measured by a history of falls and a subjective frailty assessment, diabetes, dementia, osteoarthritis and whether the patient lives independently.</p> <p>Information Elements for I-C-IT</p> <p>Decisions about what treatment and outcome information to present in the results tabs of I-C-IT were first envisioned during Step 3 and iteratively designed and evaluated in Step 4. Multiple rounds of design and feedback were undertaken, in which discussion centered on information presentation and visualization modification. The final version of I-C-IT (see Fig. <span refid="Fig4" class="InternalRef">2</span>a-c) contains 3 results tabs and a total of 14 data visualizations for the reference class. Table <span refid="Tab3" class="InternalRef">3</span> provides the identified 14 informational elements for use in I-C-IT.</p> <p> </p><div class="gridtable"><table float="Yes" id="Tab3" border="1"> <caption language="En"> <div class="CaptionNumber">Table 3</div> <div class="CaptionContent"> <p>Information Elements for I-C-IT</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Themes in Information Elements</p> </th> <th align="left" colname="c2"> <p>Information Elements</p> </th> <th align="left" colname="c3"> <p>Timeframe</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1" morerows="3" rowspan="4"> <p><em>Initial treatment utilization patterns and trends</em></p> </td> <td align="left" colname="c2"> <p>Initial treatment utilization rates (surgery vs. conservative management)</p> </td> <td align="left" colname="c3"> <p>Overall historic aggregate</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Trends in initial surgery rate over time (shown by physician user and all other users)</p> </td> <td align="left" colname="c3"> <p>Quarter-wise past calendar year</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Physician user historical treatment patterns</p> </td> <td align="left" colname="c3"> <p>Overall historic aggregate</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>High-volume physician treatment patterns</p> </td> <td align="left" colname="c3"> <p>Overall historic aggregate</p> </td> </tr> <tr> <td align="left" colname="c1" morerows="3" rowspan="4"> <p><em>Patient-reported outcome comparisons across treatment alternatives</em></p> </td> <td align="left" colname="c2"> <p>SANE &amp; Constant Scores by treatment groups</p> </td> <td align="left" colname="c3"> <p>3-months, 6-months, 1-year and 2-years</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Pain scores by treatment groups</p> </td> <td align="left" colname="c3"> <p>3-months, 6-months, 1-year and 2-years</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>PROMIS-PF Scores by treatment groups</p> </td> <td align="left" colname="c3"> <p>3-months, 6-months, 1-year and 2-years</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Forward flexion by treatment groups</p> </td> <td align="left" colname="c3"> <p>3-months, 6-months, 1-year and 2-years</p> </td> </tr> <tr> <td align="left" colname="c1" morerows="5" rowspan="6"> <p><em>Healthcare utilization comparisons across treatment alternatives</em></p> </td> <td align="left" colname="c2"> <p>Orthopaedic visit utilization by treatment groups</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Shoulder injections by treatment groups</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Physical therapy visits by treatment groups</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Hospital admissions by treatment groups</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit period</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Percentage of initial conservative management patients converted to surgery</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit</p> </td> </tr> <tr> <td align="left" colname="c2"> <p>Percentage of patients reaching treatment success by treatment groups</p> </td> <td align="left" colname="c3"> <p>Utilization average across 1-year period following index visit</p> </td> </tr> </tbody> </colgroup> </table></div> <p></p> <p>Human-centered Design of I-C-IT</p> <p>The aim of I-C-IT was to provide a clinical decision support tool that could stratify historical patient cohorts and summarize personalized treatment evidence to aid in clinical decision support. The design of the I-C-IT interface contains reference class search criteria on the left-hand side, while on the middle pane it contains various tabs presenting summarized data on treatment utilization, patient-reported outcome measure comparisons, and healthcare utilization for surgical and non-surgical treatment groups within the matched reference class criteria. The prototype was presented to orthopaedic surgeons in this study to assess whether the system captures and presents the design elements needed to support PHF treatment decision-making. Participants affirmed that the main key evidence and decision factors were represented. Future iterations will continue to refine desired system elements and functionality. Also revealed during the HCD process was a set of inductive HCD principles for HRS design to maximize usability and utility in a shared decision-making clinical context and setting. Table <span refid="Tab4" class="InternalRef">4</span> represents the design features as they link to a human factor and design principle for HRS design.</p> <p> </p><div class="gridtable"><table float="Yes" id="Tab4" border="1"> <caption language="En"> <div class="CaptionNumber">Table 4</div> <div class="CaptionContent"> <p>Human-centered Design Principles for HRS</p> </div> </caption> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>I-C-IT Design Features</p> </th> <th align="left" colname="c2"> <p>Human Factors for System Design</p> </th> <th align="left" colname="c3"> <p>Design Principles</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>- Familiar and utilitarian data elements for treatment decisions.</p> <p>- Appropriate feedback on action.</p> <p>- Accuracy and reliability in data analytics.</p> </td> <td align="left" colname="c2"> <p>User trust in data evidence</p> </td> <td align="left" colname="c3"> <p>Predictability</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>- Physicians search history learning (content filtering)</p> <p>- Similar search learning (content and collaborative filtering)</p> <p>- Patient cohort learning (collaborative filtering)</p> <p>- Patient’s treatment outcome preference-based risk benefit profiling of treatment options.</p> </td> <td align="left" colname="c2"> <p>User preference integration</p> </td> <td align="left" colname="c3"> <p>Personalization</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>- Clear data cohort selection with data classifiers on top of visualization pane.</p> <p>- Number of patients in selected cohort (N) dynamically displayed</p> <p>- Information icons to define visualized concepts and metrics.</p> </td> <td align="left" colname="c2"> <p>Increased interpretability and explainability of visual data elements</p> </td> <td align="left" colname="c3"> <p>Transparency</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>- Dynamic searches and cohort selection</p> <p>- Instant visualization update</p> <p>- Quick screen loading</p> <p>- Capability for EHR integrated auto-search for the current patient’s record.</p> </td> <td align="left" colname="c2"> <p>Instant screen updates and intuitive navigation</p> </td> <td align="left" colname="c3"> <p>Latency</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>- Context aware and personalized filtering of data cohort and data visualizations.</p> <p>- Optional search elements for tailored cohort selection.</p> <p>- User (physician) knowledge integration in data elements design.</p> <p>- Intuitive mapping of element labels to real world practice.</p> </td> <td align="left" colname="c2"> <p>Relevant data elements selection and display</p> </td> <td align="left" colname="c3"> <p>Accuracy</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>- Comprehensive visualization of data elements.</p> <p>- Patient provider communication enhancement with visual data evidence for treatment options.</p> <p>- EHR integration capability for increased utility.</p> <p>- User-centered evaluation of design.</p> </td> <td align="left" colname="c2"> <p>Reduced burden of gathering data evidence</p> </td> <td align="left" colname="c3"> <p>Usefulness</p> </td> </tr> </tbody> </colgroup> </table></div> <p></p> <p>Mixed Method Evaluation of Usability and Utility of I-C-IT Webapp Prototype</p> <p>Usability was first addressed with individual orthopaedic surgeons in Step 4 and formally evaluated in Step 6. In the formal evaluation, the overall SUS score for the I-C-IT Webapp prototype was 88.75 indicating high usability (<span citationid="CR58" class="CitationRef">58</span>). The utility survey results indicated overall positive feedback on the design of I-C-IT (Fig. <span refid="Fig5" class="InternalRef">3</span>). The response scores were on a 5-point Likert scale (5 = Strongly Agree to 1 = Strongly Disagree). Most orthopaedic surgeons responded between agree to strongly agree for all questions, indicating mostly strong agreement to questions on ease of navigation, ease of understanding, interpretability, utility of system in making data evidence informed treatment decisions, relevant cohort matching filters, helpfulness in discussion with patients for shared decision-making in orthopaedic treatments, appropriateness of data visualizations for PHFs, and willingness to use a similar system integrated in an EHR in their day to day treatment decisions for other orthopaedic conditions. Elements of shared decision-making were specifically addressed in Question 7, in which 90% of respondents either strongly agreed or agreed that I-C-IT would help them make data informed decisions with their patients (Fig. <span refid="Fig5" class="InternalRef">3</span>).</p> <p>  </p> <p>From the thematic analysis of the qualitative interview data in Step 6 of the HCD design process, a theme emerged surrounding how I-C-IT could enhance PHF treatment decision-making at point of care. Physicians confirmed the availability of tailored data elements and summaries within I-C-IT would facilitate richer conversations with patients about their preferences for outcomes of care and treatment choice. For instance, when asking one physician participant how he approached thinking about treatment decisions, he responded “<em>I think it&#x27;s comorbidities, mechanism, and then patient goals.”</em> This result signaled that beyond the clinical presentation of the patient (comorbidities and fracture characteristics), patient goals are highly relevant for treatment decision-making, and a summative presentation of outcomes would be helpful to share with patients as they weigh treatment choices.</p> <p>Moreover, the amount of shoulder functionality desired by a patient at the end of treatment was described as one major factor in choosing a treatment option. One physician described an example of a functional goal for an older woman, “<em>The majority of the people who break their shoulder are older, and a lot of them are women, and the biggest problem is having difficulties with putting their bra on or combing their hair.”</em> Therefore, the presentation of shoulder range of motion scores in I-C-IT was highly valuable to have available for patient conversations when weighing treatment decisions. Additionally, many physicians consider pain reduction as a primary goal for most PHF patients, thus the availability of pain score outcomes by treatment group was highly desirable to physicians as it will be key for shared decision-making discussions. One physician participant noted how and when the I-C-IT tool could be used to educate and engage in shared decision making with their PHF patients on treatment options, “<em>When I talk to patients, I’d pull this up in a user-friendly way, I can spend 15 min with the patient coaching them in the office.</em>” All physician participants responded positively to the data elements that I-C-IT contained and the ways in which I-C-IT could be used to enhance clinical encounters with their patients.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">4. Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>We describe the HCD approach used to develop I-C-IT, a prototype HRS designed to provide real-time CER-based evidence for the treatment of PHF. The long-term goal for I-C-IT is to improve physicians’ and patients’ ability to make evidence-based data-informed treatment decisions and select the treatment that is best aligned with treatment evidence and patient preferences. I-C-IT offers personalized evidence for the unique patient that is sitting in front of the physician, which provides more tailored information than systematic reviews or meta-analyses on groups of patients that may deviate from the current patient. Visualized data summaries on how similar patients have been treated brings a unique perspective to the clinical encounter that is not currently available and historical data summarized by I-C-IT may reveal previously concealed data relationships and patterns to help overcome common cognitive pitfalls. Further, this patient-specific data will enhance shared decision-making within orthopaedic encounters.</p> <p>Also, I-C-IT delivers up-to-date evidence on rapidly evolving practice trends which is an advancement over the sluggish translation of peer-reviewed literature. In the future, each patient that is treated in clinical practice will be looped back into the I-C-IT data pool for future analysis through recommender system data pipelines, which creates an ongoing learning cycle for personalized visualizations. Thus, future patient treatment choice can be improved from the treatment of patients today. Through ongoing development, HRSs like I-C-IT may be useful for supplementing shared decision-making between physician and patients in making on-demand informatics consults during the clinical encounter at the point of care.</p> <p>I-C-IT is similar in many ways to other decision support applications, though our system differs in a few meaningful ways. First, unlike other systems that depend solely upon computer-based algorithms to phenotype patients (<span citationid="CR59" class="CitationRef">59</span>) or identify patient reference classes, we leverage a physician-driven reference class identification and data recommendation process to summarize information. Machine learning or artificial intelligence-based solutions use statistical methods to group patients by closeness or fit, but these methods are void of physician acumen and intuition. (<span citationid="CR11" class="CitationRef">11</span>, <span citationid="CR60" class="CitationRef">60</span>, <span citationid="CR61" class="CitationRef">61</span>) Computer-based approaches lack transparency in how patient reference classes are defined and can lead to challenges in the ability to explain and interpret results ex post because physicians cannot clearly identify the defining factors used to group patients.(<span citationid="CR62" class="CitationRef">62</span>)</p> <p>Furthermore, there is hesitancy among patients and physicians to use computer-based recommender systems that lack the art of human element of medicine. (<span citationid="CR26" class="CitationRef">26</span>, <span citationid="CR27" class="CitationRef">27</span>) Physicians possess accumulated clinical wisdom on the patient characteristics that are relevant when making treatment decisions. (<span citationid="CR17" class="CitationRef">17</span>, <span citationid="CR63" class="CitationRef">63</span>, <span citationid="CR64" class="CitationRef">64</span>) Because of this unique knowledge, physicians may be better positioned to phenotype or define reference classes of patients. Furthermore, I-C-IT has the capability to track physician reference class search patterns over time and learn from physician behavior to create ‘user profiles’ that exist in most content-filtering recommender systems. This provides the best translation of physician expert knowledge into computerized patterns of patient cohort searches and their specific outcomes. The expertise that a physician “knows what to search for” can be used to train computerized models to automate searches around the index patient in future integrations with EHR systems.</p> <p>Limitations and Future Work</p> <p>Our work is not without limitations. First, this study focuses on the development of a HRS for one orthopaedic condition. More studies are needed to expand the HCD methodology to the development of HRSs for other leading orthopaedic conditions such as atraumatic rotator cuff tears, spine injuries, or knee injuries. We envision that one day I-C-IT, or a future iteration on our HRS, will be embedded within the EHR so that it is readily available and accessible during the clinical encounter. Thus, since our target point of care environment for system use is the clinical encounter, we believe physicians will be the primary end-users. However, the data visualization summaries produced by I-C-IT would also be shared with patients during the clinical encounter, and thus a system evaluation from patients’ perspective is also <em>critical</em> to evaluate the impact of I-C-IT on the overall shared decision-making process at point of care. Finally, for the utility of the system to be thoroughly tested for its real-world application, I-C-IT must be integrated with a dynamic data source that periodically integrates new data evidence, such as the Orthopaedic Data Repository (OPDR) built at the Center for Effectiveness Research in Orthopaedics (CERortho), that contains multiple years of EHR data. The current I-C-IT prototype operates using a limited data set for the purpose of studying physician interactions with the interface. While this work provided significant foundational knowledge for a human centered orthopaedic HRS interface design, follow-on large-scale studies are needed to understand the possible clinical implications of the I-C-IT design and to assess impact of using HRSs such as I-C-IT for treatment decision support in clinical settings.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">5 Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Through this study we described a HCD process for development of a prototype HRS refined for orthopaedic medicine. Historical EHR data holds important answers about how current and future patients might be treated. Informatics consult systems that enable dynamic learning from historical treatment decisions and outcomes hold great potential for improving the quality of care for all orthopaedic patients. However, studies such as the one presented in this paper are needed to build the foundational logic, decision factors, and human-computer interactions required for an HRS to have a positive clinical impact. The foundational design framework of I-C-IT offers a novel paradigm to accelerate learning from historical practice and associated outcomes for orthopaedic conditions.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abbreviations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>EHR: Electronic Health Record</p>
