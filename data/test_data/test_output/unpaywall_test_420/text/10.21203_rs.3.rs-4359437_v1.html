chsquare.com/files/rs-4359437/v1/237c64971d1f560e636a17a5.png"},{"id":56886785,"identity":"83c11cad-53e6-401c-887f-65059546bcf9","added_by":"auto","created_at":"2024-05-21 18:54:56","extension":"png","order_by":2,"title":"Figure 2","display":"","copyAsset":false,"role":"figure","size":689461,"visible":true,"origin":"","legend":"\u003cp\u003ea. I-C-IT Webapp Prototype Screen 1\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eb. I-C-IT Webapp Prototype Screen 2\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003ec. I-C-IT Webapp Prototype Screen 3\u003c/p\u003e\n\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","description":"","filename":"2.png","url":"https://assets-eu.researchsquare.com/files/rs-4359437/v1/b48d64fefa31e90d214070dc.png"},{"id":56886784,"identity":"5d4c7e33-2631-4c9f-bf05-1b4ff036c5ca","added_by":"auto","created_at":"2024-05-21 18:54:56","extension":"png","order_by":3,"title":"Figure 3","display":"","copyAsset":false,"role":"figure","size":97505,"visible":true,"origin":"","legend":"\u003cp\u003eResults of Utility Survey\u003c/p\u003e","description":"","filename":"3.png","url":"https://assets-eu.researchsquare.com/files/rs-4359437/v1/ec56d0e5f3e59b5fb600cf5c.png"},{"id":73693918,"identity":"f6f8bc3d-6920-42dc-b7af-9414b3a1be93","added_by":"auto","created_at":"2025-01-13 16:09:25","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":1577303,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-4359437/v1/649eda81-39d8-4d08-9c97-6321fc0be1ea.pdf"},{"id":56886782,"identity":"25915ad7-d808-4e92-bcc7-05ad484bf9f6","added_by":"auto","created_at":"2024-05-21 18:54:56","extension":"docx","order_by":1,"title":"","display":"","copyAsset":false,"role":"supplement","size":29655,"visible":true,"origin":"","legend":"","description":"","filename":"AppendixInterviewGuide.docx","url":"https://assets-eu.researchsquare.com/files/rs-4359437/v1/16828d837241bca66d29321f.docx"}],"financialInterests":"No competing interests reported.","formattedTitle":"Human-centered Design of a Health Recommender System for Orthopaedic Shoulder Treatment","fulltext":[{"header":"1. Introduction","content":"\u003cp\u003eEvidence-based medicine has advanced significantly since its popularization in the 1990s, (\u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e1\u003c/span\u003e, \u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2\u003c/span\u003e) though many practice-specific gaps remain for the care of individual patients. It is well recognized that treatment effect heterogeneity erodes the value of average treatment effect estimates across groups of diverse patients (\u003cspan additionalcitationids=\"CR4 CR5\" citationid=\"CR3\" class=\"CitationRef\"\u003e3\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e), and a gap remains to generate evidence that applies to individual patients.(\u003cspan additionalcitationids=\"CR8\" citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e) Rich data on diverse patients and their treatments and outcomes stored in Electronic Health Record (EHR) systems can be used to generate real world evidence suited for individual patients(\u003cspan additionalcitationids=\"CR11 CR12 CR13 CR14\" citationid=\"CR10\" class=\"CitationRef\"\u003e10\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e15\u003c/span\u003e) Using historical patient data stored in EHR systems to assist with clinical decision-making was first conceptualized by researchers at Stanford and was referred to as an informatics consult service (ICS).(\u003cspan additionalcitationids=\"CR15 CR16\" citationid=\"CR14\" class=\"CitationRef\"\u003e14\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e) ICSs are designed to summarize historical data to help physicians make data-informed choices for current patients. However, the initial ICSs were focused on questions of prognosis not treatment choice, (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e) and they were not fully automated, requiring a team of researchers and data scientists to field requests and return responses over a period of days. New computing advancements can be applied to fill the analytical gaps of early ICS systems and deliver real-time evidence to guide individual treatment decisions at the point of care.\u003c/p\u003e \u003cp\u003eComparative effectiveness research (CER) has been used to generate evidence about treatment alternatives to inform treatment decision-making. Traditional CER approaches require researchers to generate average treatment effect estimates for a population subgroup or a \u0026ldquo;reference classes\u0026rdquo; based on a combination of measured baseline factors specified prior to estimation. (\u003cspan additionalcitationids=\"CR19\" citationid=\"CR18\" class=\"CitationRef\"\u003e18\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR20\" class=\"CitationRef\"\u003e20\u003c/span\u003e) The need to define reference classes is a significant barrier to finding appropriate treatment effect estimates for individual patients. (\u003cspan citationid=\"CR20\" class=\"CitationRef\"\u003e20\u003c/span\u003e) Even with a small number of measured baseline factors, an individual patient could potentially be placed in an indefinite number of reference classes (\u003cspan additionalcitationids=\"CR20\" citationid=\"CR19\" class=\"CitationRef\"\u003e19\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR21\" class=\"CitationRef\"\u003e21\u003c/span\u003e), and it is often unclear which reference class is best aligned to each patient. (\u003cspan citationid=\"CR19\" class=\"CitationRef\"\u003e19\u003c/span\u003e, \u003cspan additionalcitationids=\"CR22 CR23 CR24\" citationid=\"CR21\" class=\"CitationRef\"\u003e21\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR25\" class=\"CitationRef\"\u003e25\u003c/span\u003e) Here we start from the premise that physicians possess greater accumulated clinical wisdom on the patient factors that impact treatment effectiveness than researchers. (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e, \u003cspan citationid=\"CR26\" class=\"CitationRef\"\u003e26\u003c/span\u003e, \u003cspan citationid=\"CR27\" class=\"CitationRef\"\u003e27\u003c/span\u003e) As such, physicians may be best positioned to define the appropriate reference class for a given patient in a specific setting and need a tool to generate CER-based evidence to summarize outcomes for similar patients under treatment alternatives.\u003c/p\u003e \u003cp\u003eConceptually, Recommender Systems (RSs) provide an effective system foundation for delivering tailored evidence to guide individual decision making. RS are intelligent applications(\u003cspan citationid=\"CR28\" class=\"CitationRef\"\u003e28\u003c/span\u003e) that provide personalized information fit for the end user (\u003cspan citationid=\"CR29\" class=\"CitationRef\"\u003e29\u003c/span\u003e).A health recommender system (HRS) focuses on health-related information needs. The core HRS functionality of selectively presenting or \u0026ldquo;recommending\u0026rdquo; health data can be adapted to the need of presenting clinically appropriate reference class data summaries which closely match each patient being treated (\u003cspan citationid=\"CR30\" class=\"CitationRef\"\u003e30\u003c/span\u003e). Presenting personalized treatment evidence can enable engagement in shared decision-making, a priority goal in orthopaedic medicine.(\u003cspan citationid=\"CR31\" class=\"CitationRef\"\u003e31\u003c/span\u003e) Shared decision-making includes physicians and patients being informed about treatment options, evidence of the treatment effects on outcomes the patient can expect, and patient preferences across outcomes,(\u003cspan citationid=\"CR32\" class=\"CitationRef\"\u003e32\u003c/span\u003e) so that a patient may play an engaged role in their care. HRSs may offer a unique tool to facilitate shared decision-making in orthopaedic encounters, as HRSs can retrieve and present historical reference class patient data summaries that are matched to the individual patient. We use the HRS conceptual foundation to develop a clinical decision support system for orthopaedic medicine, the \u003cem\u003eInformatics Consult for Individualized Treatment\u003c/em\u003e (I-C-IT, pronounced \u0026ldquo;I see it\u0026rdquo;).\u003c/p\u003e \u003cp\u003eThe management of proximal humerus fracture (PHF) provides a useful clinical scenario for developing I-C-IT. There is significant variation in the management of PHF, (\u003cspan additionalcitationids=\"CR34 CR35 CR36\" citationid=\"CR33\" class=\"CitationRef\"\u003e33\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR37\" class=\"CitationRef\"\u003e37\u003c/span\u003e) which is partially due to a lack of evidence to inform the choice between surgical options or conservative care. (\u003cspan citationid=\"CR38\" class=\"CitationRef\"\u003e38\u003c/span\u003e, \u003cspan citationid=\"CR39\" class=\"CitationRef\"\u003e39\u003c/span\u003e) Meta-analyses across clinical trials seems to validate these concerns, suggesting the comparative effect of surgery versus conservative care is likely heterogenous across patients. (\u003cspan citationid=\"CR36\" class=\"CitationRef\"\u003e36\u003c/span\u003e) Surgical treatment is more costly, increases the risk of surgical complications and mortality, (\u003cspan citationid=\"CR40\" class=\"CitationRef\"\u003e40\u003c/span\u003e) and has not been shown in clinical studies to produce superior pain reduction or functional outcomes for many patients. (\u003cspan citationid=\"CR34\" class=\"CitationRef\"\u003e34\u003c/span\u003e, \u003cspan citationid=\"CR35\" class=\"CitationRef\"\u003e35\u003c/span\u003e) Yet, surgery continues to be used at high rates in many regions of the country. (\u003cspan citationid=\"CR41\" class=\"CitationRef\"\u003e41\u003c/span\u003e, \u003cspan citationid=\"CR42\" class=\"CitationRef\"\u003e42\u003c/span\u003e) It is unclear whether current surgery rates for many subsets of patients with PHF represent over or underutilization, with the key question not being whether surgery or conservative management is \u0026ldquo;the\u0026rdquo; best treatment, but rather which treatment is best suited for each patient. (\u003cspan additionalcitationids=\"CR44 CR45 CR46 CR47 CR48\" citationid=\"CR43\" class=\"CitationRef\"\u003e43\u003c/span\u003e\u0026ndash;\u003cspan citationid=\"CR49\" class=\"CitationRef\"\u003e49\u003c/span\u003e) Evidence on the comparative effects of alternative treatments that are appropriate for each patient (\u003cspan citationid=\"CR50\" class=\"CitationRef\"\u003e50\u003c/span\u003e) is needed to guide individual treatment choice.\u003c/p\u003e \u003cp\u003eIn this study, we adopt a human-centered design (HCD) (\u003cspan citationid=\"CR51\" class=\"CitationRef\"\u003e51\u003c/span\u003e, \u003cspan citationid=\"CR52\" class=\"CitationRef\"\u003e52\u003c/span\u003e)approach to identify design requirements and develop the HRS prototype - the I-C-IT for PHF treatment decision support. HCD prioritizes users\u0026rsquo; needs and requirements during the system development process and is concerned with ways in which components of interactive systems can enhance human-system interaction. This work builds upon the original ICS concept(\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e, \u003cspan citationid=\"CR53\" class=\"CitationRef\"\u003e53\u003c/span\u003e) to design and develop a HRS to perform dynamic searches and receive immediate comparative treatment and outcome data summaries to aid in shared treatment decision-making by physicians and patients at the point of care for PHF. In the final stage of the HCD process, we engaged ten orthopaedic surgeons in a mixed methods evaluation of the I-C-IT prototype that was produced.\u003c/p\u003e"},{"header":"2. Methods","content":"\u003cp\u003eThe HCD process used to develop I-C-IT included 6 steps across three phases of design, analysis, and evaluation (Fig.\u0026nbsp;\u003cspan refid=\"Fig1\" class=\"InternalRef\"\u003e1\u003c/span\u003e). In addition to traditional steps involving process analysis (Step 3), and feedback through usability assessments (Step 6), we used a collaborative design approach where physician end-users were engaged in the design and evaluation process. Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e outlines the HCD phase, steps, and activities performed. A team of informaticians and comparative effectiveness researchers collaborated with input from orthopaedic surgeon subject matter experts. This study was reviewed and approved by the Institutional Review Board at Prisma Health (Protocol #1990879-1), and informed consent to participate was obtained from all study participants.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab1\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 1\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eHuman-centered Design Process for I-C-IT\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePhase\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSteps\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eActivities\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\" morerows=\"2\" rowspan=\"3\"\u003e \u003cp\u003e\u003cb\u003eANALYSIS\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e1. Literature Review of Patient Factors for Reference Class Queries\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026minus;\u0026thinsp;2 Comparative Effectiveness Researchers conducted literature review\u003c/p\u003e \u003cp\u003e- Compiled 45 patient characteristics relevant to PHF treatment effectiveness and treatment choice\u003c/p\u003e \u003cp\u003e\u0026minus;\u0026thinsp;4 months to complete\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e2. Clinical Chart Review and Data Modeling\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026minus;\u0026thinsp;5 comparative effectiveness researchers\u003c/p\u003e \u003cp\u003e- Manual chart review of 750 patients\u003c/p\u003e \u003cp\u003e- Regression modeling, patient characteristics, and treatment choice\u003c/p\u003e \u003cp\u003e-7 months to complete\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e3. Ethnographic Study to Understand Orthopaedic Treatment Process\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026minus;\u0026thinsp;2 informatics researchers\u003c/p\u003e \u003cp\u003e- Observed 42 patient visits across 2 orthopedic surgeons\u003c/p\u003e \u003cp\u003e- Observations recorded about physician workflow, information sources utilized, and decision-making process\u003c/p\u003e\u003cp\u003e\u0026minus;\u0026thinsp;4 months to complete\u003c/p\u003e\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\" morerows=\"1\" rowspan=\"2\"\u003e \u003cp\u003e\u003cb\u003eDESIGN\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e4. Collaborative Design Process to Create Wireframes\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026minus;\u0026thinsp;2 software analysts, 2 informatics researchers, 1 comparative effectiveness researcher\u003c/p\u003e \u003cp\u003e- Agile design approach to create wireframes\u003c/p\u003e \u003cp\u003e- Biweekly scrum sessions for wireframe design for 6 months\u003c/p\u003e \u003cp\u003e- Design feedback collected in 3 iterations with 5 researchers and 4 orthopaedic surgeons\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e5. Informed Development of I-C-IT Webapp Prototype\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e- Testing performed by 2 Informaticians and 1 Comparative Effectiveness Researcher.\u003c/p\u003e \u003cp\u003e- Agile software development approach for 8 months to create prototype HRS.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eEVALUATE\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003e6. Evaluation of I-C-IT design by Orthopaedic Surgeons\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e\u0026minus;\u0026thinsp;2 Informaticians and 1 Comparative Effectiveness Researcher\u003c/p\u003e \u003cp\u003e\u0026minus;\u0026thinsp;10 semi-structured qualitative interviews with open-ended questions with orthopaedic surgeons.\u003c/p\u003e \u003cp\u003e- NVivo 12 analysis of the interviews\u0026rsquo; transcripts and utility survey\u003c/p\u003e \u003cp\u003e\u0026minus;\u0026thinsp;4 months to complete\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eStep 1. Literature Search of Patient Factors for Reference Class Queries\u003c/p\u003e \u003cp\u003e \u003cem\u003eA priori\u003c/em\u003e the research team envisioned a system in which physicians apply accumulated wisdom to define the most appropriate reference class for a given patient. To achieve that envisioned design feature, a list of patient factors thought to modify treatment effectiveness was needed. A team of two researchers conducted a search of the literature to identify a list of patient factors associated with treatment effectiveness and treatment choice for PHF. A total of 10 articles were identified and reviewed from PubMed and Web of Sciences databases. Forty-five individual patient factors were identified and grouped into five domains: social independence, bone quality, patient mobility and activity level, surgical risk factors, fracture characteristics. These factors provided a comprehensive list of patient factors that could be used for reference class queries.\u003c/p\u003e \u003cp\u003eStep 2. Clinical Chart Review and Data Modeling\u003c/p\u003e \u003cp\u003eA team of three comparative effectiveness researchers conducted a manual chart review in the EHR system to extract each of the individual patient factors identified from the literature review. Over 700 patient charts were reviewed. Structured and unstructured data fields were scanned to identify factors of interest. A regression analysis was used to identify the patient factors most relevant to treatment choice and relevant for reference class selection. Step 1 and 2 provided a refined list of patient factors which could be used for reference class identification.\u003c/p\u003e \u003cp\u003eStep 3. Ethnographic Study to Understand the Orthopaedic Treatment Process\u003c/p\u003e \u003cp\u003eWe conducted an ethnographic study (\u003cspan citationid=\"CR54\" class=\"CitationRef\"\u003e54\u003c/span\u003e, \u003cspan citationid=\"CR55\" class=\"CitationRef\"\u003e55\u003c/span\u003e) to understand the process of treatment decision-making for orthopaedic surgeons and identify the decision points during an orthopaedic clinical visit, the design factors for HRS prototype, and elements for reference class for similar patient cohort selection. We shadowed two orthopaedic surgeons with different experience levels (\u0026lt;\u0026thinsp;15 years and 25\u0026thinsp;+\u0026thinsp;years) in a large and busy clinical practice for a total of 11 hours encompassing 42 patient visits. The ethnographic study undertaken in this step helped identify the decision points, information elements involved in the treatment decisions, data evidence requirements and other design requirements to guide the design of desired functionality for the proposed I-C-IT system. The team intended to design a tool which would align with the current information seeking and decision-making process undertaken by physicians. This step elucidated key design features for the system, to maximize usability and utility for physicians. Based on observing the data needs, treatment decision-making process, and patient and physician discussions, we theorized the design elements to include data visualizations across three main areas 1) initial treatment utilization patterns and trends, 2) patient-reported outcome comparisons across treatment alternatives, and 3) 1-year healthcare utilization comparisons across treatment alternatives.\u003c/p\u003e \u003cp\u003eStep 4. Collaborative Design Process to Create Wireframes\u003c/p\u003e \u003cp\u003eNext, we iteratively designed wireframes (i.e., visual mockups) for the I-C-IT prototype using the Adobe XD modeling tool. Two informaticians and three comparative effectiveness researchers conducted agile design sessions consisting of fifteen-day intervals inclusive of wireframe designing, gaining user feedback, prioritizing feedback across researchers, and creating revised designs. The collaborative design process spanned 6 months and produced roughly 15 iterations of I-C-IT.  The resulting wireframes provided a vision for the desired system. This collaborative design process resulted in a system design that allows providers to define appropriate reference classes for a given patient using patient factor filters to query historical data. For that reference class, summarized data visualizations are presented for initial treatment utilization patterns and trends, patient-reported outcome and 1-year healthcare utilization comparisons across treatment groups.\u003c/p\u003e \u003cp\u003eAt the end of the collaborative design process, 30-minute semi-structured interviews were conducted with four orthopaedic surgeons specializing in shoulder conditions. Physicians feedback on design elements was used to inform design enhancements and help refine overall design features in the I-C-IT prototype wireframes. Examples of enhancements that came from interviews included grouping patient demographic, fracture characteristics, and comorbidities together. Additionally, physicians desired an expanded PHF factor list to include the specific fracture location and amount of displacement, beyond just displacement and the number of fracture parts. On the third tab for healthcare utilization outcomes, one physician suggested adding a data element to report the percentage of initial conservatively managed patients that failed and converted to surgery. Smaller revisions included having treatment comparators in distinct colors to easily contrast treatment groups.\u003c/p\u003e \u003cp\u003eStep 5. Informed Development of I-C-IT Webapp Prototype\u003c/p\u003e \u003cp\u003eIn this step, we developed the first high fidelity webapp prototype of I-C-IT. This prototype was built as a webapp driven by simulated data elements for 2,000 unique patients with PHF. It was designed to support two key future functions. The first function was integration into an EHR by incorporating a Java Script Notation (JSON) framework for patient search criteria and related outcome data. Second, a semantic web framework was applied using data elements in I-C-IT to provide a platform for AI-based algorithms to be implemented to support a background inference engine, while being integrated with EHR systems. Figure\u0026nbsp;\u003cspan refid=\"Fig4\" class=\"InternalRef\"\u003e2\u003c/span\u003e shows images of the I-C-IT Webapp Prototype.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eStep 6. Evaluation of HRS I-C-IT Prototype Design\u003c/p\u003e \u003cp\u003eThis phase of the HCD process focused on enhancing the I-C-IT prototype design by gathering feedback from 10 orthopaedic surgeons in a mixed methods study.  We used a purposive, convenience sampling approach to recruit shoulder specialist orthopaedic surgeons from the regional practice network associated with our orthopaedic research group, the Center for Effectiveness Research in Orthopaedics (CERortho). For the purposes of this study we developed and conducted 60-minute qualitative interviews with each orthopaedic surgeon where we asked probing questions surrounding I-C-IT facilitators and barriers of use, and how I-C-IT might enhance their current practice in terms of engaging in shared decision-making (see full interview guide in the Appendix). We conducted a thematic analysis of interview data using the NVivo-12 software and applied a peer debriefing qualitative research method (\u003cspan citationid=\"CR56\" class=\"CitationRef\"\u003e56\u003c/span\u003e). Two interviewers independently reviewed the identified themes and reconciled the analysis to produce final evaluation results. At the end of the interview, we asked participants to complete a standard system usability scale (SUS) questionnaire (\u003cspan citationid=\"CR57\" class=\"CitationRef\"\u003e57\u003c/span\u003e) as well as a customized utility survey to evaluate several associated utility constructs including relevance of reference class filters, ease of navigation and understanding, interpretability of data representations, utility of the system in making evidence informed treatment decisions, and I-C-IT helpfulness in discussion with patients for shared decision-making. Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e provides information on participants that completed the interview and utility survey in Step 6.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab2\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 2\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eDemographics of Physician Participants\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"2\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePhysician Characteristic\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eNumber of Physicians\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cem\u003ePhysician Age Group\u003c/em\u003e\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e\u0026nbsp;\u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e25\u0026ndash;34\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e4\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e35\u0026ndash;44\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e3\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e45\u0026ndash;54\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e55\u0026ndash;64\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e2\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eGender\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMale\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e9\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFemale\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e\u003cb\u003eYears of Experience\u003c/b\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eUnder 5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e5\u0026ndash;10 Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e2\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e10\u0026ndash;15 Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e15\u0026ndash;20 Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e20\u0026ndash;25 Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e25\u0026ndash;30 Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e30\u0026thinsp;+\u0026thinsp;Years\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e"},{"header":"3. Results","content":"\u003cp\u003ePatient Demographics and Clinical Factors for Reference Class Selection\u003c/p\u003e \u003cp\u003eThe goal of Step 1 and 2 of the HCD process was to generate a comprehensive list of patient factors that are relevant to treatment effectiveness and choice. The research team identified a total of 45 patient factors that were eventually minimized to 14 based on collaborative design feedback in Step 4. Patient factors selected for inclusion included patient age, gender, injury of the dominant shoulder, fracture displacement, amount of displacement, location(s) of the fracture, number of topographical parts involved, presence of concurrent fractures, patient frailty measured by a history of falls and a subjective frailty assessment, diabetes, dementia, osteoarthritis and whether the patient lives independently.\u003c/p\u003e \u003cp\u003eInformation Elements for I-C-IT\u003c/p\u003e \u003cp\u003eDecisions about what treatment and outcome information to present in the results tabs of I-C-IT were first envisioned during Step 3 and iteratively designed and evaluated in Step 4. Multiple rounds of design and feedback were undertaken, in which discussion centered on information presentation and visualization modification. The final version of I-C-IT (see Fig.\u0026nbsp;\u003cspan refid=\"Fig4\" class=\"InternalRef\"\u003e2\u003c/span\u003ea-c) contains 3 results tabs and a total of 14 data visualizations for the reference class. Table\u0026nbsp;\u003cspan refid=\"Tab3\" class=\"InternalRef\"\u003e3\u003c/span\u003e provides the identified 14 informational elements for use in I-C-IT.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab3\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 3\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eInformation Elements for I-C-IT\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eThemes in Information Elements\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eInformation Elements\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eTimeframe\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\" morerows=\"3\" rowspan=\"4\"\u003e \u003cp\u003e\u003cem\u003eInitial treatment utilization patterns and trends\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eInitial treatment utilization rates (surgery vs. conservative management)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eOverall historic aggregate\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eTrends in initial surgery rate over time (shown by physician user and all other users)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eQuarter-wise past calendar year\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePhysician user historical treatment patterns\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eOverall historic aggregate\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eHigh-volume physician treatment patterns\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eOverall historic aggregate\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\" morerows=\"3\" rowspan=\"4\"\u003e \u003cp\u003e\u003cem\u003ePatient-reported outcome comparisons across treatment alternatives\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eSANE \u0026amp; Constant Scores by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3-months, 6-months, 1-year and 2-years\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePain scores by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3-months, 6-months, 1-year and 2-years\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePROMIS-PF Scores by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3-months, 6-months, 1-year and 2-years\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eForward flexion by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003e3-months, 6-months, 1-year and 2-years\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\" morerows=\"5\" rowspan=\"6\"\u003e \u003cp\u003e\u003cem\u003eHealthcare utilization comparisons across treatment alternatives\u003c/em\u003e\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eOrthopaedic visit utilization by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eShoulder injections by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePhysical therapy visits by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eHospital admissions by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit period\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePercentage of initial conservative management patients converted to surgery\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePercentage of patients reaching treatment success by treatment groups\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUtilization average across 1-year period following index visit\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eHuman-centered Design of I-C-IT\u003c/p\u003e \u003cp\u003eThe aim of I-C-IT was to provide a clinical decision support tool that could stratify historical patient cohorts and summarize personalized treatment evidence to aid in clinical decision support. The design of the I-C-IT interface contains reference class search criteria on the left-hand side, while on the middle pane it contains various tabs presenting summarized data on treatment utilization, patient-reported outcome measure comparisons, and healthcare utilization for surgical and non-surgical treatment groups within the matched reference class criteria. The prototype was presented to orthopaedic surgeons in this study to assess whether the system captures and presents the design elements needed to support PHF treatment decision-making. Participants affirmed that the main key evidence and decision factors were represented. Future iterations will continue to refine desired system elements and functionality. Also revealed during the HCD process was a set of inductive HCD principles for HRS design to maximize usability and utility in a shared decision-making clinical context and setting. Table\u0026nbsp;\u003cspan refid=\"Tab4\" class=\"InternalRef\"\u003e4\u003c/span\u003e represents the design features as they link to a human factor and design principle for HRS design.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab4\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 4\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eHuman-centered Design Principles for HRS\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eI-C-IT Design Features\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eHuman Factors for System Design\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eDesign Principles\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Familiar and utilitarian data elements for treatment decisions.\u003c/p\u003e \u003cp\u003e- Appropriate feedback on action.\u003c/p\u003e \u003cp\u003e- Accuracy and reliability in data analytics.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eUser trust in data evidence\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePredictability\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Physicians search history learning (content filtering)\u003c/p\u003e \u003cp\u003e- Similar search learning (content and collaborative filtering)\u003c/p\u003e \u003cp\u003e- Patient cohort learning (collaborative filtering)\u003c/p\u003e \u003cp\u003e- Patient\u0026rsquo;s treatment outcome preference-based risk benefit profiling of treatment options.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eUser preference integration\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePersonalization\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Clear data cohort selection with data classifiers on top of visualization pane.\u003c/p\u003e \u003cp\u003e- Number of patients in selected cohort (N) dynamically displayed\u003c/p\u003e \u003cp\u003e- Information icons to define visualized concepts and metrics.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eIncreased interpretability and explainability of visual data elements\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eTransparency\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Dynamic searches and cohort selection\u003c/p\u003e \u003cp\u003e- Instant visualization update\u003c/p\u003e \u003cp\u003e- Quick screen loading\u003c/p\u003e \u003cp\u003e- Capability for EHR integrated auto-search for the current patient\u0026rsquo;s record.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eInstant screen updates and intuitive navigation\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eLatency\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Context aware and personalized filtering of data cohort and data visualizations.\u003c/p\u003e \u003cp\u003e- Optional search elements for tailored cohort selection.\u003c/p\u003e \u003cp\u003e- User (physician) knowledge integration in data elements design.\u003c/p\u003e \u003cp\u003e- Intuitive mapping of element labels to real world practice.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eRelevant data elements selection and display\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAccuracy\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e- Comprehensive visualization of data elements.\u003c/p\u003e \u003cp\u003e- Patient provider communication enhancement with visual data evidence for treatment options.\u003c/p\u003e \u003cp\u003e- EHR integration capability for increased utility.\u003c/p\u003e \u003cp\u003e- User-centered evaluation of design.\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eReduced burden of gathering data evidence\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUsefulness\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eMixed Method Evaluation of Usability and Utility of I-C-IT Webapp Prototype\u003c/p\u003e \u003cp\u003eUsability was first addressed with individual orthopaedic surgeons in Step 4 and formally evaluated in Step 6. In the formal evaluation, the overall SUS score for the I-C-IT Webapp prototype was 88.75 indicating high usability (\u003cspan citationid=\"CR58\" class=\"CitationRef\"\u003e58\u003c/span\u003e). The utility survey results indicated overall positive feedback on the design of I-C-IT (Fig.\u0026nbsp;\u003cspan refid=\"Fig5\" class=\"InternalRef\"\u003e3\u003c/span\u003e). The response scores were on a 5-point Likert scale (5\u0026thinsp;=\u0026thinsp;Strongly Agree to 1\u0026thinsp;=\u0026thinsp;Strongly Disagree). Most orthopaedic surgeons responded between agree to strongly agree for all questions, indicating mostly strong agreement to questions on ease of navigation, ease of understanding, interpretability, utility of system in making data evidence informed treatment decisions, relevant cohort matching filters, helpfulness in discussion with patients for shared decision-making in orthopaedic treatments, appropriateness of data visualizations for PHFs, and willingness to use a similar system integrated in an EHR in their day to day treatment decisions for other orthopaedic conditions. Elements of shared decision-making were specifically addressed in Question 7, in which 90% of respondents either strongly agreed or agreed that I-C-IT would help them make data informed decisions with their patients (Fig.\u0026nbsp;\u003cspan refid=\"Fig5\" class=\"InternalRef\"\u003e3\u003c/span\u003e).\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eFrom the thematic analysis of the qualitative interview data in Step 6 of the HCD design process, a theme emerged surrounding how I-C-IT could enhance PHF treatment decision-making at point of care. Physicians confirmed the availability of tailored data elements and summaries within I-C-IT would facilitate richer conversations with patients about their preferences for outcomes of care and treatment choice. For instance, when asking one physician participant how he approached thinking about treatment decisions, he responded \u0026ldquo;\u003cem\u003eI think it's comorbidities, mechanism, and then patient goals.\u0026rdquo;\u003c/em\u003e This result signaled that beyond the clinical presentation of the patient (comorbidities and fracture characteristics), patient goals are highly relevant for treatment decision-making, and a summative presentation of outcomes would be helpful to share with patients as they weigh treatment choices.\u003c/p\u003e \u003cp\u003eMoreover, the amount of shoulder functionality desired by a patient at the end of treatment was described as one major factor in choosing a treatment option. One physician described an example of a functional goal for an older woman, \u0026ldquo;\u003cem\u003eThe majority of the people who break their shoulder are older, and a lot of them are women, and the biggest problem is having difficulties with putting their bra on or combing their hair.\u0026rdquo;\u003c/em\u003e Therefore, the presentation of shoulder range of motion scores in I-C-IT was highly valuable to have available for patient conversations when weighing treatment decisions. Additionally, many physicians consider pain reduction as a primary goal for most PHF patients, thus the availability of pain score outcomes by treatment group was highly desirable to physicians as it will be key for shared decision-making discussions. One physician participant noted how and when the I-C-IT tool could be used to educate and engage in shared decision making with their PHF patients on treatment options, \u0026ldquo;\u003cem\u003eWhen I talk to patients, I\u0026rsquo;d pull this up in a user-friendly way, I can spend 15 min with the patient coaching them in the office.\u003c/em\u003e\u0026rdquo; All physician participants responded positively to the data elements that I-C-IT contained and the ways in which I-C-IT could be used to enhance clinical encounters with their patients.\u003c/p\u003e"},{"header":"4. Discussion","content":"\u003cp\u003eWe describe the HCD approach used to develop I-C-IT, a prototype HRS designed to provide real-time CER-based evidence for the treatment of PHF. The long-term goal for I-C-IT is to improve physicians\u0026rsquo; and patients\u0026rsquo; ability to make evidence-based data-informed treatment decisions and select the treatment that is best aligned with treatment evidence and patient preferences. I-C-IT offers personalized evidence for the unique patient that is sitting in front of the physician, which provides more tailored information than systematic reviews or meta-analyses on groups of patients that may deviate from the current patient. Visualized data summaries on how similar patients have been treated brings a unique perspective to the clinical encounter that is not currently available and historical data summarized by I-C-IT may reveal previously concealed data relationships and patterns to help overcome common cognitive pitfalls. Further, this patient-specific data will enhance shared decision-making within orthopaedic encounters.\u003c/p\u003e \u003cp\u003eAlso, I-C-IT delivers up-to-date evidence on rapidly evolving practice trends which is an advancement over the sluggish translation of peer-reviewed literature. In the future, each patient that is treated in clinical practice will be looped back into the I-C-IT data pool for future analysis through recommender system data pipelines, which creates an ongoing learning cycle for personalized visualizations. Thus, future patient treatment choice can be improved from the treatment of patients today. Through ongoing development, HRSs like I-C-IT may be useful for supplementing shared decision-making between physician and patients in making on-demand informatics consults during the clinical encounter at the point of care.\u003c/p\u003e \u003cp\u003eI-C-IT is similar in many ways to other decision support applications, though our system differs in a few meaningful ways. First, unlike other systems that depend solely upon computer-based algorithms to phenotype patients (\u003cspan citationid=\"CR59\" class=\"CitationRef\"\u003e59\u003c/span\u003e) or identify patient reference classes, we leverage a physician-driven reference class identification and data recommendation process to summarize information. Machine learning or artificial intelligence-based solutions use statistical methods to group patients by closeness or fit, but these methods are void of physician acumen and intuition. (\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e, \u003cspan citationid=\"CR60\" class=\"CitationRef\"\u003e60\u003c/span\u003e, \u003cspan citationid=\"CR61\" class=\"CitationRef\"\u003e61\u003c/span\u003e) Computer-based approaches lack transparency in how patient reference classes are defined and can lead to challenges in the ability to explain and interpret results ex post because physicians cannot clearly identify the defining factors used to group patients.(\u003cspan citationid=\"CR62\" class=\"CitationRef\"\u003e62\u003c/span\u003e)\u003c/p\u003e \u003cp\u003eFurthermore, there is hesitancy among patients and physicians to use computer-based recommender systems that lack the art of human element of medicine. (\u003cspan citationid=\"CR26\" class=\"CitationRef\"\u003e26\u003c/span\u003e, \u003cspan citationid=\"CR27\" class=\"CitationRef\"\u003e27\u003c/span\u003e) Physicians possess accumulated clinical wisdom on the patient characteristics that are relevant when making treatment decisions. (\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e, \u003cspan citationid=\"CR63\" class=\"CitationRef\"\u003e63\u003c/span\u003e, \u003cspan citationid=\"CR64\" class=\"CitationRef\"\u003e64\u003c/span\u003e) Because of this unique knowledge, physicians may be better positioned to phenotype or define reference classes of patients. Furthermore, I-C-IT has the capability to track physician reference class search patterns over time and learn from physician behavior to create \u0026lsquo;user profiles\u0026rsquo; that exist in most content-filtering recommender systems. This provides the best translation of physician expert knowledge into computerized patterns of patient cohort searches and their specific outcomes. The expertise that a physician \u0026ldquo;knows what to search for\u0026rdquo; can be used to train computerized models to automate searches around the index patient in future integrations with EHR systems.\u003c/p\u003e \u003cp\u003eLimitations and Future Work\u003c/p\u003e \u003cp\u003eOur work is not without limitations. First, this study focuses on the development of a HRS for one orthopaedic condition. More studies are needed to expand the HCD methodology to the development of HRSs for other leading orthopaedic conditions such as atraumatic rotator cuff tears, spine injuries, or knee injuries. We envision that one day I-C-IT, or a future iteration on our HRS, will be embedded within the EHR so that it is readily available and accessible during the clinical encounter. Thus, since our target point of care environment for system use is the clinical encounter, we believe physicians will be the primary end-users. However, the data visualization summaries produced by I-C-IT would also be shared with patients during the clinical encounter, and thus a system evaluation from patients\u0026rsquo; perspective is also \u003cem\u003ecritical\u003c/em\u003e to evaluate the impact of I-C-IT on the overall shared decision-making process at point of care. Finally, for the utility of the system to be thoroughly tested for its real-world application, I-C-IT must be integrated with a dynamic data source that periodically integrates new data evidence, such as the Orthopaedic Data Repository (OPDR) built at the Center for Effectiveness Research in Orthopaedics (CERortho), that contains multiple years of EHR data. The current I-C-IT prototype operates using a limited data set for the purpose of studying physician interactions with the interface. While this work provided significant foundational knowledge for a human centered orthopaedic HRS interface design, follow-on large-scale studies are needed to understand the possible clinical implications of the I-C-IT design and to assess impact of using HRSs such as I-C-IT for treatment decision support in clinical settings.\u003c/p\u003e"},{"header":"5 Conclusion","content":"\u003cp\u003eThrough this study we described a HCD process for development of a prototype HRS refined for orthopaedic medicine. Historical EHR data holds important answers about how current and future patients might be treated. Informatics consult systems that enable dynamic learning from historical treatment decisions and outcomes hold great potential for improving the quality of care for all orthopaedic patients. However, studies such as the one presented in this paper are needed to build the foundational logic, decision factors, and human-computer interactions required for an HRS to have a positive clinical impact. The foundational design framework of I-C-IT offers a novel paradigm to accelerate learning from historical practice and associated outcomes for orthopaedic conditions.\u003c/p\u003e"},{"header":"Abbreviations","content":"\u003cp\u003eEHR: Electronic Health Record\u003c/p\u003e\n\u003cp\u003eCER: Comparative effectiveness research\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eRS: Recommender system\u003c/p\u003e\n\u003cp\u003eHRS: Health recommender system\u003c/p\u003e\n\u003cp\u003eI-C-IT:\u0026nbsp;Informatics Consult for Individualized Treatment\u003c/p\u003e\n\u003cp\u003eHCD: Human centered design\u003c/p\u003e\n\u003cp\u003eSUS: System usability scale\u003c/p\u003e\n\u003cp\u003ePHF: Proximal Humerus Fracture\u003c/p\u003e\n\u003cp\u003ePROM: Patient-Reported Outcome Measure\u003c/p\u003e\n\u003cp\u003eSANE: Single Assessment Numeric Evaluation\u003c/p\u003e"},{"header":"Declarations","content":"\u003cp\u003eFunding\u003c/p\u003e\n\u003cp\u003eThis work was partially supported by P20 GM121342 and CERortho internal funding. The funding sources had no role in the design, collection, analysis, or interpretation of the data, or the decision to submit the manuscript for publication. The authors declare no conflict of interest in this study.\u003c/p\u003e\n\u003cp\u003eConflicts of interest:\u0026nbsp;None to disclose.\u003c/p\u003e\n\u003cp\u003eEthics approval and consent to participate: This study was reviewed and approved by the Institutional Review Board at Prisma Health (Protocol #1990879-1). Informed consent to participate was obtained from all study participants.\u003c/p\u003e\n\u003cp\u003eConsent for publication: Not applicable\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAvailability of data and materials: The datasets generated and/or analyzed during the current study are not publicly available due to the ongoing development of the clinical decision support tool but are available from the corresponding author on reasonable request.\u003c/p\u003e\n\u003cp\u003eCompeting interests: The authors declare that they have no competing interests.\u003c/p\u003e\n\u003cp\u003eFunding: This work was supported by P20 GM121342 and the Center for Effectiveness Research in Orthopadics (CERortho). The funding source had no role in the design, collection, analysis, or interpretation of the data, or the decision to submit the manuscript for publication.\u003c/p\u003e\n\u003cp\u003eAuthors\u0026rsquo; contributions: AS, BS, SL, JB and SF all made substantial contributions to the conception of the work, and the analysis and interpretation of the data. JM, PM and SL all made substantial contributions to the data collection and analysis. All authors read, substantially modified, and approved the final manuscript prior to submission.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAcknowledgements: Not applicable\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\n\u003cli\u003eSheridan DJ, Julian DG. Achievements and Limitations of Evidence-Based Medicine. J Am Coll Cardiol. 2016;68(2):204\u0026ndash;13. \u003c/li\u003e\n\u003cli\u003eSackett DL, Rosenberg WMC, Gray JAM, Haynes RB, Richardson WS. Evidence based medic ical evidence for treatment decisions. BMC Med Inform Decis Mak. 2021 Dec 1;21(1):1\u0026ndash;14. \u003c/li\u003e\n\u003cli\u003eVentres W, Kooienga S, Vuckovic N, Marlin R, Nygren P, Stewart V. Physicians, Patients, and the Electronic Health Record: An Ethnographic Analysis. The Annals of Family Medicine [Internet]. 2006 Mar 1 [cited 2024 Apr 21];4(2):124\u0026ndash;31. Available from: https://www.annfammed.org/content/4/2/124\u003c/li\u003e\n\u003cli\u003eGrando A, Manataki A, Furniss SK, Duncan B, Solomon A, Kaufman D, et al. Multi-Method Study of Electronic Health Records Workflows. AMIA Annual Symposium Proceedings [Internet]. 2018 [cited 2024 Apr 21];2018:498. Available from: /pmc/articles/PMC6371265/\u003c/li\u003e\n\u003cli\u003eSpall S, Austin SF. Peer Debriefing in Qualitative Research: Emerging Operational Models. http://dx.doi.org/101177/107780049800400208. 1998 Jun 1;4(2):280\u0026ndash;92. \u003c/li\u003e\n\u003cli\u003eBangor A, Kortum PT, Miller JT. An Empirical Evaluation of the System Usability Scale. International Journal of Human\u0026ndash;Computer Interaction [Internet]. 2008 Jul 30 [cited 2023 Feb 16];24(6):574\u0026ndash;94. Available from: https://www.tandfonline.com/doi/abs/10.1080/10447310802205776\u003c/li\u003e\n\u003cli\u003eBangor A, Kortum P, Miller J. Determining What Individual SUS Scores Mean: Adding an Adjective Rating Scale. J Usability Stud. 2009;4:114\u0026ndash;23. \u003c/li\u003e\n\u003cli\u003eNewton KM, Peissig PL, Kho AN, Bielinski SJ, Berg RL, Choudhary V, et al. Validation of electronic medical record-based phenotyping algorithms: results and lessons learned from the eMERGE network. J Am Med Inform Assoc. 2013;20(e1):147\u0026ndash;54. \u003c/li\u003e\n\u003cli\u003eNg K, Kartoun U, Stavropoulos H, Zambrano JA, Tang PC. Personalized treatment options for chronic diseases using precision cohort analytics. Scientific Reports 2021 11:1. 2021 Jan 13;11(1):1\u0026ndash;13. \u003c/li\u003e\n\u003cli\u003eLee J, Maslove DM, Dubin JA. Personalized mortality prediction driven by electronic medical data and a patient similarity metric. PLoS One. 2015/05/16. 2015;10(5):e0127428. \u003c/li\u003e\n\u003cli\u003eHsa F, Tan NC, Tan WY, Oei RW, Lee ML, Hsu W. Patient similarity analytics for explainable clinical risk prediction. BMC Med Inform Decis Mak. 2021;21:1. \u003c/li\u003e\n\u003cli\u003ePearson H. Science and intuition: do both have a place in clinical decision making? Br J Nurs. 2013/03/02. 2013;22(4):212\u0026ndash;5. \u003c/li\u003e\n\u003cli\u003eJayakumar P, Moore MLG, Bozic KJ. Value-based Healthcare: Can Artificial Intelligence Provide Value in Orthopaedic Surgery? Clin Orthop Relat Res. 2019;477(8):1777\u0026ndash;80. \u003c/li\u003e\n\u003c/ol\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":false,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"journal":{"display":true,"email":"info@researchsquare.com","identity":"bmc-medical-informatics-and-decision-making","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"midm","sideBox":"Learn more about [BMC Medical Informatics and Decision Making](http://bmcmedinformdecismak.biomedcentral.com/)","snPcode":"","submissionUrl":"https://www.editorialmanager.com/midm/default.aspx","title":"BMC Medical Informatics and Decision Making","twitterHandle":"BMC_series","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"em","reportingPortfolio":"BMC Series","inReviewEnabled":true,"inReviewRevisionsEnabled":true},"keywords":"human-centered design, health recommender system, human factors, orthopaedic treatment, personalized medicine, clinical decision support, proximal humerus fracture","lastPublishedDoi":"10.21203/rs.3.rs-4359437/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-4359437/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003ch2\u003eBackground\u003c/h2\u003e \u003cp\u003eRich data on diverse patients and their treatments and outcomes within Electronic Health Record (EHR) systems can be used to generate real world evidence. A health recommender system (HRS) framework can be applied to a decision support system application to generate data summaries for similar patients during the clinical encounter to assist physicians and patients in making evidence-based shared treatment decisions.\u003c/p\u003e\u003ch2\u003eObjective\u003c/h2\u003e \u003cp\u003eA human-centered design (HCD) process was used to develop a HRS for treatment decision support in orthopaedic medicine, the \u003cem\u003eInformatics Consult for Individualized Treatment (I-C-IT)\u003c/em\u003e. We also evaluate the usability and utility of the system from the physician\u0026rsquo;s perspective, focusing on elements of utility and shared decision-making in orthopaedic medicine.\u003c/p\u003e\u003ch2\u003eMethods\u003c/h2\u003e \u003cp\u003eThe HCD process for I-C-IT included 6 steps across three phases of analysis, design, and evaluation. A team of informaticians and comparative effectiveness researchers directly engaged with orthopaedic surgeon subject matter experts in a collaborative I-C-IT prototype design process. Ten orthopaedic surgeons participated in a mixed methods evaluation of the I-C-IT prototype that was produced.\u003c/p\u003e\u003ch2\u003eResults\u003c/h2\u003e \u003cp\u003eThe HCD process resulted in a prototype system, I-C-IT, with 14 data visualization elements and a set of design principles crucial for HRS for decision support. The overall standard system usability scale (SUS) score for the I-C-IT Webapp prototype was 88.75 indicating high usability. In addition, utility questions addressing shared decision-making found that 90% of orthopaedic surgeon respondents either strongly agreed or agreed that I-C-IT would help them make data informed decisions with their patients.\u003c/p\u003e\u003ch2\u003eConclusion\u003c/h2\u003e \u003cp\u003eThe HCD process produced an HRS prototype that is capable of supporting orthopaedic surgeons and patients in their information needs during clinical encounters. Future research should focus on refining I-C-IT by incorporating patient feedback in future iterative cycles of system design and evaluation.\u003c/p\u003e","manuscriptTitle":"Human-centered Design of a Health Recommender System for Orthopaedic Shoulder Treatment","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2024-05-21 18:54:50","doi":"10.21203/rs.3.rs-4359437/v1","editorialEvents":[{"type":"communityComments","content":0},{"type":"decision","content":"Revision requested","date":"2024-11-04T03:38:59+00:00","index":"","fulltext":""},{"type":"reviewerAgreed","content":"136187170499905942075198597163372655113","date":"2024-11-01T17:00:17+00:00","index":"hide","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2024-10-30T21:45:22+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"222460079476321554578593463927947487976","date":"2024-10-29T22:20:18+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"125295263027529016650236652036475937929","date":"2024-09-30T02:27:43+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"128544004743517827762706351317075421844","date":"2024-07-04T13:42:48+00:00","index":"hide","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2024-07-04T11:26:43+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"44054224232446251455182357329615846257","date":"2024-06-16T09:55:56+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"49254018525697035290771214403210274027","date":"2024-06-03T06:32:12+00:00","index":"h
