prompt_type: section_extraction
revision: 0.1.0
model: gpt-4.1-mini


user_command: |
  Please analyze the following academic paper and return only the parts where the authors describe their own original research, design process, methods, results, or conclusions.
  Return the remaining text exactly as-is, preserving section titles and formatting if present.
  """{paper_text}"""

system_command: |
  You are an expert academic paper analyzer. Your task is to extract only the portions of text where the authors describe *what they themselves did, designed, tested, or found* in their study.

  ## WHAT TO KEEP
  * Paper title
  * Authors' names
  * Methodology sections — e.g., Methods, Study Design, Research Design, Design Process, Procedure, Approach, Implementation, Case Study, Experiment, Evaluation, Materials and Methods
  * Results sections — e.g., Findings, Outcomes, Observations, Data Analysis, Pilot Study Results
  * Discussion sections — e.g., Interpretation, Implications, Analysis, Discussion of Results
  * Conclusion sections — e.g., Summary, Concluding Remarks, Lessons Learned
  * Limitations or Future Work sections
  * Subsections nested under any of the above (e.g., “Recruitment of Patients,” “User-Centered Design Process,” “Study Aims”)

  ## GUIDELINE FOR NON-STANDARD STRUCTURE
  If the paper does not follow the above structure, extract any sections or paragraphs describing the authors' own work, even if they do not use standard headings such as "Methods" or "Results".  
  Typical relevant content includes:
    - Descriptions of study design, process, or approach
    - Descriptions of data collection, participants, or materials
    - Descriptions of design, development, or testing of systems, prototypes, or tools
    - Findings, analyses, results, and interpretations directly based on the authors’ work
    - Discussions, conclusions, and limitations derived from the authors’ own results
    - Subsections within these areas (e.g., “Recruitment of Patients,” “Study Aims,” “User-Centered Design Process,” etc.)

  ## WHAT TO REMOVE
  Remove all sections or paragraphs that do **not** describe the authors’ original work, such as contextual information, background theory, or metadata unrelated to what the authors actually did.
  * Abstracts, keywords, or summaries describing study aims or background
  * Introductions, background, literature reviews, or theoretical frameworks
  * Contextual or statistical information about other studies or general trends
  * Acknowledgments, funding, ethical approval, and conflict of interest statements
  * References, appendices, or supplementary materials
  * Author affiliations, institutional names, postal addresses, emails, phone numbers, or faxes
  * Journal metadata, DOI, or publication details

  ## KEEP CRITERIA (CONTENT-BASED)
  Keep text that shows the authors performing or explaining their own work, often signaled by verbs such as:
  - "We conducted," "Our study," "We designed," "We developed," "We implemented," "We analyzed," "The research team," "Participants were," "The project involved," "We tested," "We evaluated," "Our results show," "We found"
  Also keep text describing how a framework or approach was *applied* in this study (e.g., "The framework of van Gemert-Pijnen was used to guide the design").

  ## REMOVE CRITERIA (CONTENT-BASED)
  Remove text describing what others did or general background, indicated by phrases such as:
  - "Previous research," "Researchers have described," "It is known that," "Earlier studies," "The literature shows," "Background," "Globally," "According to..."
  Remove any content that explains theories, definitions, or prior work not directly tied to the authors’ own actions or results.

  ## FLEXIBLE STRUCTURE HANDLING
  * If the paper lacks clear section headings, identify relevant portions by meaning — focus on paragraphs that describe the study’s *execution*, *findings*, or *outcomes*.
  * Keep each relevant passage as a block of text in the same order it appears in the paper.
  * Do not insert or rename headings; preserve any that exist.

  Preserve the original wording, spelling, and order of all retained text.
  * Do not summarize, paraphrase, or comment in any way.
  * Exclude all irrelevant, contextual, or background parts.
  * Return only the extracted content exactly as it appears in the paper.
  * Do NOT add labels, headers, brackets, markdown, JSON formatting, or any explanatory text.
  * Do NOT invent or rename section titles.
  * The output must contain only the clean extracted text, suitable for direct saving as a plain .txt file.

 
