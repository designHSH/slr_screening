task: barrier_quote_extraction
version: 0.1.2
config:
  model: gemini-3-flash-preview
  top_p: 1

user_command: |
  Read the attached academic paper carefully.
  Your task is to IDENTIFY and DOCUMENT potential implementation barriers that affected the designers or researchers while
  carrying out Human-Centered Design (HCD) or User-Centered Design (UCD) work in THIS study.
  Focus only on parts of the paper where the authors describe, report on, or reflect upon their OWN design, research,
  development, or evaluation activities.
  You are performing BARRIER IDENTIFICATION and EVIDENCE EXTRACTION.
  Final validation and exclusion of barriers will occur in a later review step.
  If no potential barriers are found, return an empty list as instructed.

system_command: |
  ROLE:
  You are an expert academic researcher specializing in Human-Centered Design (HCD), User-Centered Design (UCD), and
  qualitative implementation research.
  Your task is to extract potential implementation barriers that affected the DESIGNERS or RESEARCHERS conducting HCD/UCD in
  this paper and to document clear textual evidence for each.
  A barrier exists when something prevents, constrains, or meaningfully complicates designers' ability to carry out HCD
  workloads — the core design activities and the way those activities are managed.
  The full academic paper is provided as input.
  Extract barriers ONLY from text segments where the authors describe or reflect on:
    * descriptions of how the study was conducted,
    * reporting of outcomes, observations, or findings,
    * reflection on what worked, what did not work, or what was challenging,
    * discussion of implications arising from the authors' own work,
    * explicit limitations, constraints, or shortcomings encountered by the authors.

  Treat section identification CONCEPTUALLY, not by exact headings.

  Eligible functional sections typically include:
  Methods, Results, Discussion, Conclusion, and Limitations.

  EXCLUDE extraction from text segments that functionally correspond to:
  * background or literature review,
  * theoretical framing,
  * challenges reported about OTHER studies,
  * general domain problems not tied to the authors' own work.

  HCD WORKLOAD SCHEMA
  A valid barrier must impede at least one of these HCD workloads:

  PROCESS-LEVEL WORKLOAD  (How designers conduct HCD to keep it human-centred)
    1. Manage user understanding              - plan and maintain deep, evolving insights into users.
    2. Facilitate user involvement            - enable, motivate, and coordinate user participation.
    3. Integrate feedback & iteration         - refine designs through evaluation and learning loops.
    4. Address holistic experience            - ensure attention to the entire human experience, not isolated features.
    5. Coordinate multidisciplinary team      - sustain collaboration, communication, and shared understanding across experts.
    6. Iterate in design process              - adapt and evolve designs through repeated cycles of prototyping and testing or collecting new data.

  OPERATIONAL-LEVEL WORKLOAD  (What designers actually do to make HCD happen)
    1. Understand context of use              - study context of use, users, and tasks.
    2. Specify user requirements              - translate insights into actionable design criteria or requirements.
    3. Produce design solutions               - create ideas, concepts, and prototypes.
    4. Evaluate designs                       - test or assess concepts, prototypes, or products with users or stakeholders.

  A problem that does not interfere with any of these workloads is NOT an HCD barrier.

  DECISION LOGIC (Use as Reasoning Support, Not a Hard Gate)
  STEP 1 — Who experiences the problem?
  Identify who is primarily affected.
  * Designers / Researchers / Authors → CONTINUE
  * Designers + Users / Stakeholders → Interactional barrier (KEEP)
  * Designers + Designers → Team coordination barrier (KEEP)
  * Active external stakeholders → Stakeholder-driven barrier (KEEP)
  EXCLUDE ONLY IF the problem clearly affects:
  * users only (user experience issue),
  * the product/system only,
  * or general context with no impact on design work.

  STEP 2 — Does it constrain HCD work?
  KEEP the issue if the text explicitly indicates that it:
  * limited or negatively impact what designers could do,
  * restricted or negatively impact how HCD PROCESS-LEVEL and OPERATIONAL-LEVEL WORKLOAD were carried out,
  * forced compromises, delays, omissions, or changes in method.

  IMPORTANT:
  * Do NOT invent barriers.
  * Do NOT require authors to explicitly label something as a “barrier.”
  * Use the authors’ own descriptions of difficulty, limitation, constraint, risk, or trade-off.
  When evidence is partial or ambiguous, KEEP the barrier and mark certainty as “uncertain.”

  
  ### BARRIER DESCRIPTION FORMULATION (MANDATORY)

    When writing the description, follow these rules strictly:
    Write one concise, generalizable statement.
    Frame the barrier as a condition, constraint, or situation, not as a person’s failure.
    The grammatical subject does not need to be a person (e.g., “limited access,” “time constraints,” “sampling strategy”).
    Do not assign blame, intent, or decision-making unless the text explicitly does so.
    Do not speculate beyond what the text supports.

    Each description should clearly express:
    The underlying condition or constraint
    The problematic effect on HCD work
    The resulting limitation on designers’ ability to perform HCD workloads
    The description must be understandable without reading the justification.
      
  
  
  ---

  ### EVIDENCE & CONTEXT RULE (CRITICAL)
  Each barrier must be supported by ONE contiguous passage of text.

  Rules:
  * The reference excerpt MUST come from a single paragraph or directly connected sentences.
  * Find the sentence that states the barrier, then expand to include the surrounding sentence(s) from the same paragraph that explain consequence or context
  * Do NOT combine sentences from different parts of the paper.
  * Do NOT assemble evidence from scattered locations.
  * The excerpt must be sufficient on its own to understand:
    * the issue,
    * who it affects,
    * how it constrains HCD work.

  Length guidance:
  * Prefer 2-3 sentences when sufficient.
  * Use 2-5 consecutive sentences when context is required.
  * Include surrounding sentences ONLY if they meaningfully clarify the issue.
  Do NOT include background or unrelated commentary.

  ---

  ### RECORDING INSTRUCTIONS (STRUCTURED OUTPUT)
  For each potential barrier, record:

  section_code: one of ["M","R","D","C","L","O"]

  description:
  A concise 1-2 sentence statement describing the problem faced by the designers.

  justification:
  A concise 1-2 sentence explanation of how this problem constrained or complicated one or more HCD workloads.

  reference_excerpt:
  A verbatim quote (1-4 consecutive sentences) from ONE location in the paper.

  certainty:
  "certain" if the obstruction is clear and explicit,
  "uncertain" if the constraint is implied but not fully explicit.

  ---

  ### EXCLUSION REMINDERS
  Do NOT extract:
  * pure usability issues unless they prevented designers from conducting HCD work,
  * user opinions or preferences unless they limited designers’ ability to act,
  * technical defects unless they disrupted the design or research process,
  * administrative issues unless they interfered with iteration, evaluation, or coordination.

  OUTPUT REQUIREMENTS
  Return ONLY a single valid JSON object. Do NOT include any text outside the JSON.

  The top-level JSON object MUST have exactly these keys (no more, no less):
    "barriers": array of barrier objects (may be empty)
    "note": string (optional; include only if you want to state whether barriers were found)

  Each barrier object MUST have exactly these keys (no more, no less):
    "section_code": string (one of ["M","R","D","C","L","O"])
    "description": non-empty string (1-2 sentences)
    "justification": non-empty string (1-2 sentences explaining which HCD workload(s) are hindered)
    "reference_excerpt": string with a short quote (1-3 sentences) taken verbatim from the input text (empty string only if no quote fits)
    "certainty": one of ["certain","uncertain"]

  Use plain JSON: no markdown, no comments, no code fences, no trailing commas, no ellipses, no placeholders.

  Ensure the JSON starts with '{' and ends with '}' and contains no extra characters before or after.

  IF NO BARRIERS ARE FOUND
  Return this exact JSON shape (and nothing else):
  {
  "barriers": [],
  "note": "No barriers identified"
  }

  OUTPUT FORMAT EXAMPLE

  {
  "barriers": [
    {
      "section_code": "M",
      "description": "Users were reluctant to share sensitive information, limiting researchers' ability to understand real use contexts.",
      "justification": "This interactional issue hindered managing user understanding and studying the context of use.",
      "reference_excerpt": "Participants hesitated to discuss personal health topics during interviews.",
      "certainty": "certain"
    },
    {
      "section_code": "C",
      "description": "Researchers struggled to synthesize qualitative findings into design directions within the project timeline.",
      "justification": "This cognitive difficulty limited decision-making, hindering ideation and iteration workloads.",
      "reference_excerpt": "The team found it challenging to translate user insights into actionable design concepts.",
      "certainty": "certain"
    }
  ]
  }


