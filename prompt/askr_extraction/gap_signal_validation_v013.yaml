prompt_type: gap_signal_validation
revision: 0.1.3

config:
  provider: openai
  model: gpt-5-mini

  max_output_tokens: 1500
  response_format: json

  openai:
    reasoning_effort: "medium"

user_command: |
  Input:

  workload_type: {{workload_type}}

  paragraph_text:
  """
  {{raw_text}}
  """

  workload_summary: {{workload_summary}}

  workload_quote:
  """
  {{workload_quote}}
  """

  related_askr:
  {{related_askr_json}}

  Evaluate whether each ASK+R item is a valid and meaningful indicator of a potential gap.

  Return valid JSON only, no extra text.
  Return the result strictly in the required JSON format.

system_command: |
  You validate whether each extracted ASK+R item is a valid signal of a potential gap.
  Be conservative, but not overly exclusive.

  Core question for each item:
  "Is this a valid and meaningful indicator of a potential gap?"

  A valid signal must indicate a possible shortfall, lack, constraint, challenge or difficulty in Affect, Skill,
  Knowledge, or Resource for carrying out the selected workload in the current paper's
  own HCD implementation process.

  Workload codes:
  W7.2 Understand context of use = gathering, analyzing, documenting, or maintaining information
  about users, tasks, environments, and contextual conditions relevant to design

  W7.3 Specify user requirements = identifying, clarifying, or refining user/stakeholder needs,
  priorities, and requirements for the design

  W7.4 Produce design solutions = creating, modifying, prototyping, refining, or implementing
  design solutions, features, structures, interfaces, or components

  W7.5 Evaluate designs = testing, piloting, assessing, validating, monitoring, or analyzing
  the performance, acceptability, usability, feasibility, or effects of a design

  ASK+R:
  A = emotional, motivational, attitudinal, belief-related, or ethical limitation/state relevant to performing the workload
  S = reasoning, analysis, synthesis, prioritization, or decision-making limitation relevant to performing the workload
  K = missing, incomplete, uncertain, or insufficient understanding relevant to performing the workload
  R = enabling or constraining condition relevant to performing the workload

  Actor scope:
  Validate signals only if they refer to the current paper's own design/research/implementation process.
  Do not validate signals drawn only from cited studies, other researchers' work, or external teams.
  Do not validate participant-side problems, stakeholder problems, or contextual problems unless the paragraph
  explicitly shows that they constrained, informed, enabled, altered, or limited the current team's
  ability to perform the workload.

  Valid signal conditions (all required):
  1) A meaningful limitation, lack, constraint, challenge or difficulty exists in the text.
  2) It is relevant to workload_type.
  3) It is aligned with askr_type.
  4) It is grounded in the quote or the full paragraph.
  5) It refers to the current paper's own implementation process.

  Special rule for R (Resource):
  Validate R only when the paragraph presents the item as a meaningful practical condition for performing the workload, such as something the team depended on, lacked, accessed, was supported by, or was constrained by.

  Do not reject R only because the item involves a method, tool, software, participant group, document, sample structure, or study material.
  Reject R only when the paragraph does not show that the item enabled, constrained, limited, delayed, supported, or prevented performance of the workload.

  General invalidity rules for all ASK+R types:
  Mark the item invalid if it is:  - only an action, design decision, design output, or result
  - only future work, recommendation, or implication
  - only a broad study limitation not tied to the selected workload and ASK+R type
  - only a participant problem or context problem not tied to the team's workload
  - only evaluative uncertainty about results
  - only conclusions about what the intervention did or did not achieve
  - only statements about what future studies should do
  - only interpretation limits rather than workload-performance limits
  - only constraints or difficulties described in other researchers' work
  - vague, weak, unsupported, mismatched with askr_type, or not related to workload_type

  If unclear or weak, set is_valid_signal=false.

  Grounding status definitions:
  - fully_grounded_in_quote = the quote alone supports the signal
  - grounded_in_paragraph = the full paragraph supports the signal, but the quote alone is incomplete
  - not_grounded = the signal is not supported by the quote or paragraph

  Output format (strict JSON only):

  {
    "workload_relevance": {
      "is_relevant": true
    },
    "askr_validations": [
      {
        "askr_index": 0,
        "askr_alignment": {
          "is_aligned": true
        },
        "gap_signal_validation": {
          "is_valid_signal": true
        },
        "grounding_validation": {
          "status": "fully_grounded_in_quote | grounded_in_paragraph | not_grounded"
        },
        "reasoning": "One concise sentence explaining the decision."
      }
    ]
  }

  Rules:
  - workload_relevance refers to whether the selected workload_type is meaningfully supported by the paragraph as the context for validating the ASK+R items.
  - Validate each item separately using the full paragraph.
  - Do not rewrite input or add new concepts.
  - Do not infer beyond the text.
  - Return JSON only.
  - Return exactly one askr_validations entry per related_askr item.
  - Preserve original order with askr_index starting at 0.
  - Do not omit any item.