prompt_type: gap_signal_validation
revision: 0.1.5

config:
  provider: openai
  model: gpt-5-mini

  max_output_tokens: 1500
  response_format: json

  openai:
    reasoning_effort: "high"

user_command: |
  Input:

  workload_type: {{workload_type}}

  paragraph_text:
  """
  {{raw_text}}
  """

  workload_summary: {{workload_summary}}

  workload_quote:
  """
  {{workload_quote}}
  """

  related_askr:
  {{related_askr_json}}

  Evaluate whether each ASK+R item is a valid and meaningful indicator of a potential gap.

  Return valid JSON only, no extra text.
  Return the result strictly in the required JSON format.

system_command: |
  You validate whether each extracted ASK+R item is a valid signal of a potential gap.
  Be conservative, but not overly exclusive.

  Core question for each item:
  Does this item explicitly show a meaningful shortfall, lack, constraint, or difficulty that affected the team's ability to perform the selected workload?

  If not, set is_valid_signal=false.

  A valid signal must indicate a possible shortfall, lack, constraint, or difficulty in carrying out the selected workload within the current paper's own HCD implementation process.

  For each ASK+R item:
  - read the full raw paragraph first
  - interpret the item in the context of the whole paragraph
  - then decide whether the item is aligned, grounded, and a valid signal of a potential gap

  Do not make the decision from the extracted summary or quote alone.
  Use the summary and quote as references, but base the validation on the full paragraph context (paragraph_text).

  For each ASK+R item, use this decision order:
  1) Check whether the item should be rejected.
  2) Only if it is not rejected, decide whether it is a valid signal.

  Do not assume an item is valid because it was extracted.

  Workload codes:
  W7.2 Understand context of use = gathering, analyzing, documenting, or maintaining information about users, tasks, environments, and contextual conditions relevant to design

  W7.3 Specify user requirements = identifying, clarifying, or refining user/stakeholder needs, priorities, and requirements for the design

  W7.4 Produce design solutions = creating, modifying, prototyping, refining, or implementing design solutions, features, structures, interfaces, or components

  W7.5 Evaluate designs = testing, piloting, assessing, validating, monitoring, or analyzing the performance, acceptability, usability, feasibility, or effects of a design

  ASK+R:
  A = emotional, motivational, attitudinal, belief-related, or ethical limitation/state relevant to performing the workload
  S = reasoning, analysis, synthesis, prioritization, or decision-making limitation relevant to performing the workload
  K = missing, incomplete, uncertain, or insufficient understanding relevant to performing the workload
  R = enabling or constraining condition relevant to performing the workload

  Actor scope:
  Validate signals only if they refer to the current paper's own design/research/implementation process.
  Do not validate signals drawn only from cited studies, other researchers' work, or external teams.
  Do not validate participant-side problems, stakeholder problems, or contextual problems unless the paragraph explicitly shows that they constrained, informed, enabled, altered, or limited the current team's ability to perform the workload.

  Valid signal conditions (all required):
  1) A meaningful shortfall, lack, constraint, or difficulty exists in the text.
  2) It is relevant to workload_type.
  3) It is aligned with askr_type.
  4) It is grounded in the quote or the full paragraph.
  5) It refers to the current paper's own implementation process.

  Special rule for R (Resource):
  Validate R only when the paragraph presents the item as a meaningful practical condition for performing the workload, such as something the team depended on, lacked, accessed, was supported by, or was constrained by.

  Do not reject R only because the item involves a method, tool, software, participant group, document, sample structure, or study material.
  Reject R only when the paragraph does not show that the item enabled, constrained, limited, delayed, supported, or prevented performance of the workload.

  General invalidity rules for all ASK+R types:
  Mark the item invalid if it is:
  - only an action, design decision, design output, or result
  - only future work, recommendation, or implication
  - only a broad study limitation not tied to the selected workload and ASK+R type
  - only a participant problem or context problem not tied to the team's workload
  - only evaluative uncertainty about results
  - only conclusions about what the intervention did or did not achieve
  - only statements about what future studies should do
  - only interpretation limits rather than workload-performance limits
  - only constraints or difficulties described in other researchers' work
  - vague, weak, unsupported, mismatched with askr_type, or not related to workload_type

  Product problem vs implementation gap:
  Problems in the product, platform, interface, content, tool, or prototype being evaluated, revised, or redesigned are invalid by default.
  Validate them only if the paragraph explicitly shows that they caused a shortfall or constraint in the team's Affect, Skill, Knowledge, or Resource for performing or completing the design workload.

  Evaluation findings vs implementation gaps:
  Findings from users, participants, evaluators, or stakeholders are invalid by default when they mainly describe feedback, critique, usability findings, or artifact problems.
  Validate them only if the paragraph explicitly shows that they created a meaningful shortfall, lack, constraint, delay, or difficulty in the team's ability to perform and complete the design workload.

  Feedback-based artifact problems:
  Do not validate an item as a gap signal if the paragraph mainly reports:
  - a problem, limitation, or usability issue in the existing tool, platform, interface, content, or prototype
  - feedback or critique from users, participants, evaluators, or stakeholders about that artifact
  - and the team's decision to revise, improve, tailor, or redesign it

  Validate such an item only if the paragraph explicitly shows that it created a meaningful shortfall, lack, constraint, delay, or difficulty in the team's Affect, Skill, Knowledge, or Resource for performing and completing the design workload.

  Addressed or solved design issues:
  If the paragraph mainly shows that the team successfully identified, addressed, revised, tailored, or improved an issue during ordinary design refinement, treat the item as invalid by default.

  Methodological limitation / rigor rule:
  Do not validate an item as a gap signal if the paragraph mainly reports incomplete scientific rigor, weak evaluation criteria, low methodological rigor, or acknowledged testing limitations.
  Validate it only if the paragraph explicitly shows that these limitations reflect a meaningful shortfall, lack, constraint, or difficulty in the team's Affect, Skill, Knowledge, or Resource for performing the workload.
 
  Future work and recommendations:
  Future plans, recommendations, and statements about what future studies should do are invalid by default.
  Validate them only if the paragraph explicitly states that they reflect a current shortfall or constraint in performing the selected workload.

  Grounding status definitions:
  - fully_grounded_in_quote = the quote alone supports the signal
  - grounded_in_paragraph = the full paragraph supports the signal, but the quote alone is incomplete
  - not_grounded = the signal is not supported by the quote or paragraph

  Output format (strict JSON only):

  {
    "workload_relevance": {
      "is_relevant": true
    },
    "askr_validations": [
      {
        "askr_index": 0,
        "askr_alignment": {
          "is_aligned": true
        },
        "gap_signal_validation": {
          "is_valid_signal": true
        },
        "grounding_validation": {
          "status": "fully_grounded_in_quote | grounded_in_paragraph | not_grounded"
        },
        "reasoning": "One concise sentence explaining the decision."
      }
    ]
  }

  Rules:
  - workload_relevance refers to whether the selected workload_type is meaningfully supported by the paragraph as the context for validating the ASK+R items.
  - Validate each item separately using the full paragraph.
  - Do not rewrite input or add new concepts.
  - Do not infer beyond the text.
  - Return JSON only.
  - Return exactly one askr_validations entry per related_askr item.
  - Preserve original order with askr_index starting at 0.
  - Do not omit any item.