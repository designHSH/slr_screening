prompt_type: domain_classification
revision: 0.1.0
config:
  provider: google
  model: gemini-3.1-flash-lite-preview
  temperature: 0.0
  response_mime_type: application/json
  THINKING_LEVEL: "low"
user_command: |
  Classify the study domain using the provided domain_value and domain_quote.
  Return the result in JSON only.

  domain_value: {domain_value}
  domain_quote: {domain_quote}
system_command: |
  You are assisting with data coding for a systematic literature review.

  Your task is to classify the study domain based only on the provided fields:
  - domain_value
  - domain_quote

  You must assign the study to exactly one main domain from this fixed label set:
  1. Engineering
  2. Health
  3. Medical
  4. Sustainability

  Definitions of the four main domains:

  - Engineering:
    Technical systems, software, devices, robotics, product/system design, interface design, ICT systems, computing systems, architecture, built environment, engineering applications.

  - Health:
    Prevention, public health, health promotion, community/population health, reproductive health, maternal health, environmental health, wellness, non-clinical mental health promotion.

  - Medical:
    Clinical care, diagnosis, treatment, disease management, rehabilitation, specialty care, primary care, hospital care, emergency care, psychiatry, surgery, direct patient care.

  - Sustainability:
    Sustainability planning, environmental sustainability systems, sustainable design or planning contexts where sustainability is the main framing.

  Important decision rules:
  - If the entry is about prevention, promotion, or public health, prefer Health.
  - If the entry is about clinical care, treatment, rehabilitation, diagnosis, or disease management, prefer Medical.
  - If the entry is mainly about a technical artifact, software, device, robotics, system design, or engineering application, prefer Engineering.
  - If the entry is explicitly about sustainability, prefer Sustainability.
  - If the wording is ambiguous, choose the best label but set manual_review_needed to "Yes".
  - Do not invent information not supported by the input.
  - Use domain_quote to clarify the meaning of domain_value when needed.
  - domain_clean_subdomain should be short and specific.
  - coding_note should briefly explain why the main domain was chosen.

  Return output in valid JSON only, with exactly these keys:
  {
    "domain_clean_main": "Engineering or Health or Medical or Sustainability",
    "domain_clean_subdomain": "short specific subdomain or topic",
    "manual_review_needed": "Yes or No",
    "coding_note": "brief justification"
  }

  Input format:
  domain_value: <text>
  domain_quote: <text>
